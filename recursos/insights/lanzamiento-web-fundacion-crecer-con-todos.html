<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="https://lowsignal.cl/assets/profile.png?v=20261025"><link rel="shortcut icon" href="https://lowsignal.cl/assets/profile.png?v=20261025"><link rel="apple-touch-icon" href="https://lowsignal.cl/assets/profile.png?v=20261025"><title>Insights | lowsignal</title></head><body><script>(async()=>{const slug=location.pathname.split('/').filter(Boolean).pop();const r=await fetch('/recursos/insights-source/'+slug+'.html?v=20261025b',{cache:'no-store'});let s=await r.text();s=s.replace('</head>','<link rel="stylesheet" href="/assets/insight-related-unified.css?v=20261025b"></head>');s=s.replace('</body>',`<script>(()=>{const old=document.querySelector('.article-new-more');if(!old)return;const cards=[...old.querySelectorAll('.article-new-more-grid>a')].map(a=>{const meta=(a.querySelector('span')?.textContent||'INSIGHT').trim();const parts=meta.split('·').map(x=>x.trim());return{href:a.href,img:a.querySelector('img')?.src||'',alt:a.querySelector('img')?.alt||'',category:parts[0]||'INSIGHT',date:parts.slice(1).join(' · '),title:(a.querySelector('h3')?.textContent||'Seguir leyendo').trim()}});const section=document.createElement('section');section.className='article-related-unified';section.innerHTML='<div class="aru-container"><div class="aru-head"><h2>Más insights de lowsignal</h2><a href="https://lowsignal.cl/recursos/insights">Ver todos los insights →</a></div><div class="aru-grid">'+cards.map(c=>'<a class="aru-card" href="'+c.href+'"><figure><img src="'+c.img+'" alt="'+c.alt.replace(/"/g,'&quot;')+'"></figure><div class="aru-meta"><span>'+c.category+'</span><b>'+c.date+'</b></div><h3>'+c.title+'</h3><strong>Leer insight →</strong></a>').join('')+'</div></div>';old.replaceWith(section)})();<\/script></body>`);document.open();document.write(s);document.close();})().catch(()=>location.replace('/recursos/insights'));</script></body></html>
