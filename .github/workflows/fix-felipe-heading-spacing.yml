name: Fix Felipe heading spacing
on:
  push:
    paths:
      - '.github/workflows/fix-felipe-heading-spacing.yml'
      - '.github/scripts/fix_felipe_heading_spacing.py'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix heading spacing
        run: python .github/scripts/fix_felipe_heading_spacing.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add equipo/felipe-quiroz.html
          git diff --cached --quiet || git commit -m "Fix Felipe heading spacing"
          git push
