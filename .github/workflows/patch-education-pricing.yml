name: Patch Education pricing

on:
  push:
    branches:
      - education-pricing-v1
    paths:
      - .github/workflows/patch-education-pricing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: education-pricing-v1

      - name: Insert Education pricing section
        shell: python
        run: |
          from pathlib import Path

          path = Path('industrias/educacion.html')
          text = path.read_text(encoding='utf-8')

          if 'id="planes-education"' in text:
              raise SystemExit('Pricing section already present; no changes needed.')

          css = r'''
<style id="industry-education-pricing-v1">
.edu-pricing{
  padding:108px 0 116px;
  background:#fff;
}
.edu-pricing-head{
  display:grid;
  grid-template-columns:1fr .72fr;
  gap:72px;
  align-items:end;
}
.edu-pricing h2{
  margin:20px 0 0;
  color:#10193C;
  font-size:clamp(36px,3.8vw,52px);
  line-height:1.09;
  letter-spacing:-.043em;
  font-weight:300;
}
.edu-pricing h2 strong{color:#1419E0;font-weight:300}
.edu-pricing-intro{
  margin:0;
  color:#7A86A7;
  font-size:13px;
  line-height:1.72;
  max-width:470px;
}
.edu-pricing-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-top:48px;
  align-items:stretch;
}
.edu-plan{
  position:relative;
  min-height:640px;
  padding:28px;
  border:1px solid #DCE3F2;
  border-radius:18px;
  background:#fff;
  display:flex;
  flex-direction:column;
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.edu-plan:hover{
  transform:translateY(-3px);
  border-color:#C7D2EC;
  box-shadow:0 18px 40px rgba(20,25,224,.07);
}
.edu-plan.is-featured{
  background:#071022;
  border-color:#071022;
  color:#fff;
  box-shadow:0 22px 54px rgba(7,16,34,.13);
}
.edu-plan-badge{
  position:absolute;
  top:20px;
  right:20px;
  padding:7px 10px;
  border-radius:999px;
  background:#EEF0FF;
  color:#1419E0;
  font-size:8px;
  font-weight:700;
  letter-spacing:.14em;
}
.edu-plan.is-featured .edu-plan-badge{
  background:#2637D9;
  color:#DDE4FF;
}
.edu-plan-kicker{
  margin:0;
  color:#5365D9;
  font-size:9px;
  font-weight:700;
  letter-spacing:.16em;
}
.edu-plan.is-featured .edu-plan-kicker{color:#8EA3FF}
.edu-plan h3{
  margin:18px 0 0;
  color:#16204A;
  font-size:24px;
  letter-spacing:-.03em;
  font-weight:500;
}
.edu-plan.is-featured h3{color:#fff}
.edu-plan-desc{
  min-height:64px;
  margin:10px 0 0;
  color:#7A86A7;
  font-size:12px;
  line-height:1.6;
}
.edu-plan.is-featured .edu-plan-desc{color:#95A2C3}
.edu-plan-price{
  display:flex;
  align-items:baseline;
  gap:7px;
  margin-top:28px;
  padding-bottom:24px;
  border-bottom:1px solid #E2E7F2;
}
.edu-plan.is-featured .edu-plan-price{border-bottom-color:rgba(138,164,255,.16)}
.edu-plan-price strong{
  color:#1419E0;
  font-size:42px;
  line-height:1;
  letter-spacing:-.055em;
}
.edu-plan.is-featured .edu-plan-price strong{color:#A8B8FF}
.edu-plan-price span{color:#7A86A7;font-size:11px}
.edu-plan.is-featured .edu-plan-price span{color:#7F8CAD}
.edu-plan ul{
  list-style:none;
  margin:24px 0 0;
  padding:0;
}
.edu-plan li{
  position:relative;
  padding-left:18px;
  color:#596689;
  font-size:12px;
  line-height:1.5;
}
.edu-plan li+li{margin-top:13px}
.edu-plan li:before{
  content:"/";
  position:absolute;
  left:0;
  color:#1419E0;
  font-weight:700;
}
.edu-plan.is-featured li{color:#D5DCF3}
.edu-plan.is-featured li:before{color:#8EA3FF}
.edu-plan-cta{
  width:100%;
  min-height:48px;
  margin-top:auto;
  padding:0 18px;
  border-radius:999px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#EEF0FF;
  color:#17235D;
  font-size:11px;
  font-weight:700;
  transition:transform .2s ease,background .2s ease;
}
.edu-plan-cta:hover{transform:translateY(-2px);background:#E3E7FF}
.edu-plan.is-featured .edu-plan-cta{background:#fff;color:#17235D}
.edu-pricing-note{
  margin:24px 0 0;
  padding-top:20px;
  border-top:1px solid #E2E7F2;
  display:flex;
  justify-content:space-between;
  gap:24px;
  color:#7A86A7;
  font-size:10px;
  line-height:1.55;
}
.edu-pricing-note strong{color:#16204A;font-weight:600}

@media(max-width:980px){
  .edu-pricing-head{grid-template-columns:1fr;gap:24px}
  .edu-pricing-grid{grid-template-columns:1fr}
  .edu-plan{min-height:0}
  .edu-plan-cta{margin-top:30px}
}
@media(max-width:760px){
  .edu-pricing{padding:72px 0}
  .edu-pricing h2{max-width:335px;font-size:31px;line-height:1.09;letter-spacing:-.04em}
  .edu-pricing-grid{margin-top:34px;gap:10px}
  .edu-plan{padding:22px;border-radius:14px}
  .edu-plan h3{font-size:21px}
  .edu-plan-price strong{font-size:36px}
  .edu-pricing-note{flex-direction:column;gap:8px}
}
@media(max-width:390px){
  .edu-pricing h2{max-width:310px;font-size:29px}
}
</style>
'''

          section = r'''
<section class="edu-pricing" id="planes-education">
  <div class="ls-social-shell">
    <div class="edu-pricing-head">
      <div>
        <p class="edu-new-eyebrow">PLANES EDUCATION</p>
        <h2>Una base clara para crecer.<br><strong>Elige cuánto quieres acelerar.</strong></h2>
      </div>
      <p class="edu-pricing-intro">
        Planes mensuales pensados para colegios, redes educativas, fundaciones e instituciones que necesitan presencia, captación y una ejecución consistente durante todo el año.
      </p>
    </div>

    <div class="edu-pricing-grid">
      <article class="edu-plan">
        <p class="edu-plan-kicker">PRESENCE</p>
        <h3>Presencia que se mantiene activa.</h3>
        <p class="edu-plan-desc">Para instituciones que quieren ordenar su comunicación, mantener consistencia y sostener campañas digitales durante el año.</p>
        <div class="edu-plan-price"><strong>5 UF</strong><span>+ IVA / mes</span></div>
        <ul>
          <li>3 jornadas de contenido al año</li>
          <li>2 reels o videos mensuales</li>
          <li>4 posts o carruseles mensuales</li>
          <li>Hasta 8 stories mensuales</li>
          <li>Gestión de redes sociales</li>
          <li>Gestión de Low Ads</li>
          <li>Hasta 2 campañas activas</li>
          <li>Planificación y reporte mensual</li>
        </ul>
        <a class="edu-plan-cta" href="https://calendly.com/felipe-lowsignal/30min" target="_blank" rel="noopener noreferrer">Conversemos</a>
      </article>

      <article class="edu-plan is-featured">
        <span class="edu-plan-badge">RECOMENDADO</span>
        <p class="edu-plan-kicker">GROWTH</p>
        <h3>Captación, contenido y performance conectados.</h3>
        <p class="edu-plan-desc">Para instituciones que quieren transformar marketing digital en más interés, visitas, consultas y oportunidades de admisión.</p>
        <div class="edu-plan-price"><strong>8 UF</strong><span>+ IVA / mes</span></div>
        <ul>
          <li>4 jornadas de contenido al año</li>
          <li>4 reels o videos mensuales</li>
          <li>6 posts o carruseles mensuales</li>
          <li>Hasta 12 stories mensuales</li>
          <li>Gestión de redes sociales</li>
          <li>Gestión y optimización de Low Ads</li>
          <li>Hasta 3 campañas activas</li>
          <li>Campañas especiales de admisión</li>
          <li>Reporte mensual con insights y próximos pasos</li>
        </ul>
        <a class="edu-plan-cta" href="https://calendly.com/felipe-lowsignal/30min" target="_blank" rel="noopener noreferrer">Quiero crecer</a>
      </article>

      <article class="edu-plan">
        <p class="edu-plan-kicker">SCALE</p>
        <h3>Un sistema digital más completo.</h3>
        <p class="edu-plan-desc">Para organizaciones que necesitan mayor frecuencia, soporte prioritario y conectar contenido, campañas, web y automatización.</p>
        <div class="edu-plan-price"><strong>12 UF</strong><span>+ IVA / mes</span></div>
        <ul>
          <li>5 jornadas de contenido al año</li>
          <li>6 reels o videos mensuales</li>
          <li>8 posts o carruseles mensuales</li>
          <li>Hasta 16 stories mensuales</li>
          <li>Gestión de redes sociales</li>
          <li>Gestión y optimización de Low Ads</li>
          <li>Hasta 4 campañas activas</li>
          <li>Soporte web prioritario</li>
          <li>Automatizaciones y seguimiento según alcance</li>
          <li>Dashboard y revisión estratégica</li>
        </ul>
        <a class="edu-plan-cta" href="https://calendly.com/felipe-lowsignal/30min" target="_blank" rel="noopener noreferrer">Hablemos de Scale</a>
      </article>
    </div>

    <div class="edu-pricing-note">
      <span><strong>Inversión publicitaria no incluida.</strong> El presupuesto de Meta, Google u otras plataformas se define según objetivos y campaña.</span>
      <span>¿Necesitas algo distinto? Podemos adaptar el alcance a tu institución.</span>
    </div>
  </div>
</section>
'''

          if '</head>' not in text:
              raise SystemExit('Could not find </head> marker.')
          text = text.replace('</head>', css + '\n</head>', 1)

          marker = '<section class="edu-new-cases">'
          if marker not in text:
              raise SystemExit('Could not find education cases marker.')
          text = text.replace(marker, section + '\n\n  ' + marker, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit pricing section
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add industrias/educacion.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Education pricing plans"
          git push origin HEAD:education-pricing-v1
