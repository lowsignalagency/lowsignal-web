name: Refresh Insights topic filters

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_insights_topic_filters.py'
      - 'scripts/fix_insights_filter_margins.py'
      - '.github/workflows/refresh-insights-topic-filters.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Insights filters
        run: python scripts/add_insights_topic_filters.py
      - name: Align Insights filter margins
        run: python scripts/fix_insights_filter_margins.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recursos/insights.html
          git diff --cached --quiet && exit 0
          git commit -m "Add topic filters to Insights"
          git push
