name: Fix B2C testimonial case arrow
on:
  push:
    paths:
      - '.github/workflows/fix-b2c-case-arrow.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch testimonial case links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('industrias/marcas-b2c.html')
          s = p.read_text()
          s = s.replace('>Ver caso ↗</a>', '><span>Ver caso</span><svg class="testimonial-case-arrow" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 9 9 3M5 3h4v4"/></svg></a>')
          css = '''\n<style id="b2c-testimonial-case-arrow-svg-v1">\n.b2cr-person .testimonial-case{display:inline-flex!important;align-items:center!important;gap:5px!important;margin-left:auto!important;color:#A8B8FF!important;font-size:10px!important;font-weight:700!important;white-space:nowrap!important;line-height:1!important;padding:0!important;border:0!important;background:none!important;border-radius:0!important;min-height:0!important;box-shadow:none!important;transform:none!important;text-decoration:none!important}\n.b2cr-person .testimonial-case .testimonial-case-arrow{width:11px!important;height:11px!important;flex:0 0 11px!important;fill:none!important;stroke:currentColor!important;stroke-width:1.8!important;stroke-linecap:square!important;stroke-linejoin:miter!important}\n@media(max-width:760px){.b2cr-person .testimonial-case{display:none!important}}\n</style>\n'''
          marker = '</head>'
          if 'b2c-testimonial-case-arrow-svg-v1' not in s:
              s = s.replace(marker, css + marker, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add industrias/marcas-b2c.html
          git diff --cached --quiet || git commit -m "Match B2C testimonial case arrow to B2B visual"
          git push
