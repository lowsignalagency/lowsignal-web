name: Run Salvador Dali case refresh v1
on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_salvador_dali_case_v1.py'
      - '.github/workflows/run-refresh-salvador-dali-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/refresh_salvador_dali_case_v1.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add casos/salvador-dali.html
          git diff --cached --quiet || git commit -m "Refresh Salvador Dali customer story"
          git push
