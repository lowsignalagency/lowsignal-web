name: Embed author photo once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/embed-author-photo-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Embed author photo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = [
            'recursos/insights/100-ideas-puestas-en-marcha.html',
            'recursos/insights/6-meses-construyendo-lowsignal.html',
            'recursos/insights/ai-native-startups-platanus.html',
            'recursos/insights/platanus-ai-native-startups-4.html',
            'recursos/insights/tech-founders-ama.html',
          ]
          data='data:image/jpeg;base64,'
          pattern=r'src="https://lowsignal\.cl/assets/felipe-quiroz-author\.jpg(?:\?v=\d+)?"'
          for f in files:
              p=Path(f)
              s=p.read_text()
              s,n=re.subn(pattern,'src="'+data+'"',s)
              if n!=1:
                  raise SystemExit(f'author image replacement failed in {f}: {n}')
              p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'src="data:image/jpeg;base64,/9j/' recursos/insights/platanus-ai-native-startups-4.html
          grep -q 'src="data:image/jpeg;base64,/9j/' recursos/insights/tech-founders-ama.html
      - name: Remove workflow
        run: rm .github/workflows/embed-author-photo-once.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/insights/*.html .github/workflows/embed-author-photo-once.yml
          git commit -m 'fix: embed reliable author photo in Insights articles'
          git push
