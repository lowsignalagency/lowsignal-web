name: Rework Insiders hero
on:
  push:
    paths:
      - .github/scripts/rework_insiders_hero.py
      - .github/workflows/temp-rework-insiders-hero.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Insiders hero rework
        run: python .github/scripts/rework_insiders_hero.py
      - name: Commit changes
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add recursos/insiders.html
          git commit -m "Rework Insiders hero layout" || exit 0
          git push
