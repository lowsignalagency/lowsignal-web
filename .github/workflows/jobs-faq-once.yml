name: Jobs FAQ one-time
on:
  push:
    paths:
      - '.github/workflows/jobs-faq-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace process with FAQ and CTA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('recursos/jobs.html')
          s = p.read_text()

          faq = r'''
  <section class="jobs26-faq" id="faq">
    <div class="container">
      <div class="jobs26-faq-head">
        <p class="jobs26-eyebrow jobs26-eyebrow-light">PREGUNTAS FRECUENTES</p>
        <h2>Antes de postular,<br><strong>quizás te preguntes esto.</strong></h2>
      </div>

      <div class="jobs26-faq-list">
        <details>
          <summary><span>¿Qué buscamos en alguien que se suma?</span><b>+</b></summary>
          <p>Personas curiosas, autónomas y con ganas de hacer que las cosas pasen. Valoramos criterio, iniciativa, velocidad para aprender y capacidad para resolver problemas reales.</p>
        </details>
        <details>
          <summary><span>¿Necesito cumplir todos los requisitos del rol?</span><b>+</b></summary>
          <p>No necesariamente. Nos importa el fit con el desafío, tu forma de pensar y tu capacidad de aprender. Cada posición tiene prioridades distintas.</p>
        </details>
        <details>
          <summary><span>¿Cómo trabajamos?</span><b>+</b></summary>
          <p>Con autonomía, responsabilidad y comunicación directa. Preferimos avanzar, probar y mejorar antes que sumar capas innecesarias de proceso.</p>
        </details>
        <details>
          <summary><span>¿Cómo es el proceso de selección?</span><b>+</b></summary>
          <p>Depende del rol. Normalmente partimos con una conversación para conocernos y entender fit; en algunas posiciones podemos revisar una experiencia, caso o desafío concreto.</p>
        </details>
        <details>
          <summary><span>¿Puedo escribir aunque no vea una posición exacta para mí?</span><b>+</b></summary>
          <p>Sí. Si crees que puedes aportar a lowsignal, puedes escribirnos a <a href="mailto:contacto@lowsignal.cl">contacto@lowsignal.cl</a> y contarnos brevemente qué te interesa construir con nosotros.</p>
        </details>
      </div>
    </div>
  </section>
'''

          cta = r'''
  <section class="jobs26-final-cta">
    <div class="container jobs26-final-cta-inner">
      <p class="jobs26-eyebrow jobs26-eyebrow-light">BUILD WHAT'S NEXT</p>
      <h2>Queremos personas que se muevan rápido y disfruten <strong>resolver problemas difíciles.</strong></h2>
      <div class="jobs26-final-cta-bottom">
        <p>Si te hace sentido, revisa las posiciones abiertas o escríbenos.</p>
        <div class="jobs26-final-cta-actions">
          <a class="jobs26-primary" href="#roles">Ver posiciones abiertas</a>
          <a class="jobs26-secondary" href="mailto:contacto@lowsignal.cl?subject=Quiero%20trabajar%20en%20lowsignal">Escríbenos</a>
        </div>
      </div>
    </div>
  </section>
'''

          s, n1 = re.subn(r'\s*<section class="jobs26-process">.*?</section>\s*', '\n' + faq + '\n', s, count=1, flags=re.S)
          if n1 != 1:
              raise SystemExit(f'process section replacement failed: {n1}')

          s, n2 = re.subn(r'\s*<section class="lsr-band">.*?</section>\s*</main>', '\n' + cta + '\n</main>', s, count=1, flags=re.S)
          if n2 != 1:
              raise SystemExit(f'cta replacement failed: {n2}')

          css = r'''
<style id="jobs26-faq-cta-v1">
.jobs26-faq{padding:108px 0 116px;background:#050505;color:#fff}
.jobs26-faq .container,.jobs26-final-cta .container{width:min(1220px,calc(100% - 128px));max-width:1220px;margin-inline:auto}
.jobs26-faq-head{display:grid;grid-template-columns:.78fr 1.22fr;gap:72px;align-items:end;margin-bottom:54px}
.jobs26-faq-head h2{margin:0;color:#fff;font-size:clamp(34px,3.35vw,46px);line-height:1.09;letter-spacing:-.045em;font-weight:300}
.jobs26-faq-head h2 strong{color:#A8B8FF;font-weight:300}
.jobs26-faq-list{border-top:1px solid rgba(255,255,255,.14)}
.jobs26-faq-list details{border-bottom:1px solid rgba(255,255,255,.14)}
.jobs26-faq-list summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 0;cursor:pointer;color:#F4F6FC;font-size:17px;line-height:1.45;font-weight:400;transition:color .18s ease}
.jobs26-faq-list summary::-webkit-details-marker{display:none}
.jobs26-faq-list summary b{width:30px;height:30px;display:grid;place-items:center;flex:none;color:#6F7891;font-size:28px;font-weight:300;line-height:1;transition:transform .2s ease,color .2s ease}
.jobs26-faq-list details[open] summary b{transform:rotate(45deg);color:#A8B8FF}
.jobs26-faq-list details[open] summary{color:#A8B8FF}
.jobs26-faq-list details>p{max-width:820px;margin:0;padding:0 56px 28px 0;color:#909AB5;font-size:13px;line-height:1.75}
.jobs26-faq-list details>p a{color:#A8B8FF;text-decoration:underline;text-underline-offset:3px}
@media(hover:hover){.jobs26-faq-list summary:hover{color:#A8B8FF}}

.jobs26-final-cta{padding:104px 0 110px;background:#1419E0;color:#fff}
.jobs26-final-cta-inner>h2{max-width:980px;margin:22px 0 0;font-size:clamp(42px,4.65vw,64px);line-height:1.02;letter-spacing:-.052em;font-weight:300;color:#fff}
.jobs26-final-cta-inner>h2 strong{color:#C6D1FF;font-weight:300}
.jobs26-final-cta-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin-top:62px;padding-top:24px;border-top:1px solid rgba(255,255,255,.22)}
.jobs26-final-cta-bottom>p{max-width:520px;margin:0;color:#D6DCFF;font-size:14px;line-height:1.7}
.jobs26-final-cta-actions{display:flex;gap:10px;flex-wrap:wrap}
.jobs26-final-cta .jobs26-primary{background:#fff;color:#1419E0}
.jobs26-final-cta .jobs26-secondary{border-color:rgba(255,255,255,.35);color:#fff}

@media(max-width:1100px){
  .jobs26-faq .container,.jobs26-final-cta .container{width:calc(100% - 48px)}
}
@media(max-width:760px){
  .jobs26-faq,.jobs26-final-cta{padding:72px 0}
  .jobs26-faq .container,.jobs26-final-cta .container{width:calc(100% - 40px)}
  .jobs26-faq-head{grid-template-columns:1fr;gap:18px;margin-bottom:36px}
  .jobs26-faq-head h2{font-size:28px;max-width:320px}
  .jobs26-faq-list summary{padding:22px 0;font-size:15px;gap:18px}
  .jobs26-faq-list summary b{font-size:24px;width:26px;height:26px}
  .jobs26-faq-list details>p{padding:0 34px 22px 0;font-size:12.5px}
  .jobs26-final-cta-inner>h2{font-size:34px;max-width:340px}
  .jobs26-final-cta-bottom{flex-direction:column;align-items:flex-start;margin-top:42px}
  .jobs26-final-cta-actions{width:100%;flex-direction:column}
  .jobs26-final-cta-actions a{width:100%}
}
</style>
'''

          s = re.sub(r'\s*<style id="jobs26-faq-cta-v1">.*?</style>\s*', '\n', s, flags=re.S)
          s = s.replace('</body>', css + '\n</body>', 1)
          p.write_text(s)
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/jobs-faq-once.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/jobs.html .github/workflows/jobs-faq-once.yml
          git commit -m 'feat: replace Jobs process with FAQ and stronger CTA'
          git push
