name: Simplify Growth Ambassador hero once
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Growth Ambassador hero
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          p = Path('recursos/jobs/growth-ambassador.html')
          t = p.read_text(encoding='utf-8')
          t2, n = re.subn(r'\s*<aside class="ga26-summary">.*?</aside>', '', t, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('ga26-summary not found')
          cta = base64.b64decode('PGEgY2xhc3M9ImdhMjYtYXBwbHkiIGhyZWY9Im1haWx0bzpjb250YWN0b0Bsb3dzaWduYWwuY2w/c3ViamVjdD1Qb3N0dWxhY2klQzMlQjNuJTIwR3Jvd3RoJTIwQW1iYXNzYWRvciI+UG9zdHVsYXIgPHNwYW4gYXJpYS1oaWRkZW49InRydWUiPuKGlzwvc3Bhbj48L2E+').decode()
          needle = '<div class="ga26-pills"><span>Remoto</span><span>Flexible</span><span>Sin experiencia previa</span><span>Variable por resultados</span></div>'
          if needle not in t2:
              raise SystemExit('pills block not found')
          t2 = t2.replace(needle, needle + '\n        ' + cta, 1)
          css = base64.b64decode('').decode()
          t2 = re.sub(r'\n?<style id="ga26-hero-simplified-v1">.*?</style>\n?', '\n', t2, flags=re.S)
          t2 = t2.replace('</head>', css + '\n</head>', 1)
          p.write_text(t2, encoding='utf-8')
          PY
      - name: Commit
        run: |
          rm .github/workflows/simplify-growth-ambassador-hero-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recursos/jobs/growth-ambassador.html .github/workflows/simplify-growth-ambassador-hero-once.yml
          git commit -m "fix: simplify Growth Ambassador hero CTA"
          git push
