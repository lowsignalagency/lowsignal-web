name: Simplify Growth Ambassador hero once

on:
  push:
    paths:
      - '.github/workflows/simplify-growth-ambassador-hero-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify hero and add apply CTA
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('recursos/jobs/growth-ambassador.html')
          text = path.read_text(encoding='utf-8')

          old = '''        <div class="ga26-pills"><span>Remoto</span><span>Flexible</span><span>Sin experiencia previa</span><span>Variable por resultados</span></div>
      </div>
      <aside class="ga26-summary">
        <span>EL OBJETIVO</span>
        <strong>Abre la conversación.</strong>
        <p>Tú generas la oportunidad. Desde la reunión en adelante, el equipo de lowsignal se encarga de propuesta, negociación y cierre.</p>
        <a href="mailto:contacto@lowsignal.cl?subject=Postulaci%C3%B3n%20Growth%20Ambassador">Postular ↗</a>
      </aside>'''

          new = '''        <div class="ga26-pills"><span>Remoto</span><span>Flexible</span><span>Sin experiencia previa</span><span>Variable por resultados</span></div>
        <a class="ga26-apply" href="mailto:contacto@lowsignal.cl?subject=Postulaci%C3%B3n%20Growth%20Ambassador">Postular <span aria-hidden="true">↗</span></a>
      </div>'''

          if old not in text:
              raise SystemExit('Expected Growth Ambassador hero block not found')
          text = text.replace(old, new, 1)

          css = '''
<style id="ga26-hero-simplified-v1">
/* Growth Ambassador hero — single-column, cleaner application CTA */
.ga26-hero-grid{
  display:block !important;
}
.ga26-hero-grid > div{
  max-width:760px;
}
.ga26-apply{
  margin-top:34px;
  min-height:50px;
  padding:0 22px;
  width:max-content;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border:1px solid rgba(255,255,255,.92);
  border-radius:999px;
  background:#fff;
  color:#1419E0;
  font-size:13px;
  font-weight:650;
  transition:transform .2s ease, box-shadow .2s ease, background-color .2s ease, color .2s ease;
}
.ga26-apply span{
  transition:transform .2s ease;
}
@media(hover:hover){
  .ga26-apply:hover{
    transform:translateY(-3px);
    background:#EEF3FF;
    color:#0F1F8C;
    box-shadow:0 14px 30px rgba(0,0,0,.20);
  }
  .ga26-apply:hover span{
    transform:translate(2px,-2px);
  }
}
.ga26-apply:active{
  transform:translateY(0) scale(.985);
}
.ga26-apply:focus-visible{
  outline:2px solid #8EA3FF;
  outline-offset:4px;
}
@media(max-width:760px){
  .ga26-hero-grid > div{max-width:none}
  .ga26-apply{margin-top:28px;min-height:48px;padding:0 20px}
}
</style>
'''
          text = text.replace('</head>', css + '\n</head>', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/simplify-growth-ambassador-hero-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recursos/jobs/growth-ambassador.html .github/workflows/simplify-growth-ambassador-hero-once.yml
          git commit -m "fix: simplify Growth Ambassador hero CTA"
          git push
