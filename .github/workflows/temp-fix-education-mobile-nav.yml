name: Fix Education mobile nav
on:
  push:
    paths:
      - '.github/scripts/fix_education_mobile_nav.py'
      - '.github/workflows/temp-fix-education-mobile-nav.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/fix_education_mobile_nav.py
      - run: git config user.name lowsignal-bot
      - run: git config user.email actions@users.noreply.github.com
      - run: git add industrias/educacion.html
      - run: git commit -m 'Fix Education mobile nav'
        continue-on-error: true
      - run: git push
