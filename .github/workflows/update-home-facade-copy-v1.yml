name: Update Home Facade Copy v1

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/update_home_facade_copy_v1.py'
      - '.github/workflows/update-home-facade-copy-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-home:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Home facade copy refresh
        run: python .github/scripts/update_home_facade_copy_v1.py

      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh Home facade copy"
          git push
