name: Jobs CSS cache bust once
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force latest shared Jobs styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in [Path('recursos/jobs.html'), Path('recursos/jobs/growth-ambassador.html')]:
              s = path.read_text()
              s = s.replace('\\n<link rel="stylesheet" href="https://lowsignal.cl/assets/jobs-page-fixes.css">', '<link rel="stylesheet" href="https://lowsignal.cl/assets/jobs-page-fixes.css?v=4">')
              s = s.replace('<link rel="stylesheet" href="https://lowsignal.cl/assets/jobs-page-fixes.css">', '<link rel="stylesheet" href="https://lowsignal.cl/assets/jobs-page-fixes.css?v=4">')
              path.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/jobs-css-cache-bust-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/jobs.html recursos/jobs/growth-ambassador.html .github/workflows/jobs-css-cache-bust-once.yml
          git commit -m 'fix: force latest Jobs FAQ and footer styles'
          git push