name: Fix Salvador Dali logo on home

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-dali-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-dali-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Dali logo treatment
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Force the exact requested Dalí asset anywhere the home still references an older variant.
          for old in [
              'https://lowsignal.cl/assets/logo-CSD-blanco%20(1).png',
              'https://lowsignal.cl/assets/CSD-Logo.png',
              'https://lowsignal.cl/assets/salvador-dali.png',
              'https://lowsignal.cl/assets/logo-dali-darkbg.png'
          ]:
              s = s.replace(old, 'https://lowsignal.cl/assets/logo-dali-maipu.png')

          # Remove old Dalí-specific patches so the final rule below is the only source of truth.
          for style_id in [
              'home-v140-client-logo-white-fix',
              'home-dali-logo-detail-fix-v1',
              'home-dali-logo-detail-fix-v2',
              'home-dali-logo-final-v2'
          ]:
              s = re.sub(rf'\s*<style id="{style_id}">.*?</style>', '', s, flags=re.S)

          fix = '''\n<style id="home-dali-logo-final-v2">\n/* Dalí keeps its original detailed artwork; do not apply the global white-logo filter. */\n.lsr-trust-marquee .lsr-trust-logos .lsr-trust-logo:nth-child(2) img,\n.lsr-trust-logo:nth-child(2) img,\n.home26-client-logos .home26-client-logo-item:nth-child(2) img{\n  filter:none !important;\n  opacity:1 !important;\n  mix-blend-mode:normal !important;\n  width:auto !important;\n  height:auto !important;\n  max-width:150px !important;\n  max-height:38px !important;\n  object-fit:contain !important;\n  transform:none !important;\n}\n@media(max-width:760px){\n  .lsr-trust-marquee .lsr-trust-logos .lsr-trust-logo:nth-child(2) img,\n  .lsr-trust-logo:nth-child(2) img,\n  .home26-client-logos .home26-client-logo-item:nth-child(2) img{\n    max-width:128px !important;\n    max-height:32px !important;\n  }\n}\n</style>\n'''
          s = s.replace('</head>', fix + '\n</head>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use detailed Salvador Dali logo on home"
          git push
