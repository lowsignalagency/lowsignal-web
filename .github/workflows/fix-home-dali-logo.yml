name: Restore Salvador Dali logo on home

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-dali-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-dali-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore historical Dali logo treatment
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Restore the exact white asset historically used on the home.
          for old in [
              'https://lowsignal.cl/assets/logo-dali-maipu.png',
              'https://lowsignal.cl/assets/CSD-Logo.png',
              'https://lowsignal.cl/assets/salvador-dali.png',
              'https://lowsignal.cl/assets/logo-dali-darkbg.png'
          ]:
              s = s.replace(old, 'https://lowsignal.cl/assets/logo-CSD-blanco%20(1).png')

          # Remove every later Dali-specific override we added.
          for style_id in [
              'home-v140-client-logo-white-fix',
              'home-dali-logo-detail-fix-v1',
              'home-dali-logo-detail-fix-v2',
              'home-dali-logo-final-v2',
              'home-dali-logo-optical-v3',
              'home-dali-logo-white-type-v4',
              'home-dali-logo-single-v5'
          ]:
              s = re.sub(rf'\s*<style id="{style_id}">.*?</style>', '', s, flags=re.S)

          # Restore the historical rule from before the recent logo experiments.
          fix = '''\n<style id="home-v140-client-logo-white-fix">\n/* Historical home treatment for Colegio Salvador Dalí. */\n.home26-client-logos .home26-client-logo-item:nth-child(2) img{\n  filter:brightness(0) invert(1) contrast(1.08) !important;\n  opacity:1 !important;\n}\n</style>\n'''
          s = s.replace('</head>', fix + '\n</head>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore historical white Dali logo"
          git push
