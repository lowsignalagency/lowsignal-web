name: Remove Salvador Dali logo from home

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-dali-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-dali-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Dali logo from home trust strip
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove all Dalí-specific CSS treatments added during the logo experiments.
          for style_id in [
              'home-v140-client-logo-white-fix',
              'home-dali-logo-detail-fix-v1',
              'home-dali-logo-detail-fix-v2',
              'home-dali-logo-final-v2',
              'home-dali-logo-optical-v3',
              'home-dali-logo-white-type-v4',
              'home-dali-logo-single-v5',
              'home-dali-logo-gray-face-v6',
              'home-dali-logo-gray-face-v7',
              'home-dali-logo-gray-face-v8',
              'home-dali-logo-single-v9',
              'home-dali-logo-svg-v10',
              'home-dali-logo-svg-v11',
              'home-dali-logo-svg-v12',
              'home-dali-logo-svg-v13'
          ]:
              s = re.sub(rf'\s*<style id="{style_id}">.*?</style>', '', s, flags=re.S)

          # Remove any injected Dalí SVG from the home.
          s = re.sub(r'\s*<svg class="dali-home-logo".*?</svg>', '', s, flags=re.S)

          # Remove any direct Dalí image variants that may still be present in the home.
          s = re.sub(
              r'\s*<img\s+[^>]*src="https://lowsignal\.cl/assets/(?:logo-dali-maipu\.png|logo-CSD-blanco%20\(1\)\.png|CSD-Logo\.png|salvador-dali\.png|logo-dali-darkbg\.png)"[^>]*>',
              '',
              s
          )

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove Salvador Dali logo from home"
          git push
