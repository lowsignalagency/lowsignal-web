name: Restore Salvador Dali logo on home

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-dali-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-dali-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore gray-face Dali logo treatment
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Use the detailed Dalí artwork as the base so the face keeps tonal information.
          for old in [
              'https://lowsignal.cl/assets/logo-CSD-blanco%20(1).png',
              'https://lowsignal.cl/assets/CSD-Logo.png',
              'https://lowsignal.cl/assets/salvador-dali.png',
              'https://lowsignal.cl/assets/logo-dali-darkbg.png'
          ]:
              s = s.replace(old, 'https://lowsignal.cl/assets/logo-dali-maipu.png')

          # Remove all earlier Dalí-specific treatments so only this version can win.
          for style_id in [
              'home-v140-client-logo-white-fix',
              'home-dali-logo-detail-fix-v1',
              'home-dali-logo-detail-fix-v2',
              'home-dali-logo-final-v2',
              'home-dali-logo-optical-v3',
              'home-dali-logo-white-type-v4',
              'home-dali-logo-single-v5',
              'home-dali-logo-gray-face-v6',
              'home-dali-logo-gray-face-v7'
          ]:
              s = re.sub(rf'\s*<style id="{style_id}">.*?</style>', '', s, flags=re.S)

          fix = '''\n<style id="home-dali-logo-gray-face-v7">\n/* Colegio Salvador Dalí: gray face + bright lettering on dark backgrounds. */\n.lsr-trust-marquee .lsr-trust-logos .lsr-trust-logo:nth-child(2),\n.lsr-trust-logo:nth-child(2),\n.home26-client-logos .home26-client-logo-item:nth-child(2){\n  position:relative !important;\n  overflow:visible !important;\n}\n\n/* Detailed base: keep facial features in gray instead of flattening them to white. */\n.lsr-trust-marquee .lsr-trust-logos .lsr-trust-logo:nth-child(2) img,\n.lsr-trust-logo:nth-child(2) img,\n.home26-client-logos .home26-client-logo-item:nth-child(2) img{\n  filter:grayscale(1) brightness(1.12) contrast(1.12) !important;\n  opacity:.94 !important;\n  mix-blend-mode:normal !important;\n  width:auto !important;\n  height:auto !important;\n  max-width:138px !important;\n  max-height:36px !important;\n  object-fit:contain !important;\n  transform:none !important;\n}\n\n/* White treatment only over the wordmark zone. The first 23% stays untouched,\n   preserving the face as gray while making the letters read clearly in white. */\n.lsr-trust-marquee .lsr-trust-logos .lsr-trust-logo:nth-child(2)::after,\n.lsr-trust-logo:nth-child(2)::after,\n.home26-client-logos .home26-client-logo-item:nth-child(2)::after{\n  content:\"\" !important;\n  position:absolute !important;\n  inset:0 !important;\n  display:block !important;\n  pointer-events:none !important;\n  background-image:url('https://lowsignal.cl/assets/logo-dali-maipu.png') !important;\n  background-repeat:no-repeat !important;\n  background-position:center !important;\n  background-size:138px 36px !important;\n  filter:grayscale(1) brightness(0) invert(1) contrast(1.05) !important;\n  opacity:.98 !important;\n  clip-path:inset(0 0 0 23%) !important;\n}\n\n@media(max-width:760px){\n  .lsr-trust-marquee .lsr-trust-logos .lsr-trust-logo:nth-child(2) img,\n  .lsr-trust-logo:nth-child(2) img,\n  .home26-client-logos .home26-client-logo-item:nth-child(2) img{\n    max-width:120px !important;\n    max-height:31px !important;\n  }\n  .lsr-trust-marquee .lsr-trust-logos .lsr-trust-logo:nth-child(2)::after,\n  .lsr-trust-logo:nth-child(2)::after,\n  .home26-client-logos .home26-client-logo-item:nth-child(2)::after{\n    background-size:120px 31px !important;\n  }\n}\n</style>\n'''
          s = s.replace('</head>', fix + '\n</head>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine Dali gray face and white lettering"
          git push
