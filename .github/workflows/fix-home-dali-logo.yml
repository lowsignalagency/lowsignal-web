name: Remove Salvador Dali logo from home

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-dali-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-dali-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Dali logo and normalize San Jorge
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          for style_id in [
              'home-v140-client-logo-white-fix',
              'home-dali-logo-detail-fix-v1',
              'home-dali-logo-detail-fix-v2',
              'home-dali-logo-final-v2',
              'home-dali-logo-optical-v3',
              'home-dali-logo-white-type-v4',
              'home-dali-logo-single-v5',
              'home-dali-logo-gray-face-v6',
              'home-dali-logo-gray-face-v7',
              'home-dali-logo-gray-face-v8',
              'home-dali-logo-single-v9',
              'home-dali-logo-svg-v10',
              'home-dali-logo-svg-v11',
              'home-dali-logo-svg-v12',
              'home-dali-logo-svg-v13',
              'home-dali-gap-cleanup-v14',
              'home-san-jorge-normalize-v15',
              'home-san-jorge-normalize-v16'
          ]:
              s = re.sub(rf'\s*<style id="{style_id}">.*?</style>', '', s, flags=re.S)

          s = re.sub(r'\s*<svg class="dali-home-logo".*?</svg>', '', s, flags=re.S)
          s = re.sub(
              r'\s*<img\s+[^>]*src="https://lowsignal\.cl/assets/(?:logo-dali-maipu\.png|logo-CSD-blanco%20\(1\)\.png|CSD-Logo\.png|salvador-dali\.png|logo-dali-darkbg\.png)"[^>]*>',
              '',
              s
          )
          s = re.sub(r'\s*<div class="lsr-trust-logo lsr-trust-wide">\s*</div>', '', s)

          # Give San Jorge its own stable class in both marquee copies.
          s = re.sub(
              r'<div class="lsr-trust-logo(?: lsr-logo-san-jorge)?">\s*(<img[^>]*src="https://lowsignal\.cl/assets/csjo-white-trim\.png"[^>]*>)\s*</div>',
              r'<div class="lsr-trust-logo lsr-logo-san-jorge">\1</div>',
              s
          )

          cleanup = '''
<style id="home-san-jorge-normalize-v16">
/* San Jorge: full logo visible, no positional inheritance, no clipping. */
.lsr-trust-marquee .lsr-trust-logos .lsr-logo-san-jorge{
  flex:0 0 auto !important;
  min-width:138px !important;
  width:138px !important;
  height:58px !important;
  overflow:visible !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
}
.lsr-trust-marquee .lsr-trust-logos .lsr-logo-san-jorge img{
  display:block !important;
  width:auto !important;
  height:auto !important;
  max-width:126px !important;
  max-height:44px !important;
  object-fit:contain !important;
  object-position:center center !important;
  transform:none !important;
  margin:0 !important;
  clip-path:none !important;
}
@media(max-width:1100px){
  .lsr-trust-marquee .lsr-trust-logos .lsr-logo-san-jorge{min-width:126px !important;width:126px !important;height:54px !important;}
  .lsr-trust-marquee .lsr-trust-logos .lsr-logo-san-jorge img{max-width:116px !important;max-height:40px !important;}
}
@media(max-width:760px){
  .lsr-trust-marquee .lsr-trust-logos .lsr-logo-san-jorge{min-width:112px !important;width:112px !important;height:48px !important;}
  .lsr-trust-marquee .lsr-trust-logos .lsr-logo-san-jorge img{max-width:104px !important;max-height:36px !important;}
}
</style>
'''
          s = s.replace('</head>', cleanup + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix San Jorge logo clipping"
          git push
