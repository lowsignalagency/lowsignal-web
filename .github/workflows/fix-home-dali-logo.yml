name: Restore Salvador Dali logo on home

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-dali-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-dali-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Dali logo with gray face and white lettering
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          for style_id in [
              'home-v140-client-logo-white-fix',
              'home-dali-logo-detail-fix-v1',
              'home-dali-logo-detail-fix-v2',
              'home-dali-logo-final-v2',
              'home-dali-logo-optical-v3',
              'home-dali-logo-white-type-v4',
              'home-dali-logo-single-v5',
              'home-dali-logo-gray-face-v6',
              'home-dali-logo-gray-face-v7',
              'home-dali-logo-gray-face-v8',
              'home-dali-logo-single-v9',
              'home-dali-logo-svg-v10',
              'home-dali-logo-svg-v11',
              'home-dali-logo-svg-v12',
              'home-dali-logo-svg-v13'
          ]:
              s = re.sub(rf'\s*<style id="{style_id}">.*?</style>', '', s, flags=re.S)

          svg = (
              '<svg class="dali-home-logo" viewBox="0 0 1376 190" role="img" aria-label="Colegio Salvador Dalí" preserveAspectRatio="xMidYMid meet">'
              '<defs><clipPath id="dali-wordmark-clip"><rect x="650" y="0" width="726" height="190"/></clipPath></defs>'
              '<image href="https://lowsignal.cl/assets/logo-dali-maipu.png" x="0" y="0" width="1376" height="190" class="dali-face-base"/>'
              '<image href="https://lowsignal.cl/assets/logo-dali-maipu.png" x="0" y="0" width="1376" height="190" class="dali-wordmark-white" clip-path="url(#dali-wordmark-clip)"/>'
              '</svg>'
          )

          s = re.sub(r'<svg class="dali-home-logo".*?</svg>', svg, s, flags=re.S)
          s = re.sub(
              r'<img\s+[^>]*src="https://lowsignal\.cl/assets/(?:logo-dali-maipu\.png|logo-CSD-blanco%20\(1\)\.png|CSD-Logo\.png|salvador-dali\.png|logo-dali-darkbg\.png)"[^>]*>',
              svg,
              s
          )

          fix = (
              '\n<style id="home-dali-logo-svg-v13">\n'
              '.dali-home-logo{display:block;width:188px;height:auto;max-height:50px;overflow:visible;transform:scale(1.08);transform-origin:center;}\n'
              '.dali-home-logo .dali-face-base{filter:grayscale(1) brightness(.55) contrast(1.12);}\n'
              '.dali-home-logo .dali-wordmark-white{filter:grayscale(1) brightness(0) invert(1) contrast(1.08);}\n'
              '@media(max-width:760px){.dali-home-logo{width:160px;max-height:42px;transform:scale(1.06);}}\n'
              '</style>\n'
          )
          s = s.replace('</head>', fix + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Increase Dali logo optical size"
          git push
