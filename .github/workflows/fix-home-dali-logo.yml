name: Fix Salvador Dali logo on home

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-dali-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-dali-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Dali logo treatment
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Force the exact requested Dalí asset anywhere the home still references an older variant.
          for old in [
              'https://lowsignal.cl/assets/logo-CSD-blanco%20(1).png',
              'https://lowsignal.cl/assets/CSD-Logo.png',
              'https://lowsignal.cl/assets/salvador-dali.png',
              'https://lowsignal.cl/assets/logo-dali-darkbg.png'
          ]:
              s = s.replace(old, 'https://lowsignal.cl/assets/logo-dali-maipu.png')

          # Remove every previous Dalí patch, including the pseudo-element overlay that duplicated the logo.
          for style_id in [
              'home-v140-client-logo-white-fix',
              'home-dali-logo-detail-fix-v1',
              'home-dali-logo-detail-fix-v2',
              'home-dali-logo-final-v2',
              'home-dali-logo-optical-v3',
              'home-dali-logo-white-type-v4',
              'home-dali-logo-single-v5'
          ]:
              s = re.sub(rf'\s*<style id="{style_id}">.*?</style>', '', s, flags=re.S)

          fix = '''\n<style id="home-dali-logo-single-v5">\n/* Salvador Dalí — one logo only. Keep facial detail and integrate the mark with the dark band. */\n.lsr-trust-marquee .lsr-trust-logos .lsr-trust-logo:nth-child(2)::after,\n.lsr-trust-logo:nth-child(2)::after,\n.home26-client-logos .home26-client-logo-item:nth-child(2)::after{\n  content:none !important;\n  display:none !important;\n}\n\n.lsr-trust-marquee .lsr-trust-logos .lsr-trust-logo:nth-child(2),\n.lsr-trust-logo:nth-child(2),\n.home26-client-logos .home26-client-logo-item:nth-child(2){\n  overflow:visible !important;\n}\n\n.lsr-trust-marquee .lsr-trust-logos .lsr-trust-logo:nth-child(2) img,\n.lsr-trust-logo:nth-child(2) img,\n.home26-client-logos .home26-client-logo-item:nth-child(2) img{\n  filter:grayscale(1) brightness(1.18) contrast(1.02) !important;\n  opacity:.90 !important;\n  mix-blend-mode:normal !important;\n  width:auto !important;\n  height:auto !important;\n  max-width:132px !important;\n  max-height:34px !important;\n  object-fit:contain !important;\n  transform:none !important;\n}\n\n@media(max-width:760px){\n  .lsr-trust-marquee .lsr-trust-logos .lsr-trust-logo:nth-child(2) img,\n  .lsr-trust-logo:nth-child(2) img,\n  .home26-client-logos .home26-client-logo-item:nth-child(2) img{\n    max-width:116px !important;\n    max-height:30px !important;\n  }\n}\n</style>\n'''
          s = s.replace('</head>', fix + '\n</head>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove duplicate Dali logo overlay"
          git push
