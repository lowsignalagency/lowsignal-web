name: Restore Salvador Dali logo on home

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-dali-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-dali-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep one Dali logo only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          for old in [
              'https://lowsignal.cl/assets/logo-CSD-blanco%20(1).png',
              'https://lowsignal.cl/assets/CSD-Logo.png',
              'https://lowsignal.cl/assets/salvador-dali.png',
              'https://lowsignal.cl/assets/logo-dali-darkbg.png'
          ]:
              s = s.replace(old, 'https://lowsignal.cl/assets/logo-dali-maipu.png')

          for style_id in [
              'home-v140-client-logo-white-fix',
              'home-dali-logo-detail-fix-v1',
              'home-dali-logo-detail-fix-v2',
              'home-dali-logo-final-v2',
              'home-dali-logo-optical-v3',
              'home-dali-logo-white-type-v4',
              'home-dali-logo-single-v5',
              'home-dali-logo-gray-face-v6',
              'home-dali-logo-gray-face-v7',
              'home-dali-logo-gray-face-v8',
              'home-dali-logo-single-v9'
          ]:
              s = re.sub(rf'\s*<style id="{style_id}">.*?</style>', '', s, flags=re.S)

          fix = '''\n<style id="home-dali-logo-single-v9">\n/* One Dalí logo only: no pseudo-elements, no overlays. */\n.lsr-trust-marquee .lsr-trust-logos .lsr-trust-logo:nth-child(2)::after,\n.home26-client-logos .home26-client-logo-item:nth-child(2)::after{\n  content:none !important;\n  display:none !important;\n}\n\n.lsr-trust-marquee .lsr-trust-logos .lsr-trust-logo:nth-child(2) img,\n.home26-client-logos .home26-client-logo-item:nth-child(2) img{\n  filter:grayscale(1) brightness(1.18) contrast(1.10) !important;\n  opacity:.96 !important;\n  mix-blend-mode:normal !important;\n  width:auto !important;\n  height:auto !important;\n  max-width:138px !important;\n  max-height:36px !important;\n  object-fit:contain !important;\n  transform:none !important;\n}\n\n@media(max-width:760px){\n  .lsr-trust-marquee .lsr-trust-logos .lsr-trust-logo:nth-child(2) img,\n  .home26-client-logos .home26-client-logo-item:nth-child(2) img{\n    max-width:120px !important;\n    max-height:31px !important;\n  }\n}\n</style>\n'''
          s = s.replace('</head>', fix + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use single Dali logo without overlay"
          git push
