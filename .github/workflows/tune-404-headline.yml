name: Tune 404 headline
on:
  push:
    paths:
      - '.github/workflows/tune-404-headline.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Reduce headline scale
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('404.html')
          s = p.read_text()
          s = s.replace('font-size:clamp(72px,8vw,124px);', 'font-size:clamp(58px,6.4vw,96px);')
          s = s.replace('.error404 h1{font-size:64px}', '.error404 h1{font-size:52px}')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 404.html
          git commit -m 'fix: reduce 404 headline scale'
          git push
