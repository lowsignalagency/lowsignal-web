name: Refresh Insiders copy
on:
  push:
    paths:
      - .github/scripts/refresh_insiders_copy.py
      - .github/workflows/temp-refresh-insiders-copy.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Insiders copy
        run: python .github/scripts/refresh_insiders_copy.py
      - name: Commit changes
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add recursos/insiders.html
          git commit -m "Refresh lowsignal Insiders positioning" || exit 0
          git push
