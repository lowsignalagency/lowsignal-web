name: Cleanup Nosotros forced layout
on:
  push:
    paths:
      - .github/workflows/remove-nosotros-force-v2.yml
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean forced override
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('nosotros.html')
          h=p.read_text(encoding='utf-8')
          h2=re.sub(r'\n?<style id="nosotros-team-force-4-2-v2">.*?</style>\n?', '\n', h, count=1, flags=re.S)
          if h2 == h:
              raise SystemExit('override not found')
          p.write_text(h2, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add nosotros.html
          git commit -m "Restore Nosotros card proportions"
          git push
