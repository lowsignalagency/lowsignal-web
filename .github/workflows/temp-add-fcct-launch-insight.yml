name: Add FCCT launch insight
on:
  push:
    paths:
      - .github/scripts/add_fcct_launch_insight.py
      - .github/workflows/temp-add-fcct-launch-insight.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix article selector
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/add_fcct_launch_insight.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("r'<main>.*?</main>'", "r'<main[^>]*>.*?</main>'")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Add FCCT launch insight
        run: python .github/scripts/add_fcct_launch_insight.py
      - name: Commit changes
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add index.html recursos/insights.html recursos/insights/lanzamiento-web-fundacion-crecer-con-todos.html
          git commit -m "Add Fundación Crecer con Todos launch insight" || exit 0
          git push
