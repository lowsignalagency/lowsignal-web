name: Jobs final sync once
on: [push]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final Jobs styles
        run: echo '...TRUNCATED...' | base64 -d | python3
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/jobs-final-sync-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/jobs.html recursos/jobs/growth-ambassador.html .github/workflows/jobs-final-sync-once.yml
          git commit -m 'fix: finalize Jobs FAQ and footer sync'
          git push
