name: Refine Nosotros
on:
  push:
    paths:
      - '.github/workflows/remove-marco-nosotros.yml'
      - '.github/scripts/remove_marco_nosotros.py'
      - '.github/scripts/refine_nosotros_team.py'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove Marco
        run: python .github/scripts/remove_marco_nosotros.py
      - name: Refine team directory
        run: python .github/scripts/refine_nosotros_team.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nosotros.html
          git diff --cached --quiet || git commit -m "Refine Nosotros team directory"
          git push
