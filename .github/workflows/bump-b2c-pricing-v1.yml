name: B2C pricing enhancer v1
on:
  push:
    paths:
      - '.github/workflows/bump-b2c-pricing-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add B2C pricing enhancer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('industrias/marcas-b2c.html')
          s=p.read_text()
          tag='<script src="https://lowsignal.cl/assets/b2c-pricing-enhance.js?v=1"></script>'
          if tag in s:
              raise SystemExit('B2C enhancer already present')
          if '</body>' not in s:
              raise SystemExit('Closing body tag not found')
          p.write_text(s.replace('</body>', tag+'\n</body>', 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add industrias/marcas-b2c.html
          git commit -m "Enable B2C pricing enhancer v1"
          git push
