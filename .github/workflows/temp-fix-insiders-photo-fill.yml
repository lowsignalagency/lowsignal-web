name: Fix Insiders photo fill
on:
  push:
    paths:
      - .github/scripts/fix_insiders_photo_fill.py
      - .github/workflows/temp-fix-insiders-photo-fill.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix photo framing
        run: python .github/scripts/fix_insiders_photo_fill.py
      - name: Commit changes
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add recursos/insiders.html
          git commit -m "Fix Insiders portrait framing" || exit 0
          git push
