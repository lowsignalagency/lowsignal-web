name: Update Matias role

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_matias_ai_revenue_role.py'
      - '.github/workflows/update-matias-role.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update role and bio
        run: python scripts/update_matias_ai_revenue_role.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nosotros.html
          git diff --cached --quiet && exit 0
          git commit -m "Update Matias to AI Revenue Engineer"
          git push
