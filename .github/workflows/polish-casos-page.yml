name: Polish Casos page

on:
  push:
    paths:
      - '.github/workflows/polish-casos-page.yml'

permissions:
  contents: write

jobs:
  polish-casos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply current Casos design system
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('casos.html')
          text = path.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="https://lowsignal.cl/assets/casos-polish.css?v=20261012">'
          if link not in text:
              text = text.replace('</head>', f'  {link}\n</head>', 1)
          text = text.replace(
              'Instituciones, empresas y marcas que crecen con un sistema, no con acciones sueltas.',
              'Instituciones, empresas y marcas que crecen con estrategia, ejecución y tecnología conectadas.'
          )
          text = text.replace(
              'Contenido, paid media, web y growth systems conectados a desafíos concretos de negocio.',
              'Contenido, paid media, web y growth systems conectados a desafíos reales de negocio.'
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit Casos polish
        shell: bash
        run: |
          if git diff --quiet -- casos.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "lowsignal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add casos.html
          git commit -m "Polish Casos page to current design system"
          git push
