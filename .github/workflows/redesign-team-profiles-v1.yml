name: Team profile updates
on:
  push:
    paths:
      - '.github/workflows/redesign-team-profiles-v1.yml'
      - '.github/scripts/add_team_profile_scroll_reveal.py'
      - '.github/scripts/remove_team_back_links.py'
      - '.github/scripts/redesign_insiders_v2.py'
      - '.github/scripts/fix_insiders_labels.py'
      - '.github/scripts/fix_insiders_process_line.py'
      - '.github/scripts/redesign_jobs_v2.py'
      - '.github/scripts/add_centro_comunicaar_b2c.py'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add scroll reveal
        run: python .github/scripts/add_team_profile_scroll_reveal.py
      - name: Remove back links
        run: python .github/scripts/remove_team_back_links.py
      - name: Redesign Insiders
        run: python .github/scripts/redesign_insiders_v2.py
      - name: Fix Insiders labels
        run: python .github/scripts/fix_insiders_labels.py
      - name: Fix Insiders process line
        run: python .github/scripts/fix_insiders_process_line.py
      - name: Redesign Jobs
        run: python .github/scripts/redesign_jobs_v2.py
      - name: Add Centro Comunicaar B2C logo
        run: python .github/scripts/add_centro_comunicaar_b2c.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add equipo/felipe-quiroz.html equipo/damian-aldunate.html equipo/matias-bussinger.html equipo/martin-alvarado.html equipo/jorge-munoz.html equipo/lia-morice.html recursos/insiders.html recursos/jobs.html industrias/marcas-b2c.html
          git diff --cached --quiet || git commit -m "Update active site sections"
          git push
