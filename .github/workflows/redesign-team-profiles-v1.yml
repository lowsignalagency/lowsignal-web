name: Team profile scroll reveal
on:
  push:
    paths:
      - '.github/workflows/redesign-team-profiles-v1.yml'
      - '.github/scripts/add_team_profile_scroll_reveal.py'

jobs:
  reveal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add scroll reveal
        run: python .github/scripts/add_team_profile_scroll_reveal.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add equipo/felipe-quiroz.html equipo/damian-aldunate.html equipo/matias-bussinger.html equipo/martin-alvarado.html equipo/jorge-munoz.html equipo/lia-morice.html
          git diff --cached --quiet || git commit -m "Add scroll reveal to team profiles"
          git push
