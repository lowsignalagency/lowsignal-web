name: Align Education layout

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/align_education.py'
      - '.github/workflows/align-education.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Align education typography and motion
        run: python .github/scripts/align_education.py
      - name: Commit education refinements
        run: |
          if git diff --quiet -- industrias/educacion.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add industrias/educacion.html
          git commit -m "Align Education typography, spacing and subtle motion with Low Social"
          git push
