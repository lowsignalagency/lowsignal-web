name: Sync Casos navbar

on:
  push:
    paths:
      - '.github/workflows/sync-casos-navbar.yml'

permissions:
  contents: write

jobs:
  sync-navbar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy current desktop navbar from Nosotros into Casos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('nosotros.html').read_text(encoding='utf-8')
          target_path = Path('casos.html')
          target = target_path.read_text(encoding='utf-8')

          header_match = re.search(r'(<header class="lnav"[\s\S]*?</header>)', source)
          if not header_match:
              raise SystemExit('Could not find .lnav header in nosotros.html')
          header = header_match.group(1)

          style_ids = ['video-accurate-navbar-v21', 'v60-visible-navbar-fixes', 'global-visible-lnav-fixed-v1']
          styles = []
          for sid in style_ids:
              m = re.search(rf'(<style id="{re.escape(sid)}">[\s\S]*?</style>)', source)
              if m:
                  styles.append(m.group(1))
          if not styles:
              raise SystemExit('Could not find current .lnav styles in nosotros.html')

          target = re.sub(r'<!-- CASOS L-NAV SYNC START -->[\s\S]*?<!-- CASOS L-NAV SYNC END -->\s*', '', target)
          target = re.sub(r'<header class="lnav"[\s\S]*?</header>\s*', '', target, count=1)

          sync_css = '\n'.join([
              '<style id="casos-lnav-sync-overrides">',
              '@media(min-width:761px){',
              '  body > .nav-wrap{display:none !important}',
              '  body > .mobile-nav-panel{display:none !important}',
              '  body > .lnav{display:block !important;position:fixed !important;top:0 !important;left:0 !important;right:0 !important;width:100% !important;z-index:2000 !important}',
              '  .stories-new-hero{padding-top:172px !important}',
              '}',
              '@media(max-width:760px){body > .lnav{display:none !important}}',
              '</style>'
          ])
          head_block = '<!-- CASOS L-NAV SYNC START -->\n' + '\n'.join(styles) + '\n' + sync_css + '\n<!-- CASOS L-NAV SYNC END -->\n'
          target = target.replace('</head>', head_block + '</head>', 1)

          nav_marker = '<div class="nav-wrap">'
          if nav_marker not in target:
              raise SystemExit('Could not find nav-wrap in casos.html')
          target = target.replace(nav_marker, header + '\n\n' + nav_marker, 1)

          target_path.write_text(target, encoding='utf-8')
          PY

      - name: Commit navbar sync
        shell: bash
        run: |
          if git diff --quiet -- casos.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "lowsignal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add casos.html
          git commit -m "Sync Casos navbar with Nosotros"
          git push
