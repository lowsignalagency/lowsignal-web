name: Fix RECH editorial logo

on:
  push:
    paths:
      - 'scripts/fix_rech_editorial_logo.py'
      - '.github/workflows/fix-rech-editorial-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix editorial logo
        run: python scripts/fix_rech_editorial_logo.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add casos/rech.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix RECH editorial logo contrast"
            git push
          fi
