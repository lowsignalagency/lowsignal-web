name: Fix CSD testimonial visuals
on:
  push:
    paths:
      - '.github/scripts/fix_csd_testimonial_assets.py'
      - '.github/workflows/temp-fix-csd-testimonial.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/fix_csd_testimonial_assets.py
      - run: git config user.name lowsignal-bot
      - run: git config user.email actions@users.noreply.github.com
      - run: git add index.html
      - run: git commit -m 'Fix Salvador Dalí testimonial visuals'
        continue-on-error: true
      - run: git push
