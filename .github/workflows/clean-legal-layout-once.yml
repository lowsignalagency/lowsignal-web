name: Clean legal layout
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch legal pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [Path('politica-de-privacidad.html'), Path('terminos-de-servicio.html')]
          style = r'''<style id="legal-clean-v3">
          /* Align legal pages to the exact content grid used by Nosotros */
          .legal-hero{padding:124px 0 70px !important;background:#fff !important}
          .legal-hero-grid,
          .legal-body>.container,
          .legal-contact-inner{
            width:min(1200px,calc(100% - 64px)) !important;
            margin-left:auto !important;
            margin-right:auto !important;
          }
          .legal-hero-grid{
            display:block !important;
            max-width:none !important;
          }
          .legal-index{display:none !important}
          .legal-hero h1{max-width:760px !important;margin-top:20px !important}
          .legal-lead{max-width:760px !important;margin-top:28px !important}
          .legal-update{margin-top:30px !important}
          .legal-body{padding:72px 0 104px !important;border-top:1px solid #DDE4F0 !important}
          .legal-body>.container{
            display:grid !important;
            grid-template-columns:190px minmax(0,1fr) !important;
            gap:72px !important;
          }
          .legal-content{min-width:0 !important}
          @media(max-width:980px){
            .legal-body>.container{grid-template-columns:1fr !important;gap:26px !important}
            .legal-sidebar{display:none !important}
          }
          @media(max-width:760px){
            .legal-hero{padding:104px 0 52px !important}
            .legal-hero-grid,
            .legal-body>.container,
            .legal-contact-inner{width:calc(100% - 32px) !important}
            .legal-body{padding:54px 0 72px !important}
          }
          </style>'''
          for p in files:
            s = p.read_text()
            # Remove the table-of-contents block from markup entirely.
            s = re.sub(r'\s*<aside class="legal-index"[^>]*>.*?</aside>', '', s, flags=re.S)
            # Remove prior clean lock if rerun, then inject final rules at the end of head.
            s = re.sub(r'\s*<style id="legal-clean-v3">.*?</style>', '', s, flags=re.S)
            s = s.replace('</head>', style + '\n</head>', 1)
            p.write_text(s)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/clean-legal-layout-once.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add politica-de-privacidad.html terminos-de-servicio.html .github/workflows/clean-legal-layout-once.yml
          git commit -m 'fix: simplify and align legal pages'
          git push
