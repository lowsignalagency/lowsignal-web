name: Education title two lines

on:
  push:
    paths:
      - .github/scripts/education_title_two_lines.py
      - .github/workflows/temp-education-title-two-lines.yml

permissions:
  contents: write

jobs:
  update-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Education title
        run: python .github/scripts/education_title_two_lines.py
      - name: Commit change
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add industrias/educacion.html
          git commit -m "Set Education hero title to two lines" || exit 0
          git push
