name: Fix Matias profile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-matias-profile.yml'
      - 'scripts/fix_matias_profile.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-matias-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Matias profile
        run: python scripts/fix_matias_profile.py
      - name: Commit profile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add equipo/matias-bussinger.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore Matias LinkedIn and add ConsiliumBots logo"
          git push
