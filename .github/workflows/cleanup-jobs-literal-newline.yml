name: Clean Jobs literal newline artifacts
on:
  push:
    paths:
      - '.github/workflows/cleanup-jobs-literal-newline.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove literal backslash-n artifact lines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for rel in ['recursos/jobs.html','recursos/jobs/growth-ambassador.html']:
              p = Path(rel)
              s = p.read_text()
              lines = s.splitlines()
              cleaned = []
              removed = 0
              for line in lines:
                  if line.strip() == r'\n':
                      removed += 1
                      continue
                  cleaned.append(line)
              p.write_text('\n'.join(cleaned) + '\n')
              print(rel, 'removed', removed, 'literal newline artifact lines')
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/cleanup-jobs-literal-newline.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/jobs.html recursos/jobs/growth-ambassador.html .github/workflows/cleanup-jobs-literal-newline.yml
          git commit -m 'fix: remove visible code artifact from Jobs mobile'
          git push
