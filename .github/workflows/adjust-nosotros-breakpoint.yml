name: Adjust Nosotros team breakpoint

on:
  push:
    paths:
      - .github/workflows/adjust-nosotros-breakpoint.yml

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep four columns on desktop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('nosotros.html')
          h = p.read_text(encoding='utf-8')
          marker = '<style id="nosotros-team-editorial-v1">'
          start = h.index(marker)
          end = h.index('</style>', start)
          block = h[start:end]
          old = '@media(max-width:980px){'
          new = '@media(max-width:760px){'
          if old not in block:
              raise SystemExit('target breakpoint not found')
          block = block.replace(old, new, 1)
          h = h[:start] + block + h[end:]
          p.write_text(h, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add nosotros.html
          git commit -m "Keep Nosotros team at four columns on desktop"
          git push
