name: Add founder quote to Insiders
on:
  push:
    paths:
      - .github/scripts/add_founder_quote_insiders.py
      - .github/workflows/temp-add-founder-quote-insiders.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add founder quote
        run: python .github/scripts/add_founder_quote_insiders.py
      - name: Commit changes
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add recursos/insiders.html
          git commit -m "Add founder quote to Insiders section" || exit 0
          git push
