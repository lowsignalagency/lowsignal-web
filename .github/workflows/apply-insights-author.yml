name: Apply Insights author system
on:
  push:
    paths:
      - .github/workflows/apply-insights-author.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add author system
        env:
          SCRIPT_B64: 
        run: python -c "import os,base64; exec(base64.b64decode(os.environ['SCRIPT_B64']))"
      - name: Verify
        run: |
          grep -q 'felipe-quiroz-author.jpg' recursos/insights.html
          grep -q 'insights-author-system-v1' recursos/insights.html
          for f in recursos/insights/100-ideas-puestas-en-marcha.html recursos/insights/6-meses-construyendo-lowsignal.html recursos/insights/ai-native-startups-platanus.html recursos/insights/platanus-ai-native-startups-4.html recursos/insights/tech-founders-ama.html; do
            grep -q 'Felipe Quiroz' "$f"
            grep -q 'article-author-system-v1' "$f"
          done
      - name: Remove workflow
        run: rm .github/workflows/apply-insights-author.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/insights.html recursos/insights/*.html .github/workflows/apply-insights-author.yml
          git commit -m 'feat: add Felipe author identity across Insights'
          git push
