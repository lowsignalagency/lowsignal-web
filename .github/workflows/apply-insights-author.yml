name: Apply Insights author system
on:
  push:
    paths:
      - .github/workflows/apply-insights-author.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add author system
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          author = '''<div class="insights-author">
  <img src="https://lowsignal.cl/assets/felipe-quiroz-author.jpg" alt="Felipe Quiroz">
  <div><strong>Felipe Quiroz</strong><span>Co-Founder & COO · lowsignal</span></div>
</div>'''

          article_author = '''<div class="article-author">
  <img src="https://lowsignal.cl/assets/felipe-quiroz-author.jpg" alt="Felipe Quiroz">
  <div><strong>Felipe Quiroz</strong><span>Co-Founder & COO · lowsignal</span></div>
</div>'''

          index = Path('recursos/insights.html')
          s = index.read_text()
          if 'insights-author-system-v1' not in s:
              # Add author after every visible Insights meta block in featured + cards.
              s = re.sub(r'(<div class="insights-new-meta">.*?</div>)', r'\1\n' + author, s, flags=re.S)
              css = '''
<style id="insights-author-system-v1">
.insights-author{
  display:flex;align-items:center;gap:10px;margin-top:16px;
}
.insights-author img{
  width:36px;height:36px;border-radius:50%;object-fit:cover;object-position:center 38%;flex:0 0 auto;
}
.insights-author>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.insights-author strong{color:#071022;font-size:11px;line-height:1.25;font-weight:650;letter-spacing:-.01em}
.insights-author span{color:#7A849F;font-size:9px;line-height:1.35}
.insights-new-feature-copy>.insights-author{margin-top:18px}
.insights-new-feature-copy>.insights-author img{width:42px;height:42px}
.insights-new-feature-copy>.insights-author strong{font-size:12px}
.insights-new-feature-copy>.insights-author span{font-size:10px}
@media(max-width:620px){
  .insights-author{margin-top:14px}
  .insights-author img{width:34px;height:34px}
  .insights-new-feature-copy>.insights-author img{width:38px;height:38px}
}
</style>
'''
              s = s.replace('</body>', css + '\n</body>', 1)
              index.write_text(s)

          files = [
              'recursos/insights/100-ideas-puestas-en-marcha.html',
              'recursos/insights/6-meses-construyendo-lowsignal.html',
              'recursos/insights/ai-native-startups-platanus.html',
              'recursos/insights/platanus-ai-native-startups-4.html',
              'recursos/insights/tech-founders-ama.html',
          ]

          css_article = '''
<style id="article-author-system-v1">
.article-author{
  display:flex;align-items:center;gap:12px;margin-top:20px;
}
.article-author img{
  width:48px;height:48px;border-radius:50%;object-fit:cover;object-position:center 38%;flex:0 0 auto;
}
.article-author>div{display:flex;flex-direction:column;gap:3px}
.article-author strong{color:#071022;font-size:13px;line-height:1.25;font-weight:650;letter-spacing:-.01em}
.article-author span{color:#7A849F;font-size:10px;line-height:1.4}
@media(max-width:620px){
  .article-author{margin-top:18px}
  .article-author img{width:44px;height:44px}
  .article-author strong{font-size:12px}
}
</style>
'''

          for fn in files:
              p = Path(fn)
              s = p.read_text()
              if 'article-author-system-v1' in s:
                  continue
              m = re.search(r'(<div class="article-new-meta">.*?</div>)', s, flags=re.S)
              if not m:
                  raise SystemExit(f'No article-new-meta found in {fn}')
              s = s[:m.end()] + '\n' + article_author + s[m.end():]
              s = s.replace('</body>', css_article + '\n</body>', 1)
              p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'felipe-quiroz-author.jpg' recursos/insights.html
          grep -q 'insights-author-system-v1' recursos/insights.html
          for f in recursos/insights/100-ideas-puestas-en-marcha.html recursos/insights/6-meses-construyendo-lowsignal.html recursos/insights/ai-native-startups-platanus.html recursos/insights/platanus-ai-native-startups-4.html recursos/insights/tech-founders-ama.html; do
            grep -q 'Felipe Quiroz' "$f"
            grep -q 'article-author-system-v1' "$f"
          done
      - name: Remove workflow
        run: rm .github/workflows/apply-insights-author.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/insights.html recursos/insights/*.html .github/workflows/apply-insights-author.yml
          git commit -m 'feat: add Felipe author identity across Insights'
          git push
