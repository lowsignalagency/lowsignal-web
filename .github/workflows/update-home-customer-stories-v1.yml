name: Update home customer stories v1
on:
  push:
    paths:
      - '.github/workflows/update-home-customer-stories-v1.yml'
      - '.github/scripts/update_home_customer_stories_v1.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh home customer stories
        run: python .github/scripts/update_home_customer_stories_v1.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refresh home customer stories"
          git push
