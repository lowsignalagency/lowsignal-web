name: Update Damian profile experience

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_damian_profile_experience.py'
      - '.github/workflows/update-damian-profile-experience.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update Damian profile
        run: python scripts/update_damian_profile_experience.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add equipo/damian-aldunate.html
          git diff --cached --quiet && exit 0
          git commit -m "Add ConsiliumBots experience to Damian profile"
          git push
# trigger damian linkedin + consilium
