name: Fix Insights final margins and CTA
on:
  push:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply final override
        run: python -c "from pathlib import Path; import re,base64; p=Path('recursos/insights.html'); s=p.read_text(); css=base64.b64decode('').decode(); s=re.sub(r'\n?<style id=\"insights-final-body-fix-v4\">.*?</style>\n?','\n',s,flags=re.S); s=s.replace('</body>',css+'\n</body>',1); p.write_text(s)"
      - name: Verify
        run: tail -n 120 recursos/insights.html | grep -q 'insights-final-body-fix-v4'
      - name: Remove workflow
        run: rm .github/workflows/fix-insights-final-margins-cta.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/insights.html .github/workflows/fix-insights-final-margins-cta.yml
          git commit -m 'fix: force Insights margins and round card CTA'
          git push
