name: One-time clean sticky navbar fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-navbar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore layout and keep navbar visible
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          old_marker = 'global-fixed-navbar-v1'
          new_marker = 'global-sticky-navbar-v2'
          new_css = '''
          <style id="global-sticky-navbar-v2">
          /* Keep navigation visible without removing it from document flow. */
          .nav-wrap{
            position:sticky !important;
            top:0 !important;
            left:auto !important;
            right:auto !important;
            width:auto !important;
            z-index:1000 !important;
          }
          @media(max-width:760px){
            .nav-wrap{top:0 !important}
            .mobile-nav-panel{z-index:990 !important}
            .mobile-nav-toggle,.brand{position:relative !important;z-index:1010 !important}
          }
          </style>
          '''.strip()

          changed=[]
          for path in Path('.').rglob('*.html'):
            text=path.read_text(encoding='utf-8')
            before=text

            # Remove the previous fixed-navbar patch entirely, including body/html spacing.
            text=re.sub(r'\s*<style id="global-fixed-navbar-v1">.*?</style>\s*', '\n', text, flags=re.S)
            text=re.sub(r'\s*<style id="global-sticky-navbar-v2">.*?</style>\s*', '\n', text, flags=re.S)

            if '.nav-wrap' in text and '</head>' in text:
              text=text.replace('</head>', new_css+'\n</head>', 1)

            if text != before:
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print(f'Updated {len(changed)} HTML files')
          for p in changed:
            print(' -',p)

          wf=Path('.github/workflows/fix-navbar-sticky-clean.yml')
          if wf.exists():
            wf.unlink()
          PY

      - name: Commit clean navbar fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: restore layout and keep navbar sticky"
          git push origin main
