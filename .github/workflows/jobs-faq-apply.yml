name: Jobs FAQ apply
on:
  push:
    paths: ['.github/workflows/jobs-faq-apply.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('recursos/jobs.html'); s=p.read_text()
          block='''<section class="jobs26-faq" id="faq"><div class="container"><p class="jobs26-eyebrow">PREGUNTAS FRECUENTES</p><h2>Antes de postular,<br><strong>quizás te preguntes esto.</strong></h2><div class="jobs26-faq-list">
          <details><summary>¿Qué buscamos en alguien que se suma?<span>+</span></summary><p>Personas curiosas, autónomas y con ganas de hacer que las cosas pasen. Valoramos criterio, iniciativa, velocidad para aprender y capacidad para resolver problemas reales.</p></details>
          <details><summary>¿Necesito cumplir todos los requisitos del rol?<span>+</span></summary><p>No necesariamente. Nos importa el fit con el desafío, tu forma de pensar y tu capacidad de aprender.</p></details>
          <details><summary>¿Cómo trabajamos?<span>+</span></summary><p>Con autonomía, responsabilidad y comunicación directa. Preferimos avanzar, probar y mejorar antes que sumar capas innecesarias de proceso.</p></details>
          <details><summary>¿Cómo es el proceso de selección?<span>+</span></summary><p>Depende del rol. Normalmente partimos con una conversación para conocernos y entender fit; en algunas posiciones podemos revisar una experiencia, caso o desafío concreto.</p></details>
          <details><summary>¿Puedo escribir aunque no vea una posición exacta para mí?<span>+</span></summary><p>Sí. Si crees que puedes aportar a lowsignal, escríbenos a contacto@lowsignal.cl y cuéntanos brevemente qué te interesa construir con nosotros.</p></details>
          </div></div></section><section class="jobs26-final-cta"><div class="container"><p class="jobs26-eyebrow">BUILD WHAT'S NEXT</p><h2>Queremos personas que se muevan rápido y disfruten <strong>resolver problemas difíciles.</strong></h2><div class="jobs26-final-row"><p>Si te hace sentido, revisa las posiciones abiertas o escríbenos.</p><div><a href="#roles">Ver posiciones abiertas</a><a href="mailto:contacto@lowsignal.cl?subject=Quiero%20trabajar%20en%20lowsignal">Escríbenos</a></div></div></div></section>'''
          s,n=re.subn(r'<section class="jobs26-process">.*?</section>\s*<section class="lsr-band">.*?</section>',block,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('target not found')
          css='''<style id="jobs-faq-final-v1">.jobs26-faq{background:#050505;color:#fff;padding:100px 0}.jobs26-faq h2{font-size:clamp(34px,3.35vw,46px);font-weight:300;line-height:1.08;margin:18px 0 50px}.jobs26-faq h2 strong{color:#A8B8FF;font-weight:300}.jobs26-faq-list{border-top:1px solid #ffffff24}.jobs26-faq-list details{border-bottom:1px solid #ffffff24}.jobs26-faq-list summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:24px;padding:27px 0;font-size:17px}.jobs26-faq-list summary::-webkit-details-marker{display:none}.jobs26-faq-list summary span{font-size:28px;color:#77819a;transition:.2s}.jobs26-faq-list details[open] summary span{transform:rotate(45deg);color:#A8B8FF}.jobs26-faq-list details p{max-width:780px;margin:0;padding:0 50px 26px 0;color:#909AB5;font-size:13px;line-height:1.75}.jobs26-final-cta{background:#1419E0;color:#fff;padding:100px 0}.jobs26-final-cta h2{max-width:980px;margin:18px 0 0;font-size:clamp(42px,4.65vw,64px);font-weight:300;line-height:1.02;letter-spacing:-.05em}.jobs26-final-cta h2 strong{color:#C6D1FF;font-weight:300}.jobs26-final-row{display:flex;justify-content:space-between;gap:40px;align-items:flex-end;margin-top:58px;padding-top:24px;border-top:1px solid #ffffff38}.jobs26-final-row>p{max-width:520px;color:#D6DCFF;font-size:14px}.jobs26-final-row>div{display:flex;gap:10px}.jobs26-final-row a{display:inline-flex;min-height:44px;align-items:center;padding:0 18px;border-radius:999px;border:1px solid #ffffff55;font-size:12px}.jobs26-final-row a:first-child{background:#fff;color:#1419E0}@media(max-width:760px){.jobs26-faq,.jobs26-final-cta{padding:72px 0}.jobs26-faq h2{font-size:28px}.jobs26-faq-list summary{font-size:15px;padding:22px 0}.jobs26-final-cta h2{font-size:34px}.jobs26-final-row{flex-direction:column;align-items:flex-start}.jobs26-final-row>div{width:100%;flex-direction:column}.jobs26-final-row a{width:100%;justify-content:center}}</style>'''
          s=re.sub(r'<style id="jobs-faq-final-v1">.*?</style>','',s,flags=re.S)
          s=s.replace('</body>',css+'\n</body>',1)
          p.write_text(s)
          PY
      - run: rm .github/workflows/jobs-faq-apply.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recursos/jobs.html .github/workflows/jobs-faq-apply.yml
          git commit -m 'feat: replace Jobs process with FAQ and final CTA'
          git push
