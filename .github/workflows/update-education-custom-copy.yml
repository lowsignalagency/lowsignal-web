name: Update Education custom plan copy

on:
  push:
    branches:
      - education-pricing-v1
    paths:
      - .github/workflows/update-education-custom-copy.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: education-pricing-v1

      - name: Update custom plan copy
        shell: python
        run: |
          from pathlib import Path
          path = Path('industrias/educacion.html')
          text = path.read_text(encoding='utf-8')
          old = '<div class="edu-pricing-custom"><div><span>PLAN A MEDIDA</span><h3>¿Ningún plan calza perfecto?</h3><p>Podemos ajustar alcance, frecuencia y servicios según las necesidades de tu institución.</p></div><a href="https://calendly.com/felipe-lowsignal/30min" target="_blank" rel="noopener noreferrer">Conversemos</a></div>'
          new = '<div class="edu-pricing-custom"><div><span>PLAN A MEDIDA</span><h3>¿Necesitas algo distinto?</h3><p>Podemos adaptar el alcance a tu institución.</p></div><a href="https://calendly.com/felipe-lowsignal/30min" target="_blank" rel="noopener noreferrer">Conversemos</a></div>'
          if old not in text:
              raise SystemExit('Target custom plan copy not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add industrias/educacion.html
          git commit -m "Update Education custom plan copy" || exit 0
          git push origin HEAD:education-pricing-v1
