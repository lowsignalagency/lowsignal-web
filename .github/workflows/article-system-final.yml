name: Article system final
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/article-system-final.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch article system
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files=['recursos/insights/100-ideas-puestas-en-marcha.html','recursos/insights/6-meses-construyendo-lowsignal.html','recursos/insights/ai-native-startups-platanus.html','recursos/insights/platanus-ai-native-startups-4.html','recursos/insights/tech-founders-ama.html']
          css='<style id="article-system-final-v1">.article-new-hero .container,.article-new-body .container,.article-new-more .container{width:min(1480px,calc(100% - 160px))!important;max-width:1480px!important;margin-inline:auto!important}.article-new-hero{padding:150px 0 72px!important}.article-new-hero-grid{grid-template-columns:minmax(0,1fr) minmax(240px,.30fr)!important;gap:64px!important;margin-top:24px!important;align-items:end!important}.article-new-hero h1{max-width:940px!important;font-size:clamp(42px,3.6vw,56px)!important;line-height:1.04!important;letter-spacing:-.045em!important}.article-new-hero h1 strong{display:block!important}.article-new-hero-grid>div>p{max-width:760px!important;margin-top:24px!important;font-size:16px!important;line-height:1.62!important}.article-new-meta{margin-top:22px!important;font-size:11px!important}.article-author{gap:14px!important;margin-top:18px!important}.article-author img{width:60px!important;height:60px!important;border-radius:50%!important;object-fit:cover!important;object-position:center 32%!important;flex:0 0 60px!important}.article-author>div{gap:4px!important}.article-author strong{font-size:14px!important;line-height:1.2!important}.article-author span{font-size:11px!important;line-height:1.35!important}.article-new-result{align-self:end!important}.article-new-cover{margin-top:46px!important;border-radius:20px!important}.article-new-body{padding:96px 0!important}.article-new-body-grid{grid-template-columns:200px minmax(0,760px)!important;gap:76px!important;justify-content:start!important}@media(max-width:1440px){.article-new-hero .container,.article-new-body .container,.article-new-more .container{width:calc(100% - 112px)!important}}@media(max-width:1100px){.article-new-hero .container,.article-new-body .container,.article-new-more .container{width:calc(100% - 48px)!important}.article-new-hero-grid{grid-template-columns:1fr!important;gap:30px!important}.article-new-result{max-width:360px!important}.article-new-body-grid{grid-template-columns:1fr!important;gap:38px!important}}@media(max-width:760px){.article-new-hero .container,.article-new-body .container,.article-new-more .container{width:calc(100% - 40px)!important}.article-new-hero{padding:118px 0 56px!important}.article-new-hero h1{font-size:36px!important;line-height:1.05!important}.article-new-hero-grid>div>p{font-size:15px!important}.article-author img{width:52px!important;height:52px!important;flex-basis:52px!important}.article-author strong{font-size:13px!important}.article-author span{font-size:10px!important}.article-new-cover{margin-top:30px!important;border-radius:16px!important}.article-new-body{padding:68px 0!important}}</style>'
          for filename in files:
              p=Path(filename)
              s=p.read_text()
              s=re.sub(r'\n?<style id="article-system-final-v1">.*?</style>\s*','\n',s,flags=re.S)
              s=s.replace('https://lowsignal.cl/assets/felipe-quiroz-author.jpg?v=5','https://lowsignal.cl/assets/felipe-quiroz-author.jpg')
              s=s.replace('https://lowsignal.cl/assets/felipe-quiroz-author.jpg','https://lowsignal.cl/assets/felipe-quiroz-author.jpg?v=6')
              s=s.replace('</body>',css+'\n</body>',1)
              p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'article-system-final-v1' recursos/insights/platanus-ai-native-startups-4.html
          grep -q 'font-size:clamp(42px,3.6vw,56px)' recursos/insights/tech-founders-ama.html
          grep -q 'width:60px!important' recursos/insights/100-ideas-puestas-en-marcha.html
      - name: Remove workflow
        run: rm .github/workflows/article-system-final.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/insights/*.html .github/workflows/article-system-final.yml
          git commit -m 'fix: align article scale margins and author block'
          git push
