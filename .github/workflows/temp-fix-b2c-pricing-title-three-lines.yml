name: Fix B2C pricing title three lines
on:
  push:
    paths:
      - '.github/scripts/fix_b2c_pricing_title_three_lines.py'
      - '.github/workflows/temp-fix-b2c-pricing-title-three-lines.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/fix_b2c_pricing_title_three_lines.py
      - run: git config user.name lowsignal-bot
      - run: git config user.email actions@users.noreply.github.com
      - run: git add industrias/marcas-b2c.html
      - run: git commit -m 'Keep B2C pricing title to three lines'
        continue-on-error: true
      - run: git push
