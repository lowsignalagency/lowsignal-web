name: Add Salvador Dali testimonial
on:
  push:
    paths:
      - '.github/scripts/add_salvador_dali_testimonial.py'
      - '.github/workflows/temp-add-salvador-dali-testimonial.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/add_salvador_dali_testimonial.py
      - run: git config user.name lowsignal-bot
      - run: git config user.email actions@users.noreply.github.com
      - run: git add index.html
      - run: git commit -m 'Add Salvador Dalí testimonial to Home'
        continue-on-error: true
      - run: git push
