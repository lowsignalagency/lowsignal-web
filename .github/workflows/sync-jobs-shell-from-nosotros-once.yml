name: Sync Jobs shell from Nosotros once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-jobs-shell-from-nosotros-once.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy exact Nosotros shell into Jobs pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          src = (root/'nosotros.html').read_text()

          # Exact visible shell markup before <main> from Nosotros.
          src_body_prefix = src.split('<body>',1)[1].split('<main',1)[0]

          # Exact footer markup from Nosotros.
          m_footer = re.search(r'<footer\b.*?</footer>', src, flags=re.S)
          if not m_footer:
              raise SystemExit('No footer found in nosotros.html')
          src_footer = m_footer.group(0)

          # Pull every style block in Nosotros that participates in the visible shell.
          # Keeping the original blocks preserves the exact cascade that makes Nosotros correct.
          style_blocks = re.findall(r'<style(?:\s+[^>]*)?>.*?</style>', src, flags=re.S)
          markers = (
              '.lnav', 'nav-wrap', 'mobile-nav-panel', 'mobile-nav-toggle',
              '.footer-main', '.footer-container', '.footer-brand', '.footer-meta',
              '.footer-bottom', '.footer-ai', 'footer .footer-container'
          )
          shell_blocks = [b for b in style_blocks if any(x in b for x in markers)]
          if not shell_blocks:
              raise SystemExit('No shell CSS blocks found in nosotros.html')
          canonical_css = '\n<!-- CANONICAL-NOSOTROS-SHELL-START -->\n' + '\n'.join(shell_blocks) + '\n<!-- CANONICAL-NOSOTROS-SHELL-END -->\n'

          for path in [root/'recursos/jobs.html', root/'recursos/jobs/growth-ambassador.html']:
              text = path.read_text()

              # Remove a previous canonical copy if rerun.
              text = re.sub(r'\n?<!-- CANONICAL-NOSOTROS-SHELL-START -->.*?<!-- CANONICAL-NOSOTROS-SHELL-END -->\n?', '\n', text, flags=re.S)

              # Remove old external footer locks; shell must come only from Nosotros.
              text = re.sub(r'\s*<link[^>]+jobs-footer-[^>]+>\s*', '\n', text)

              # Replace everything between <body> and <main...> with Nosotros shell markup.
              body_i = text.index('<body>') + len('<body>')
              main_i = text.index('<main', body_i)
              text = text[:body_i] + src_body_prefix + text[main_i:]

              # Replace footer markup exactly.
              text = re.sub(r'<footer\b.*?</footer>', src_footer, text, count=1, flags=re.S)

              # Insert exact shell CSS at the very end of inline CSS, immediately before
              # the page-specific Jobs stylesheet so Jobs content can still override generic rules.
              link = re.search(r'<link rel="stylesheet" href="https://lowsignal\.cl/assets/jobs-page-fixes\.css\?v=\d+">', text)
              if link:
                  text = text[:link.start()] + canonical_css + text[link.start():]
              else:
                  text = text.replace('</head>', canonical_css + '</head>', 1)

              path.write_text(text)
          PY
      - name: Commit exact shell sync and remove workflow
        run: |
          rm .github/workflows/sync-jobs-shell-from-nosotros-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/jobs.html recursos/jobs/growth-ambassador.html .github/workflows/sync-jobs-shell-from-nosotros-once.yml
          git commit -m 'fix: sync Jobs navbar and footer exactly from Nosotros'
          git push
