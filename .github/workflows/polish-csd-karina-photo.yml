name: Polish CSD Karina photo

on:
  push:
    branches: [main]
    paths:
      - 'scripts/polish_csd_karina_photo.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/polish_csd_karina_photo.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add casos/salvador-dali.html
          git diff --cached --quiet || git commit -m "Polish Karina testimonial photo"
          git push
