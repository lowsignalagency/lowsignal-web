name: Clean Insiders card labels
on:
  push:
    paths:
      - .github/scripts/clean_insiders_cards_labels.py
      - .github/workflows/temp-clean-insiders-cards-labels.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean labels
        run: python .github/scripts/clean_insiders_cards_labels.py
      - name: Commit changes
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add recursos/insiders.html
          git commit -m "Simplify Insiders profile cards" || exit 0
          git push
