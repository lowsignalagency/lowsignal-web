name: Finalize Jobs once
on: [push]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final Jobs fixes
        run: echo '' | base64 -d | python3
      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/finalize-jobs-once.yml
          rm -f .github/workflows/jobs-align-navbar.yml
          rm -f .github/workflows/jobs-system-polish-v2.yml
          rm -f .github/workflows/jobs-polish-run.yml
          rm -f .github/workflows/sync-jobs-shell.yml
      - name: Commit final state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: finalize Jobs navbar chevrons and margins' || exit 0
          git push
