name: Redesign Felipe profile
on:
  push:
    paths:
      - '.github/workflows/redesign-felipe-profile.yml'
      - '.github/scripts/redesign_felipe_profile.py'

jobs:
  redesign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix profile selector
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/redesign_felipe_profile.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          out=[]
          for line in lines:
              if line.startswith('pattern = re.compile'):
                  out.append("pattern = re.compile(r'\\s*<section class=\"profile-hero\">.*?</section>', re.S)")
              else:
                  out.append(line)
          p.write_text('\n'.join(out)+'\n', encoding='utf-8')
          PY
      - name: Redesign Felipe profile
        run: python .github/scripts/redesign_felipe_profile.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add equipo/felipe-quiroz.html
          git diff --cached --quiet || git commit -m "Redesign Felipe founder profile"
          git push
# trigger v3
