name: Add Home Insights section
on:
  push:
    paths:
      - .github/scripts/add_home_insights_section.py
      - .github/workflows/temp-add-home-insights-section.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Insights section
        run: python .github/scripts/add_home_insights_section.py
      - name: Commit changes
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add index.html
          git commit -m "Add Insights section to Home" || exit 0
          git push
