name: Legal final reset
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/legal-final-reset.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch legal pages at end of body
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css = '''<style id="legal-final-body-reset-v1">
          main#top .legal-hero{margin:0!important;padding:176px 0 72px!important;background:#fff!important;transform:none!important}
          main#top .legal-hero-grid,main#top .legal-body>.container,main#top .legal-contact-inner{width:min(1480px,calc(100% - 160px))!important;max-width:1480px!important;margin-left:auto!important;margin-right:auto!important;padding-left:0!important;padding-right:0!important}
          main#top .legal-hero-grid{display:block!important;grid-template-columns:none!important;gap:0!important}
          main#top .legal-hero-grid>div:first-child{width:100%!important;max-width:920px!important;margin:0!important}
          main#top .legal-hero h1{max-width:820px!important;margin:20px 0 0!important;font-size:clamp(56px,5.3vw,80px)!important;line-height:.98!important;letter-spacing:-.055em!important}
          main#top .legal-lead{max-width:760px!important;margin:26px 0 0!important;font-size:16px!important;line-height:1.68!important}
          main#top .legal-update{margin:28px 0 0!important}
          main#top .legal-index,main#top .legal-sidebar{display:none!important}
          main#top .legal-body{margin:0!important;padding:0 0 104px!important;background:#fff!important}
          main#top .legal-body>.container{display:block!important;grid-template-columns:none!important;gap:0!important}
          main#top .legal-content{display:block!important;width:100%!important;max-width:1080px!important;margin:0!important;padding:0!important;border-top:1px solid #DDE4F0!important;grid-template-columns:none!important}
          main#top .legal-content article{display:block!important;width:100%!important;max-width:none!important;margin:0!important;padding:36px 0 40px!important;border-bottom:1px solid #DDE4F0!important;grid-template-columns:none!important}
          main#top .legal-content article>*{margin-left:0!important;margin-right:0!important}
          main#top .legal-content h2{width:auto!important;max-width:780px!important;margin:10px 0 0!important;font-size:clamp(29px,2.6vw,38px)!important;line-height:1.1!important}
          main#top .legal-content p,main#top .legal-content ul,main#top .legal-content ol{width:auto!important;max-width:900px!important}
          main#top .legal-content p,main#top .legal-content li{font-size:15px!important;line-height:1.78!important}
          main#top .legal-contact{margin:0!important;padding:72px 0!important;background:#1419E0!important}
          main#top .legal-contact-inner{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:48px!important}
          main#top .legal-contact-inner>div:first-child{max-width:860px!important}
          main#top .legal-contact h2{margin:6px 0 0!important;font-size:clamp(36px,3.8vw,54px)!important;line-height:1.04!important}
          main#top .legal-contact-action{width:auto!important;min-width:0!important;min-height:0!important;padding:0!important;margin:0!important;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;display:block!important;flex:0 0 auto!important}
          main#top .legal-contact-action>span{display:none!important}
          main#top .legal-contact-action>a{width:auto!important;min-width:0!important;min-height:50px!important;padding:0 22px!important;border:1px solid #fff!important;border-radius:14px!important;background:#fff!important;color:#1419E0!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;white-space:nowrap!important;font-size:0!important;font-weight:650!important;box-shadow:none!important;transition:transform .2s ease,box-shadow .2s ease,background-color .2s ease!important}
          main#top .legal-contact-action>a::before{content:"Escríbenos";font-size:13px}
          main#top .legal-contact-action>a::after{content:"↗";font-size:13px;margin-left:6px}
          @media(hover:hover){main#top .legal-contact-action>a:hover{transform:translateY(-2px)!important;background:#F1F3FF!important;box-shadow:0 12px 28px rgba(0,0,0,.18)!important}}
          @media(max-width:1440px){main#top .legal-hero-grid,main#top .legal-body>.container,main#top .legal-contact-inner{width:calc(100% - 112px)!important}}
          @media(max-width:1100px){main#top .legal-hero-grid,main#top .legal-body>.container,main#top .legal-contact-inner{width:calc(100% - 48px)!important}}
          @media(max-width:760px){main#top .legal-hero{padding:112px 0 48px!important}main#top .legal-hero h1{font-size:44px!important}main#top .legal-body{padding-bottom:68px!important}main#top .legal-content{max-width:none!important}main#top .legal-content article{padding:28px 0 32px!important}main#top .legal-content h2{font-size:28px!important}main#top .legal-content p,main#top .legal-content li{font-size:14px!important;line-height:1.74!important}main#top .legal-contact{padding:58px 0!important}main#top .legal-contact-inner{flex-direction:column!important;align-items:flex-start!important;gap:28px!important}}
          @media(max-width:620px){main#top .legal-hero-grid,main#top .legal-body>.container,main#top .legal-contact-inner{width:calc(100% - 40px)!important}}
          </style>'''

          for filename in ('politica-de-privacidad.html','terminos-de-servicio.html'):
              p=Path(filename)
              s=p.read_text()
              s=re.sub(r'<style id="legal-final-body-reset-v1">.*?</style>\s*','',s,flags=re.S)
              s=s.replace('</body>',css+'\n</body>')
              p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add politica-de-privacidad.html terminos-de-servicio.html
          git commit -m "fix: force stable legal layout after legacy styles"
          git push
