name: Fix Insider numbering
on:
  push:
    paths:
      - .github/scripts/fix_insider_order.py
      - .github/workflows/temp-fix-insider-order.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix numbering
        run: python .github/scripts/fix_insider_order.py
      - name: Commit changes
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add recursos/insiders.html
          git commit -m "Fix Insider numbering" || exit 0
          git push
