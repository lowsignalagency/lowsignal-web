name: Update Low Social includes block
on:
  push:
    paths:
      - '.github/workflows/update-low-social-includes.yml'
      - '.github/scripts/update_low_social_includes.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Low Social
        run: python .github/scripts/update_low_social_includes.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soluciones/low-social.html
          git diff --cached --quiet || git commit -m "Refine Low Social section contrast"
          git push
