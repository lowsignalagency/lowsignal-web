name: One-off B2C DIMOR photo

on:
  push:
    paths:
      - '.github/workflows/tmp-b2c-dimor-photo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace DIMOR testimonial background
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('industrias/marcas-b2c.html')
          s = p.read_text()
          old = "https://lowsignal.cl/assets/dimor-truck.jpg"
          new = "https://lowsignal.cl/assets/dimor-concesionario.png"
          if old not in s:
              raise SystemExit('Old DIMOR background not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-b2c-dimor-photo.yml
          git add industrias/marcas-b2c.html
          git commit -m "Update DIMOR B2C testimonial photo"
          git push
