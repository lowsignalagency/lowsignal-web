name: Update Growth Ambassador selection process

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch selection process
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('recursos/jobs/growth-ambassador.html')
          t = p.read_text(encoding='utf-8')
          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          css = base64.b64decode('').decode()
          if old not in t:
              raise SystemExit('SOBRE LOWSIGNAL block not found')
          t = t.replace(old, new, 1)
          if 'ga26-selection-process-v1' not in t:
              t = t.replace('</head>', css + '\n</head>', 1)
          p.write_text(t, encoding='utf-8')
          PY
      - name: Commit
        run: |
          rm .github/workflows/update-growth-ambassador-selection-process-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recursos/jobs/growth-ambassador.html .github/workflows/update-growth-ambassador-selection-process-once.yml
          git commit -m "feat: add Growth Ambassador selection process"
          git push
