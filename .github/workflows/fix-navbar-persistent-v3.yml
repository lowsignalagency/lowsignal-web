name: One-time persistent navbar fix v3

on:
  push:
    paths:
      - '.github/workflows/fix-navbar-persistent-v3.yml'

permissions:
  contents: write

jobs:
  patch-navbar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply persistent navbar without layout shift
        shell: python
        run: |
          from pathlib import Path
          import re

          block = '''
          <style id="global-persistent-navbar-v3">
          /* Persistent navbar without changing the page's original vertical rhythm. */
          .nav-wrap{
            position:relative !important;
            top:auto !important;
            left:auto !important;
            right:auto !important;
            width:100% !important;
            min-height:94px !important;
            z-index:1000 !important;
            pointer-events:none !important;
          }
          .nav-wrap > .nav{
            position:fixed !important;
            top:18px !important;
            left:50% !important;
            right:auto !important;
            margin:0 !important;
            transform:translateX(-50%) !important;
            z-index:1000 !important;
            pointer-events:auto !important;
          }
          .mobile-nav-panel{
            z-index:990 !important;
          }
          @media(max-width:760px){
            .nav-wrap{
              min-height:72px !important;
            }
            .nav-wrap > .nav{
              top:8px !important;
            }
            .mobile-nav-toggle,
            .brand{
              position:relative !important;
              z-index:1010 !important;
            }
          }
          </style>
          '''.strip()

          changed=[]
          for path in Path('.').rglob('*.html'):
            text=path.read_text(encoding='utf-8')
            if '.nav-wrap' not in text or '</head>' not in text:
              continue

            # Remove our two earlier global navbar overrides completely.
            text=re.sub(r'\s*<style id="global-fixed-navbar-v1">.*?</style>\s*', '\n', text, flags=re.S)
            text=re.sub(r'\s*<style id="global-sticky-navbar-v2">.*?</style>\s*', '\n', text, flags=re.S)
            text=re.sub(r'\s*<style id="global-persistent-navbar-v3">.*?</style>\s*', '\n', text, flags=re.S)

            text=text.replace('</head>', block+'\n</head>',1)
            path.write_text(text,encoding='utf-8')
            changed.append(str(path))

          print(f'Updated {len(changed)} HTML files')
          for p in changed:
            print(' -',p)

          wf=Path('.github/workflows/fix-navbar-persistent-v3.yml')
          if wf.exists():
            wf.unlink()

      - name: Commit persistent navbar fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: keep navbar persistently visible without layout shift"
          git push origin main
