name: Compact industry heroes

on:
  push:
    paths:
      - .github/scripts/compact_industry_heroes.py
      - .github/workflows/temp-compact-industry-heroes.yml

permissions:
  contents: write

jobs:
  compact-heroes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply industry hero updates
        run: python .github/scripts/compact_industry_heroes.py
      - name: Commit changes
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add industrias/educacion.html industrias/b2b.html industrias/marcas-b2c.html
          git commit -m "Compact industry heroes and link plans" || exit 0
          git push
