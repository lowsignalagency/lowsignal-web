name: Apply Insights global CTA
on:
  push:
    paths:
      - .github/workflows/apply-insights-global-cta.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Insights CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('recursos/insights.html')
          s = p.read_text()
          old = '''  <section class="insights-new-final">
    <div class="container insights-new-final-inner">
      <div>
        <p>SEGUIMOS CONSTRUYENDO</p>
        <h2>Ideas con menos ruido.<br><strong>Más señal.</strong></h2>
      </div>
      <a href="https://lowsignal.cl/recursos/insights">Explorar Insights</a>
    </div>
  </section>'''
          new = '''  <section class="lsr-band" id="contacto">
    <div class="lsr-wrap lsr-band-inner">
      <p>¿Construimos lo que viene?</p>
      <a href="https://calendly.com/felipe-lowsignal/30min" target="_blank" rel="noopener noreferrer">Hablemos</a>
    </div>
  </section>'''
          if old not in s:
              raise SystemExit('Expected Insights CTA block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify
        run: |
          grep -q '¿Construimos lo que viene?' recursos/insights.html
          grep -q 'calendly.com/felipe-lowsignal/30min' recursos/insights.html
          ! grep -q 'Explorar Insights' recursos/insights.html
      - name: Remove workflow
        run: rm .github/workflows/apply-insights-global-cta.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/insights.html .github/workflows/apply-insights-global-cta.yml
          git commit -m 'fix: use global CTA on Insights'
          git push
