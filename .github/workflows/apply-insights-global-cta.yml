name: Apply Insights global CTA
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace CTA
        run: python -c "from pathlib import Path; import re; p=Path('recursos/insights.html'); s=p.read_text(); new='''  <section class=\"lsr-band\" id=\"contacto\">\n    <div class=\"lsr-wrap lsr-band-inner\">\n      <p>¿Construimos lo que viene?</p>\n      <a href=\"https://calendly.com/felipe-lowsignal/30min\" target=\"_blank\" rel=\"noopener noreferrer\">Hablemos</a>\n    </div>\n  </section>'''; s2,n=re.subn(r'  <section class=\"insights-new-final\">.*?</section>',new,s,count=1,flags=re.S); assert n==1, f'replaced {n}'; p.write_text(s2)"
      - name: Verify
        run: grep -q '¿Construimos lo que viene?' recursos/insights.html && grep -q 'calendly.com/felipe-lowsignal/30min' recursos/insights.html
      - name: Remove workflow
        run: rm .github/workflows/apply-insights-global-cta.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recursos/insights.html .github/workflows/apply-insights-global-cta.yml
          git commit -m "fix: use global CTA on Insights"
          git push
