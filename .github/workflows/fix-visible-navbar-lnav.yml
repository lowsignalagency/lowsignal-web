name: One-time visible navbar fix

on:
  push:
    paths:
      - '.github/workflows/fix-visible-navbar-lnav.yml'

permissions:
  contents: write

jobs:
  patch-navbar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix actual visible desktop navbar
        shell: python
        run: |
          from pathlib import Path
          import re

          block = '''
          <style id="global-visible-lnav-fixed-v1">
          /* Actual visible desktop navbar: keep it persistently visible while scrolling. */
          @media(min-width:761px){
            body > .lnav{
              position:fixed !important;
              top:0 !important;
              left:0 !important;
              right:0 !important;
              width:100% !important;
              z-index:2000 !important;
            }
          }
          </style>
          '''.strip()

          changed=[]
          for path in Path('.').rglob('*.html'):
            text=path.read_text(encoding='utf-8')
            if 'class="lnav"' not in text or '</head>' not in text:
              continue
            text=re.sub(r'\s*<style id="global-visible-lnav-fixed-v1">.*?</style>\s*','\n',text,flags=re.S)
            text=text.replace('</head>',block+'\n</head>',1)
            path.write_text(text,encoding='utf-8')
            changed.append(str(path))

          print(f'Updated {len(changed)} HTML files')
          for p in changed:
            print(' -',p)

          wf=Path('.github/workflows/fix-visible-navbar-lnav.yml')
          if wf.exists():
            wf.unlink()

      - name: Commit navbar fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: keep visible desktop navbar fixed on scroll"
          git push origin main
