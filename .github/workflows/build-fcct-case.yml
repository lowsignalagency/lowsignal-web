name: Build FCCT case

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_fcct_case_from_rech.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/build_fcct_case_from_rech.py
      - name: Commit case
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add casos/fcct.html
          git diff --cached --quiet || git commit -m "Refresh FCCT customer story"
          git push
