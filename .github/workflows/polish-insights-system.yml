name: Polish Insights visual system
on:
  push:
    paths:
      - '.github/workflows/polish-insights-system.yml'
jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply final Insights system polish
        env:
          INDEX_CSS_B64: ''
          ARTICLE_CSS_B64: ''
        run: |
          python - <<'PY'
          import os, base64, re
          from pathlib import Path
          index_css=base64.b64decode(os.environ['INDEX_CSS_B64']).decode()
          article_css=base64.b64decode(os.environ['ARTICLE_CSS_B64']).decode()
          def upsert(path, block_id, css):
              p=Path(path)
              s=p.read_text()
              pattern=rf'\n?<style id="{re.escape(block_id)}">.*?</style>\n?'
              s=re.sub(pattern,'\n',s,flags=re.S)
              if '</head>' not in s:
                  raise SystemExit(f'No </head> in {path}')
              s=s.replace('</head>',css+'\n</head>',1)
              p.write_text(s)
          upsert('recursos/insights.html','insights-system-polish-v2',index_css)
          for path in [
              'recursos/insights/100-ideas-puestas-en-marcha.html',
              'recursos/insights/6-meses-construyendo-lowsignal.html',
              'recursos/insights/ai-native-startups-platanus.html',
              'recursos/insights/platanus-ai-native-startups-4.html',
              'recursos/insights/tech-founders-ama.html',
          ]:
              upsert(path,'insight-article-system-polish-v2',article_css)
          PY
      - name: Verify
        run: |
          grep -q 'insights-system-polish-v2' recursos/insights.html
          grep -q 'insight-article-system-polish-v2' recursos/insights/100-ideas-puestas-en-marcha.html
          grep -q 'insight-article-system-polish-v2' recursos/insights/6-meses-construyendo-lowsignal.html
          grep -q 'insight-article-system-polish-v2' recursos/insights/ai-native-startups-platanus.html
          grep -q 'insight-article-system-polish-v2' recursos/insights/platanus-ai-native-startups-4.html
          grep -q 'insight-article-system-polish-v2' recursos/insights/tech-founders-ama.html
      - name: Remove one-shot workflow
        run: rm .github/workflows/polish-insights-system.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/insights.html recursos/insights .github/workflows/polish-insights-system.yml
          git commit -m 'fix: align Insights sizing and spacing to refreshed site system'
          git push
