name: Polish Insights visual system
on:
  push:
    paths:
      - '.github/workflows/polish-insights-system.yml'
jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply final Insights system polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_css = r'''
<style id="insights-system-polish-v2">
/* Final Insights rhythm — aligned with refreshed lowsignal system */
.insights-new-hero .container,
.insights-new-featured .container,
.insights-new-grid-section .container,
.insights-new-themes .container,
.insights-new-final .container{
  width:min(1220px,calc(100% - 128px));
  margin-inline:auto;
}
.insights-new-hero{padding:136px 0 84px}
.insights-new-hero-grid{grid-template-columns:minmax(0,1fr) minmax(280px,.58fr);gap:72px}
.insights-new-copy h1{max-width:720px;font-size:clamp(48px,4.6vw,66px);line-height:1.03;letter-spacing:-.05em}
.insights-new-copy>p:last-child{max-width:680px;font-size:16px;line-height:1.65}
.insights-new-side p{font-size:14px;line-height:1.65}
.insights-new-featured,
.insights-new-grid-section,
.insights-new-themes{padding:88px 0}
.insights-new-feature-card{border-radius:18px}
.insights-new-feature-copy h2{font-size:clamp(34px,3.2vw,46px);line-height:1.08;letter-spacing:-.04em}
.insights-new-grid-head h2,
.insights-new-themes h2{font-size:clamp(34px,3.4vw,48px);line-height:1.08;letter-spacing:-.04em}
.insights-new-grid-head{gap:56px}
.insights-new-cards{gap:20px;margin-top:42px}
.insights-new-card{border-radius:16px}
.insights-new-card h3{font-size:22px;line-height:1.22}
.insights-new-theme-grid{gap:16px;margin-top:42px}
.insights-new-theme-grid article{border-radius:16px}
.insights-new-final{padding:80px 0}
.insights-new-final h2{font-size:clamp(38px,4vw,48px);line-height:1.06}
.insights-new-feature-card:hover,
.insights-new-card:hover,
.insights-new-theme-grid article:hover{transform:translateY(-3px)}
@media(max-width:1100px){
  .insights-new-hero .container,
  .insights-new-featured .container,
  .insights-new-grid-section .container,
  .insights-new-themes .container,
  .insights-new-final .container{width:calc(100% - 48px)}
  .insights-new-hero-grid,.insights-new-grid-head{grid-template-columns:1fr;gap:32px}
}
@media(max-width:760px){
  .insights-new-hero .container,
  .insights-new-featured .container,
  .insights-new-grid-section .container,
  .insights-new-themes .container,
  .insights-new-final .container{width:calc(100% - 32px)}
  .insights-new-hero{padding:112px 0 60px}
  .insights-new-copy h1{font-size:38px;line-height:1.05;margin-top:16px}
  .insights-new-copy>p:last-child{font-size:15px;margin-top:20px}
  .insights-new-featured,.insights-new-grid-section,.insights-new-themes{padding:64px 0}
  .insights-new-feature-copy h2,.insights-new-grid-head h2,.insights-new-themes h2{font-size:32px}
  .insights-new-cards{grid-template-columns:1fr;margin-top:32px}
  .insights-new-final{padding:64px 0}
  .insights-new-final h2{font-size:36px}
}
</style>
'''

          article_css = r'''
<style id="insight-article-system-polish-v2">
/* Final article rhythm — aligned with refreshed lowsignal system */
.article-new-hero .container,
.article-new-body .container,
.article-new-more .container{
  width:min(1220px,calc(100% - 128px));
  margin-inline:auto;
}
.article-new-hero{padding:136px 0 80px}
.article-new-hero-grid{grid-template-columns:minmax(0,1fr) minmax(240px,.34fr);gap:56px;margin-top:22px}
.article-new-hero h1{max-width:820px;font-size:clamp(46px,4.5vw,64px);line-height:1.04;letter-spacing:-.05em}
.article-new-hero-grid>div>p{max-width:700px;font-size:17px;line-height:1.62;margin-top:24px}
.article-new-meta{margin-top:24px}
.article-new-cover{margin-top:42px;border-radius:18px}
.article-new-body{padding:88px 0}
.article-new-body-grid{grid-template-columns:190px minmax(0,720px);gap:72px;justify-content:center}
.article-new-content .article-new-lead{font-size:22px;line-height:1.5;margin-bottom:28px}
.article-new-content>p{font-size:16px;line-height:1.75;margin-bottom:26px}
.article-new-content h2{font-size:32px;line-height:1.18;margin:46px 0 18px}
.article-new-more{padding-top:80px;padding-bottom:80px}
.article-new-more-grid h3{font-size:20px;line-height:1.25}
@media(max-width:1100px){
  .article-new-hero .container,
  .article-new-body .container,
  .article-new-more .container{width:calc(100% - 48px)}
  .article-new-hero-grid{grid-template-columns:1fr;gap:28px}
  .article-new-body-grid{grid-template-columns:1fr;gap:38px}
  .article-new-sidebar{position:static;display:grid;grid-template-columns:1fr 1fr;gap:18px}
}
@media(max-width:760px){
  .article-new-hero .container,
  .article-new-body .container,
  .article-new-more .container{width:calc(100% - 32px)}
  .article-new-hero{padding:112px 0 60px}
  .article-new-hero h1{font-size:38px;line-height:1.05}
  .article-new-hero-grid>div>p{font-size:15px;line-height:1.65}
  .article-new-cover{height:auto;aspect-ratio:16/10;margin-top:28px;border-radius:14px}
  .article-new-body{padding:64px 0}
  .article-new-sidebar{grid-template-columns:1fr}
  .article-new-content .article-new-lead{font-size:20px}
  .article-new-content>p{font-size:15px;line-height:1.72}
  .article-new-content h2{font-size:28px;margin-top:40px}
  .article-new-more{padding-top:64px;padding-bottom:64px}
}
</style>
'''

          def upsert(path, block_id, css):
              p=Path(path)
              s=p.read_text()
              pattern=rf'\n?<style id="{re.escape(block_id)}">.*?</style>\n?'
              s=re.sub(pattern,'\n',s,flags=re.S)
              if '</head>' not in s:
                  raise SystemExit(f'No </head> in {path}')
              s=s.replace('</head>',css+'\n</head>',1)
              p.write_text(s)

          upsert('recursos/insights.html','insights-system-polish-v2',index_css)
          for path in [
              'recursos/insights/100-ideas-puestas-en-marcha.html',
              'recursos/insights/6-meses-construyendo-lowsignal.html',
              'recursos/insights/ai-native-startups-platanus.html',
              'recursos/insights/platanus-ai-native-startups-4.html',
              'recursos/insights/tech-founders-ama.html',
          ]:
              upsert(path,'insight-article-system-polish-v2',article_css)
          PY
      - name: Verify
        run: |
          grep -q 'insights-system-polish-v2' recursos/insights.html
          for f in recursos/insights/*.html; do
            [ "$(basename "$f")" = "..." ] && continue
            grep -q 'insight-article-system-polish-v2' "$f"
          done
      - name: Remove one-shot workflow
        run: rm .github/workflows/polish-insights-system.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/insights.html recursos/insights .github/workflows/polish-insights-system.yml
          git commit -m 'fix: align Insights sizing and spacing to refreshed site system'
          git push
