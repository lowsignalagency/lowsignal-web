name: Force Nosotros team 4 plus 2

on:
  push:
    paths:
      - '.github/workflows/fix-nosotros-4-2.yml'

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force exact 4 + 2 desktop layout
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('nosotros.html')
          html = path.read_text(encoding='utf-8')
          marker = '</head>'
          css = '''
<style id="nosotros-team-force-4-2-v2">
@media (min-width: 901px){
  .team-grid{
    display:grid!important;
    grid-template-columns:repeat(4,minmax(0,1fr))!important;
  }
  .team-grid>.person:nth-child(1){grid-column:1!important;grid-row:1!important}
  .team-grid>.person:nth-child(2){grid-column:2!important;grid-row:1!important}
  .team-grid>.person:nth-child(3){grid-column:3!important;grid-row:1!important}
  .team-grid>.person:nth-child(4){grid-column:4!important;grid-row:1!important}
  .team-grid>.person:nth-child(5){grid-column:1!important;grid-row:2!important}
  .team-grid>.person:nth-child(6){grid-column:2!important;grid-row:2!important}
}
</style>
'''
          if 'nosotros-team-force-4-2-v2' not in html:
              html = html.replace(marker, css + marker, 1)
          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nosotros.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Force Nosotros team 4 plus 2 layout"
          git push
