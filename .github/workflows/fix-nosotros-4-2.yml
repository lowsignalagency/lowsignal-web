name: Force Nosotros team four two

on:
  push:
    paths:
      - .github/workflows/fix-nosotros-4-2.yml

permissions:
  contents: write

jobs:
  fix_layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply layout
        shell: bash
        run: |
          cat > /tmp/team-layout.html <<'EOF'
          <style id="nosotros-team-force-4-2-v2">
          @media (min-width: 901px){
            .team-grid{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important}
            .team-grid>.person:nth-child(1){grid-column:1!important;grid-row:1!important}
            .team-grid>.person:nth-child(2){grid-column:2!important;grid-row:1!important}
            .team-grid>.person:nth-child(3){grid-column:3!important;grid-row:1!important}
            .team-grid>.person:nth-child(4){grid-column:4!important;grid-row:1!important}
            .team-grid>.person:nth-child(5){grid-column:1!important;grid-row:2!important}
            .team-grid>.person:nth-child(6){grid-column:2!important;grid-row:2!important}
          }
          </style>
          EOF
          python3 -c "from pathlib import Path; p=Path('nosotros.html'); h=p.read_text(); css=Path('/tmp/team-layout.html').read_text(); p.write_text(h if 'nosotros-team-force-4-2-v2' in h else h.replace('</head>', css + '</head>', 1))"
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add nosotros.html
          git diff --cached --quiet && exit 0
          git commit -m "Force Nosotros 4 plus 2 team layout"
          git push
