name: Patch B2B pricing
on:
  push:
    paths:
      - '.github/workflows/patch-b2b-pricing.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject pricing enhancer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('industrias/b2b.html')
          s = p.read_text()
          tag = '<script src="https://lowsignal.cl/assets/b2b-pricing-enhance.js"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add industrias/b2b.html
          git diff --cached --quiet || git commit -m "Enable B2B pricing enhancements"
          git push
