name: Tighten 404 line height
on:
  push:
    paths:
      - '.github/workflows/tighten-404-lineheight.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tighten headline line height
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('404.html')
          s = p.read_text()
          old = 'font-size:clamp(58px,6.4vw,96px);\n  line-height:.92;'
          new = 'font-size:clamp(58px,6.4vw,96px);\n  line-height:.84;'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 404.html
          git commit -m 'fix: tighten 404 headline line height'
          git push
