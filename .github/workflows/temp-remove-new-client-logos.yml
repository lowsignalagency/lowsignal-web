name: Remove new Home client logos

on:
  push:
    paths:
      - .github/scripts/remove_new_client_logos.py
      - .github/workflows/temp-remove-new-client-logos.yml

permissions:
  contents: write

jobs:
  remove-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove new client logos
        run: python .github/scripts/remove_new_client_logos.py
      - name: Commit change
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add index.html
          git commit -m "Remove Ryuki Vandalo and Se Remonta from Home" || exit 0
          git push
