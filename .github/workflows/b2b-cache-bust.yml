name: B2B cache bust v7
on:
  push:
    paths:
      - '.github/workflows/b2b-cache-bust.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version B2B pricing enhancer asset
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('industrias/b2b.html')
          s = p.read_text()
          old = '<script src="https://lowsignal.cl/assets/b2b-pricing-enhance.js?v=6"></script>'
          new = '<script src="https://lowsignal.cl/assets/b2b-pricing-enhance.js?v=7"></script>'
          if old not in s:
              raise SystemExit('Expected B2B v6 reference not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit cache bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add industrias/b2b.html
          git commit -m "Bump B2B enhancer to v7"
          git push
# trigger-v7
