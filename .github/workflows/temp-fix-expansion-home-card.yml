name: Fix expansion Home card
on:
  push:
    paths:
      - .github/scripts/fix_expansion_home_card.py
      - .github/workflows/temp-fix-expansion-home-card.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Home card placement
        run: python .github/scripts/fix_expansion_home_card.py
      - name: Commit changes
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add index.html
          git commit -m "Fix expansion insight card placement" || exit 0
          git push
