name: Update Felipe bio

on:
  push:
    paths:
      - .github/workflows/update-felipe-bio.yml

permissions:
  contents: write

jobs:
  update-bio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b2b-pricing-v1
          fetch-depth: 0

      - name: Add industry pricing links to B2B preview nav
        shell: python
        run: |
          from pathlib import Path
          p = Path('industrias/b2b.html')
          s = p.read_text(encoding='utf-8')

          reps = [
            (
              '<a href="https://lowsignal.cl/industrias/educacion"><b>lowsignal for education</b><small>Para colegios, redes, fundaciones e instituciones.</small></a>',
              '<a href="https://lowsignal.cl/industrias/educacion"><b>lowsignal for education</b><small>Para colegios, redes, fundaciones e instituciones.</small></a><a href="https://lowsignal.cl/industrias/educacion#planes-education"><b>Planes para instituciones</b><small>Desde 5 UF + IVA / mes</small></a>'
            ),
            (
              '<a href="https://lowsignal.cl/industrias/b2b"><b>lowsignal for B2B</b><small>Para SaaS, tecnología, servicios e industria.</small></a><a href="#planes-b2b"><b>Planes para empresas</b><small>Presence, Growth y Scale.</small></a>',
              '<a href="https://lowsignal.cl/industrias/b2b"><b>lowsignal for B2B</b><small>Para SaaS, tecnología, servicios e industria.</small></a><a href="#planes-b2b"><b>Planes para empresas</b><small>Desde 6 UF + IVA / mes</small></a>'
            ),
            (
              '<a href="https://lowsignal.cl/industrias/marcas-b2c"><b>lowsignal for B2C</b><small>Para retail, hospitality, food y lifestyle.</small></a>',
              '<a href="https://lowsignal.cl/industrias/marcas-b2c"><b>lowsignal for B2C</b><small>Para retail, hospitality, food y lifestyle.</small></a><a href="https://lowsignal.cl/industrias/marcas-b2c"><b>Planes para marcas</b><small>Desde 5 UF + IVA / mes</small></a>'
            ),
            (
              '<a href="https://lowsignal.cl/industrias/educacion"><strong>lowsignal for education</strong><small>Colegios, redes y fundaciones</small></a>',
              '<a href="https://lowsignal.cl/industrias/educacion"><strong>lowsignal for education</strong><small>Colegios, redes y fundaciones</small></a><a href="https://lowsignal.cl/industrias/educacion#planes-education"><strong>Planes para instituciones</strong><small>Desde 5 UF + IVA / mes</small></a>'
            ),
            (
              '<a href="https://lowsignal.cl/industrias/b2b"><strong>lowsignal for B2B</strong><small>Servicios y ciclos de venta complejos</small></a><a href="#planes-b2b"><strong>Planes B2B</strong><small>Presence, Growth y Scale</small></a>',
              '<a href="https://lowsignal.cl/industrias/b2b"><strong>lowsignal for B2B</strong><small>Servicios y ciclos de venta complejos</small></a><a href="#planes-b2b"><strong>Planes para empresas</strong><small>Desde 6 UF + IVA / mes</small></a>'
            ),
            (
              '<a href="https://lowsignal.cl/industrias/marcas-b2c"><strong>lowsignal for B2C</strong><small>Consumo, retail y experiencias</small></a>',
              '<a href="https://lowsignal.cl/industrias/marcas-b2c"><strong>lowsignal for B2C</strong><small>Consumo, retail y experiencias</small></a><a href="https://lowsignal.cl/industrias/marcas-b2c"><strong>Planes para marcas</strong><small>Desde 5 UF + IVA / mes</small></a>'
            )
          ]

          changed = False
          for old, new in reps:
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
          if not changed:
              raise SystemExit('No nav pricing targets found')
          p.write_text(s, encoding='utf-8')

      - name: Commit nav preview
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add industrias/b2b.html
          git commit -m "Add industry pricing links to nav preview" || exit 0
          git push origin HEAD:b2b-pricing-v1
