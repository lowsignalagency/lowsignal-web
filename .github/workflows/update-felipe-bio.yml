name: Update Felipe bio

on:
  push:
    paths:
      - .github/workflows/update-felipe-bio.yml

permissions:
  contents: write

jobs:
  update-bio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b2c-pricing-v1
          fetch-depth: 0

      - name: Add B2C pricing preview
        shell: python
        run: |
          from pathlib import Path
          p = Path('industrias/marcas-b2c.html')
          s = p.read_text(encoding='utf-8')

          css = '''<style id="b2c-pricing-v1">
          .b2c-pricing{background:#fff;padding:108px 0 112px}.b2c-pricing-head{display:grid;grid-template-columns:1fr .82fr;gap:76px;align-items:end}.b2c-pricing-head h2{margin:17px 0 0;color:#10193C;font-size:clamp(38px,4vw,54px);line-height:1.08;letter-spacing:-.045em;font-weight:300}.b2c-pricing-head h2 strong{color:#1419E0;font-weight:300}.b2c-pricing-intro{margin:0;color:#7A86A7;font-size:14px;line-height:1.72}.b2c-pricing-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:48px;align-items:stretch}.b2c-plan{position:relative;display:flex;flex-direction:column;min-height:650px;padding:28px;border:1px solid #DCE3F2;border-radius:18px;background:#fff}.b2c-plan.is-featured{background:#0A1230;border-color:#0A1230;box-shadow:0 18px 44px rgba(10,18,48,.14)}.b2c-plan-badge{position:absolute;top:18px;right:18px;padding:7px 10px;border-radius:999px;background:#EEF0FF;color:#3148D8;font-size:8px;font-weight:800;letter-spacing:.12em}.b2c-plan-kicker{margin:0;color:#5365D9;font-size:9px;font-weight:800;letter-spacing:.16em}.b2c-plan.is-featured .b2c-plan-kicker{color:#8EA3FF}.b2c-plan h3{margin:15px 0 0;color:#16204A;font-size:24px;line-height:1.22;letter-spacing:-.03em;font-weight:500}.b2c-plan.is-featured h3{color:#fff}.b2c-plan-desc{margin:12px 0 0;color:#7A86A7;font-size:12px;line-height:1.65}.b2c-plan.is-featured .b2c-plan-desc{color:#98A4C5}.b2c-plan-price{margin-top:26px;padding-top:24px;border-top:1px solid #E3E8F2;display:flex;align-items:baseline;gap:7px}.b2c-plan.is-featured .b2c-plan-price{border-color:rgba(255,255,255,.12)}.b2c-plan-price strong{color:#1419E0;font-size:38px;letter-spacing:-.05em;font-weight:600}.b2c-plan.is-featured .b2c-plan-price strong{color:#A9B5FF}.b2c-plan-price span{color:#8490AD;font-size:11px}.b2c-plan ul{list-style:none;margin:26px 0 30px;padding:0}.b2c-plan li{position:relative;padding-left:17px;color:#576584;font-size:12px;line-height:1.48}.b2c-plan li+li{margin-top:11px}.b2c-plan li:before{content:"/";position:absolute;left:0;color:#5365D9;font-weight:800}.b2c-plan.is-featured li{color:#C2CAE0}.b2c-plan.is-featured li:before{color:#8EA3FF}.b2c-plan-cta{width:100%;min-height:48px;margin-top:auto;border-radius:999px;display:flex;align-items:center;justify-content:center;background:#F3F5FA;color:#17235D;font-size:11px;font-weight:700;transition:.2s ease}.b2c-plan-cta:hover{transform:translateY(-2px);background:#E9EDF7}.b2c-plan.is-featured .b2c-plan-cta{background:#fff;color:#17235D}.b2c-pricing-note{margin-top:18px;color:#7A86A7;font-size:10px;line-height:1.55}.b2c-pricing-note strong{color:#16204A;font-weight:600}.b2c-pricing-custom{margin-top:18px;padding:28px 30px;border:1px solid #DCE3F2;border-radius:18px;background:#F4F6FC;display:flex;align-items:center;justify-content:space-between;gap:28px}.b2c-pricing-custom>div{max-width:760px}.b2c-pricing-custom span{display:block;color:#5365D9;font-size:9px;font-weight:700;letter-spacing:.16em}.b2c-pricing-custom h3{margin:9px 0 0;color:#16204A;font-size:24px;letter-spacing:-.03em;font-weight:500}.b2c-pricing-custom p{margin:8px 0 0;color:#7A86A7;font-size:12px;line-height:1.65}.b2c-pricing-custom a{flex:none;min-height:46px;padding:0 20px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:#1419E0;color:#fff;font-size:11px;font-weight:700;transition:.2s ease}.b2c-pricing-custom a:hover{transform:translateY(-2px);background:#2832F3}@media(max-width:980px){.b2c-pricing-head{grid-template-columns:1fr;gap:22px}.b2c-pricing-grid{grid-template-columns:1fr}.b2c-plan{min-height:0}.b2c-pricing-custom{flex-direction:column;align-items:flex-start}.b2c-pricing-custom a{width:100%}}@media(max-width:760px){.b2c-pricing{padding:78px 0}.b2c-pricing-head h2{font-size:35px}.b2c-pricing-grid{margin-top:34px}.b2c-plan{padding:24px}.b2c-pricing-custom{padding:22px}.b2c-pricing-custom h3{font-size:21px}}
          </style>'''
          if 'id="b2c-pricing-v1"' not in s:
              s = s.replace('</head>', css + '\n</head>', 1)

          section = '''  <section class="b2c-pricing" id="planes-b2c">
            <div class="ls-social-shell">
              <div class="b2c-pricing-head"><div><p class="b2c-new-eyebrow">PLANES B2C</p><h2>Una base clara para crecer.<br><strong>Elige cuánto quieres acelerar.</strong></h2></div><p class="b2c-pricing-intro">Planes mensuales para marcas que necesitan conectar contenido, campañas y conversión en un sistema digital consistente.</p></div>
              <div class="b2c-pricing-grid">
                <article class="b2c-plan"><p class="b2c-plan-kicker">PRESENCE</p><h3>Presencia que mantiene tu marca activa.</h3><p class="b2c-plan-desc">Para marcas que necesitan contenido constante, orden y una base digital profesional.</p><div class="b2c-plan-price"><strong>5 UF</strong><span>+ IVA / mes</span></div><ul><li>3 jornadas de contenido al año</li><li>1 reel o video mensual</li><li>4 posts o carruseles mensuales</li><li>Hasta 4 stories mensuales</li><li>Gestión de redes sociales</li><li>Gestión de Ads</li><li>Hasta 1 campaña activa</li><li>Planificación y reporte mensual</li></ul><a class="b2c-plan-cta" href="https://calendly.com/felipe-lowsignal/30min" target="_blank" rel="noopener noreferrer">Conversemos</a></article>
                <article class="b2c-plan is-featured"><span class="b2c-plan-badge">RECOMENDADO</span><p class="b2c-plan-kicker">GROWTH</p><h3>Contenido y performance conectados.</h3><p class="b2c-plan-desc">Para marcas que quieren transformar atención en tráfico, reservas, compras y nuevas oportunidades.</p><div class="b2c-plan-price"><strong>8 UF</strong><span>+ IVA / mes</span></div><ul><li>4 jornadas de contenido al año</li><li>4 reels o videos mensuales</li><li>6 posts o carruseles mensuales</li><li>Hasta 8 stories mensuales</li><li>Gestión de redes sociales</li><li>Gestión y optimización de Ads</li><li>Hasta 3 campañas activas</li><li>Campañas promocionales o estacionales</li><li>Reporte mensual con insights y próximos pasos</li></ul><a class="b2c-plan-cta" href="https://calendly.com/felipe-lowsignal/30min" target="_blank" rel="noopener noreferrer">Quiero crecer</a></article>
                <article class="b2c-plan"><p class="b2c-plan-kicker">SCALE</p><h3>Un sistema digital más completo.</h3><p class="b2c-plan-desc">Para marcas que necesitan mayor frecuencia y conectar contenido, performance, web y automatización.</p><div class="b2c-plan-price"><strong>11 UF</strong><span>+ IVA / mes</span></div><ul><li>5 jornadas de contenido al año</li><li>6 reels o videos mensuales</li><li>8 posts o carruseles mensuales</li><li>Hasta 12 stories mensuales</li><li>Gestión de redes sociales</li><li>Gestión y optimización de Ads</li><li>Hasta 4 campañas activas</li><li>Soporte web prioritario</li><li>Automatizaciones y seguimiento según alcance</li><li>Dashboard y revisión estratégica</li></ul><a class="b2c-plan-cta" href="https://calendly.com/felipe-lowsignal/30min" target="_blank" rel="noopener noreferrer">Hablemos de Scale</a></article>
              </div>
              <div class="b2c-pricing-note"><strong>Inversión publicitaria no incluida.</strong> El presupuesto de Meta, TikTok, Google u otras plataformas se define según objetivos y campaña.</div>
              <div class="b2c-pricing-custom"><div><span>PLAN A MEDIDA</span><h3>¿Necesitas algo distinto?</h3><p>Podemos adaptar el alcance a tu marca.</p></div><a href="https://calendly.com/felipe-lowsignal/30min" target="_blank" rel="noopener noreferrer">Conversemos</a></div>
            </div>
          </section>\n\n'''
          marker = '  <section class="b2c-new-cases">'
          if 'id="planes-b2c"' not in s:
              if marker not in s:
                  raise SystemExit('B2C cases marker not found')
              s = s.replace(marker, section + marker, 1)

          desktop = '<a href="https://lowsignal.cl/industrias/marcas-b2c"><b>lowsignal for B2C</b><small>Para retail, hospitality, food y lifestyle.</small></a>'
          if desktop in s and 'href="#planes-b2c"><b>Planes para marcas</b>' not in s:
              s = s.replace(desktop, desktop + '<a href="#planes-b2c"><b>Planes para marcas</b><small>Desde 5 UF + IVA / mes.</small></a>', 1)
          mobile = '<a href="https://lowsignal.cl/industrias/marcas-b2c"><strong>lowsignal for B2C</strong><small>Consumo, retail y experiencias</small></a>'
          if mobile in s and 'href="#planes-b2c"><strong>Planes para marcas</strong>' not in s:
              s = s.replace(mobile, mobile + '<a href="#planes-b2c"><strong>Planes para marcas</strong><small>Desde 5 UF + IVA / mes</small></a>', 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit B2C preview
        shell: bash
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add industrias/marcas-b2c.html
          git commit -m "Add B2C pricing plans" || exit 0
          git push origin HEAD:b2c-pricing-v1
