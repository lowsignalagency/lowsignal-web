name: Update Felipe bio

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-felipe-bio.yml

permissions:
  contents: write

jobs:
  update-bio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b2b-pricing-v1
          fetch-depth: 0

      - name: Apply B2B pricing preview
        run: python .github/scripts/apply_b2b_pricing.py

      - name: Commit B2B pricing preview
        shell: bash
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add industrias/b2b.html
          git commit -m "Add B2B pricing plans" || exit 0
          git push origin HEAD:b2b-pricing-v1
