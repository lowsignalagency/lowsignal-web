name: Add expansion insight
on:
  push:
    paths:
      - .github/scripts/add_expansion_insight.py
      - .github/workflows/temp-add-expansion-insight.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add expansion insight
        run: python .github/scripts/add_expansion_insight.py
      - name: Commit changes
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add index.html recursos/insights.html recursos/insights/lowsignal-se-expande-tres-industrias-un-sistema.html
          git commit -m "Add lowsignal expansion insight" || exit 0
          git push
