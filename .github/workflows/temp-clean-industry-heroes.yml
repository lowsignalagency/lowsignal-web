name: Clean industry heroes
on:
  push:
    paths:
      - .github/scripts/clean_industry_heroes.py
      - .github/workflows/temp-clean-industry-heroes.yml
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hero cleanup
        run: python .github/scripts/clean_industry_heroes.py
      - name: Commit changes
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add industrias/educacion.html industrias/b2b.html industrias/marcas-b2c.html
          git commit -m "Clean and align industry heroes" || exit 0
          git push
