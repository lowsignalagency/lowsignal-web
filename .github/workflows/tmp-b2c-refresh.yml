name: One-off B2C refresh

on:
  push:
    paths:
      - '.github/workflows/tmp-b2c-refresh.yml'
      - 'scripts/tmp_b2c_refresh.py'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh B2C page
        run: python scripts/tmp_b2c_refresh.py
      - name: Commit refresh and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-b2c-refresh.yml scripts/tmp_b2c_refresh.py
          git add industrias/marcas-b2c.html
          git commit -m "Refresh B2C industry page"
          git push
