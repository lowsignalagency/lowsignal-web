name: Add Salvador Dali testimonial
on:
  push:
    paths:
      - '.github/scripts/add_dali_testimonial.py'
      - '.github/workflows/temp-add-dali-testimonial.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/add_dali_testimonial.py
      - run: git config user.name lowsignal-bot
      - run: git config user.email actions@users.noreply.github.com
      - run: git add casos/salvador-dali.html
      - run: git commit -m 'Add Karina testimonial to Salvador Dali case'
        continue-on-error: true
      - run: git push
