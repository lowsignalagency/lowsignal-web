name: Sync Jobs footer once
on: push
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply current Home footer system to Jobs pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=[Path('recursos/jobs.html'),Path('recursos/jobs/growth-ambassador.html')]
          css=r'''
<style id="jobs-home-footer-sync-v1">
footer{background:#050A18!important;color:#A0A9BF!important;padding:50px 0 22px!important;font-size:14px!important;border-top:1px solid rgba(255,255,255,.06)!important}
footer .footer-container{width:min(1220px,calc(100% - 128px))!important;max-width:1220px!important;margin-inline:auto!important;padding-left:0!important;padding-right:0!important}
.footer-main{display:grid!important;grid-template-columns:1.45fr .8fr .72fr .78fr!important;gap:46px!important;align-items:start!important}
.footer-brand img{height:24px!important;width:auto!important}
.footer-brand-copy{max-width:350px!important;margin:18px 0 0!important;font-size:13px!important;line-height:1.65!important;color:#8E98AE!important}
.footer-claim{margin-top:20px!important;font-size:16px!important;color:#F4F6FB!important}.footer-claim strong{color:#7690FF!important}
.footer-ai{max-width:420px!important;margin-top:24px!important;padding-top:17px!important;border-top:1px solid rgba(150,175,255,.14)!important}
.footer-ai-label{margin:0 0 14px!important;color:#AEB7CA!important;font-size:13px!important;line-height:1.4!important}
.footer-ai-buttons{display:flex!important;align-items:center!important;gap:10px!important}
.footer-ai-button{width:42px!important;height:42px!important;padding:0!important;display:grid!important;place-items:center!important;border:1px solid rgba(138,164,255,.26)!important;border-radius:11px!important;background:#070F22!important;color:#8AA4FF!important}
.footer-ai-button:hover{background:#070F22!important;border-color:#7690FF!important;box-shadow:0 0 0 1px rgba(118,144,255,.12)!important;transform:translateY(-1px)!important}
.footer-ai-icon{width:18px!important;height:18px!important;object-fit:contain!important;display:block!important}.footer-ai-icon-openai{filter:invert(64%) sepia(64%) saturate(1462%) hue-rotate(194deg) brightness(102%) contrast(102%)!important}
.footer-title{margin:2px 0 16px!important;color:#7690FF!important;font-size:10px!important;font-weight:700!important;letter-spacing:.2em!important}
.footer-links{display:flex!important;flex-direction:column!important;gap:10px!important}.footer-links a{color:#C5CCDA!important;font-size:13px!important;display:inline-flex!important;align-items:center!important;width:fit-content!important;transition:color .2s ease,transform .2s ease!important}.footer-links a:hover{color:#8AA4FF!important;transform:translateX(2px)!important}
.footer-meta{margin-top:34px!important;padding:17px 0!important;border-top:1px solid rgba(150,175,255,.14)!important;border-bottom:1px solid rgba(150,175,255,.14)!important;display:grid!important;grid-template-columns:1fr 1fr 1fr!important;gap:20px!important;align-items:center!important;color:#8994AA!important;font-size:11px!important}
.footer-location{display:flex!important;align-items:center!important;gap:9px!important}.footer-meta .center{text-align:center!important;color:#B4BED0!important}
.footer-meta-social{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:10px!important}.footer-meta-social a{width:34px!important;height:34px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;border:1px solid rgba(138,164,255,.18)!important;border-radius:9px!important;color:#8AA4FF!important}.footer-meta-social a:hover{background:rgba(138,164,255,.08)!important;border-color:rgba(138,164,255,.34)!important;color:#fff!important;transform:translateY(-1px)!important}.footer-meta-social .brand-svg{width:16px!important;height:16px!important;flex:0 0 16px!important}
.footer-bottom{display:grid!important;grid-template-columns:1fr auto 1fr!important;gap:28px!important;align-items:center!important;padding-top:17px!important;color:#68758E!important;font-size:11px!important}.footer-made-latam{display:flex!important;align-items:center!important;gap:10px!important;color:#8994AA!important;font-size:10px!important;font-weight:700!important;letter-spacing:.12em!important;white-space:nowrap!important}.footer-made-line{display:inline-flex!important;align-items:center!important;gap:5px!important}.footer-heart{color:#AEB7CA!important;font-size:12px!important;line-height:1!important}.footer-made-country{display:inline-flex!important;align-items:center!important;padding-left:12px!important;border-left:1px solid rgba(137,148,170,.28)!important}.footer-made-country img{display:block!important;width:40px!important;height:auto!important;object-fit:contain!important;opacity:.92!important}.footer-bottom-links{display:flex!important;gap:24px!important;flex-wrap:wrap!important;justify-content:flex-end!important}
@media(max-width:1100px){footer .footer-container{width:calc(100% - 48px)!important}}
@media(max-width:900px){.footer-main{grid-template-columns:1fr 1fr!important}.footer-meta{grid-template-columns:1fr!important}.footer-meta .center{text-align:left!important}.footer-meta-social{justify-content:flex-start!important}.footer-bottom{grid-template-columns:1fr!important;justify-items:start!important;gap:14px!important}.footer-bottom-links{justify-content:flex-start!important}}
@media(max-width:620px){footer .footer-container{width:calc(100% - 40px)!important}.footer-main{grid-template-columns:1fr!important;gap:34px!important}.footer-made-latam{font-size:9px!important;gap:8px!important;flex-wrap:wrap!important}.footer-made-country{padding-left:8px!important}.footer-made-country img{width:36px!important}}
</style>
'''
          for p in files:
            s=p.read_text()
            s=re.sub(r'\s*<style id="jobs-home-footer-sync-v1">.*?</style>\s*','\n',s,flags=re.S)
            s=s.replace('</body>',css+'\n</body>',1)
            p.write_text(s)
          PY
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/sync-jobs-footer-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/jobs.html recursos/jobs/growth-ambassador.html .github/workflows/sync-jobs-footer-once.yml
          git commit -m 'fix: sync Jobs footer with Home'
          git push
