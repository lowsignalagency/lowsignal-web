name: Add Santiago to Insiders
on:
  push:
    paths:
      - '.github/workflows/add-santiago-insiders.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/add_santiago_insiders.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add recursos/insiders.html
          git diff --cached --quiet || git commit -m 'Tune Santiago Insider portrait framing'
          git push
