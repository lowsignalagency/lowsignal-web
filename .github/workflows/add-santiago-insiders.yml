name: Match Felipe CTA to Damián
on:
  push:
    paths:
      - '.github/workflows/add-santiago-insiders.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/match_felipe_cta_to_damian.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add equipo/felipe-quiroz.html
          git diff --cached --quiet || git commit -m 'Match Felipe CTA size to Damián'
          git push
