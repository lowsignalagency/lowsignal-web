name: Fix team profile browser history
on:
  push:
    paths:
      - '.github/workflows/add-santiago-insiders.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_team_profile_history.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add nosotros.html
          git diff --cached --quiet || git commit -m 'Fix team profile back navigation history'
          git push
