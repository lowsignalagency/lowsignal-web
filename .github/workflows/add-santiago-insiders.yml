name: Fix Insiders stagger motion
on:
  push:
    paths:
      - '.github/workflows/add-santiago-insiders.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_insiders_stagger.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add recursos/insiders.html
          git diff --cached --quiet || git commit -m 'Fix Insiders stagger for new members'
          git push
