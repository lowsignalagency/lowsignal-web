name: Clean team profile navigation
on:
  push:
    paths:
      - '.github/workflows/add-santiago-insiders.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/restore_nosotros_team_scroll.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add nosotros.html
          git diff --cached --quiet || git commit -m 'Remove duplicate team profile navigation handlers'
          git push
