name: Update Damián bio
on:
  push:
    paths:
      - '.github/workflows/add-santiago-insiders.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/update_damian_bio.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add equipo/damian-aldunate.html
          git diff --cached --quiet || git commit -m 'Update Damián profile bio'
          git push
