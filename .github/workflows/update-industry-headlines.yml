name: Update industry headlines

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_industry_headlines.py'
      - '.github/workflows/update-industry-headlines.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update industry headlines
        run: python scripts/update_industry_headlines.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Differentiate industry headlines"
          git push
# trigger industry headline refresh
