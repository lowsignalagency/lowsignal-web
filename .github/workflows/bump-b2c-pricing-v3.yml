name: B2C pricing enhancer v4
on:
  push:
    paths:
      - '.github/workflows/bump-b2c-pricing-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump B2C pricing assets
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('industrias/marcas-b2c.html')
          h=html.read_text()
          h=h.replace('b2c-pricing-enhance.js?v=3','b2c-pricing-enhance.js?v=4')
          html.write_text(h)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add industrias/marcas-b2c.html
          git diff --cached --quiet || git commit -m "Bump B2C pricing enhancer to v4"
          git push
