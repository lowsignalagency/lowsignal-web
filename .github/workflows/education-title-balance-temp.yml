name: Education title balance temp
on:
  push:
    paths:
      - '.github/scripts/education_title_balance.py'
      - '.github/workflows/education-title-balance-temp.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/education_title_balance.py
      - run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add industrias/educacion.html
          git commit -m "Balance Education hero title" || exit 0
          git push
