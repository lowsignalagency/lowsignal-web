name: Apply Education custom CTA
on:
  push:
    branches: [education-pricing-v1]
    paths: [.github/workflows/apply-education-custom-cta.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: education-pricing-v1
      - name: Apply CTA
        shell: python
        run: |
          from pathlib import Path
          p = Path('industrias/educacion.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="edu-pricing-note"><span><strong>Inversión publicitaria no incluida.</strong> El presupuesto de Meta, Google u otras plataformas se define según objetivos y campaña.</span><span>¿Necesitas algo distinto? Podemos adaptar el alcance a tu institución.</span></div>'
          new = '<div class="edu-pricing-note"><span><strong>Inversión publicitaria no incluida.</strong> El presupuesto de Meta, Google u otras plataformas se define según objetivos y campaña.</span></div>\n      <div class="edu-pricing-custom"><div><span>PLAN A MEDIDA</span><h3>¿Ningún plan calza perfecto?</h3><p>Podemos ajustar alcance, frecuencia y servicios según las necesidades de tu institución.</p></div><a href="https://calendly.com/felipe-lowsignal/30min" target="_blank" rel="noopener noreferrer">Conversemos</a></div>'
          assert old in s
          s = s.replace(old, new, 1)
          mark = '.edu-pricing-note strong{color:#16204A;font-weight:600}'
          extra = '.edu-pricing-custom{margin-top:18px;padding:28px 30px;border:1px solid #DCE3F2;border-radius:18px;background:#F4F6FC;display:flex;align-items:center;justify-content:space-between;gap:28px}.edu-pricing-custom>div{max-width:760px}.edu-pricing-custom span{display:block;color:#5365D9;font-size:9px;font-weight:700;letter-spacing:.16em}.edu-pricing-custom h3{margin:9px 0 0;color:#16204A;font-size:24px;letter-spacing:-.03em;font-weight:500}.edu-pricing-custom p{margin:8px 0 0;color:#7A86A7;font-size:12px;line-height:1.65}.edu-pricing-custom a{flex:none;min-height:46px;padding:0 20px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:#1419E0;color:#fff;font-size:11px;font-weight:700;transition:.2s ease}.edu-pricing-custom a:hover{transform:translateY(-2px);background:#2832F3}'
          assert mark in s
          s = s.replace(mark, mark + extra, 1)
          mobile = '.edu-pricing-note{flex-direction:column;gap:8px}'
          assert mobile in s
          s = s.replace(mobile, mobile + '.edu-pricing-custom{padding:22px;align-items:flex-start;flex-direction:column}.edu-pricing-custom h3{font-size:21px}.edu-pricing-custom a{width:100%}', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add industrias/educacion.html
          git commit -m "Emphasize custom Education plan CTA"
          git push origin HEAD:education-pricing-v1
