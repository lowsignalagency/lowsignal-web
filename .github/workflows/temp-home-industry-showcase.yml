name: Temporary Home industry showcase
on:
  push:
    paths:
      - '.github/scripts/home_industry_showcase.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Home industry showcase
        run: python3 .github/scripts/home_industry_showcase.py
      - name: Commit Home update
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add index.html
          git commit -m "Redesign Home industries showcase" || exit 0
          git push
