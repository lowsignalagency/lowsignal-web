name: Run RECH case refresh v4
on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_rech_case_v4.py'
      - '.github/workflows/run-refresh-rech-case-v4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/refresh_rech_case_v4.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add casos/rech.html
          git diff --cached --quiet || git commit -m "Simplify RECH customer story"
          git push
