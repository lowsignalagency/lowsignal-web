name: Add Insiders value cards
on:
  push:
    paths:
      - .github/scripts/add_insiders_value_cards.py
      - .github/workflows/temp-add-insiders-value-cards.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add cards
        run: python .github/scripts/add_insiders_value_cards.py
      - name: Commit changes
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add recursos/insiders.html
          git commit -m "Add value cards to Insiders" || exit 0
          git push
