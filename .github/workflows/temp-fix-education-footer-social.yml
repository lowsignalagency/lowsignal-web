name: Fix Education footer social icons

on:
  push:
    paths:
      - .github/scripts/fix_education_footer_social.py
      - .github/workflows/temp-fix-education-footer-social.yml

permissions:
  contents: write

jobs:
  fix-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply footer social icon fix
        run: python .github/scripts/fix_education_footer_social.py
      - name: Commit change
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add industrias/educacion.html
          git commit -m "Fix Education footer social icons" || exit 0
          git push
