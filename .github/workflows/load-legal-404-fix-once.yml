name: Load legal and 404 visual fix

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load final stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = [Path('404.html'), Path('politica-de-privacidad.html'), Path('terminos-de-servicio.html')]
          tag = '<link rel="stylesheet" href="https://lowsignal.cl/assets/legal-404-2026-fix.css?v=1">'
          for p in targets:
              t = p.read_text(encoding='utf-8')
              if tag not in t:
                  t = t.replace('</head>', tag + '\n</head>', 1)
              p.write_text(t, encoding='utf-8')
          PY
      - name: Commit
        run: |
          rm .github/workflows/load-legal-404-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 404.html politica-de-privacidad.html terminos-de-servicio.html .github/workflows/load-legal-404-fix-once.yml
          git commit -m "fix: refine 404 and legal pages"
          git push
