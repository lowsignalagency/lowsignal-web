name: Update navbar industry names
on:
  push:
    paths:
      - '.github/scripts/update_nav_industry_names.py'
      - '.github/workflows/temp-update-nav-industry-names.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/update_nav_industry_names.py
      - run: git config user.name lowsignal-bot
      - run: git config user.email actions@users.noreply.github.com
      - run: git add '*.html' '**/*.html'
      - run: git commit -m 'Update navbar industry names'
        continue-on-error: true
      - run: git push
