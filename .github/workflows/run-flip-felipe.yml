name: Update Felipe profile layout
on: workflow_dispatch
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/flip_felipe_profile.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add equipo/felipe-quiroz.html
          git diff --cached --quiet || git commit -m 'Update Felipe profile layout'
          git push
