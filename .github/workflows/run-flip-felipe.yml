name: Update Felipe profile layout
on:
  push:
    paths:
      - '.github/workflows/run-flip-felipe.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/refine_felipe_photo.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add equipo/felipe-quiroz.html
          git diff --cached --quiet || git commit -m 'Align Felipe profile margins and tighten CTA'
          git push
