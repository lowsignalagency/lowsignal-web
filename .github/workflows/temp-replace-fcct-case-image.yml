name: Replace FCCT case image

on:
  push:
    paths:
      - .github/scripts/replace_fcct_case_image.py
      - .github/workflows/temp-replace-fcct-case-image.yml

permissions:
  contents: write

jobs:
  replace-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace FCCT case image reference
        run: python .github/scripts/replace_fcct_case_image.py
      - name: Commit change
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add casos/fcct.html
          git commit -m "Update FCCT case image" || exit 0
          git push
