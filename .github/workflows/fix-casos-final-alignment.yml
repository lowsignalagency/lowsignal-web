name: Fix Casos final CTA

on:
  push:
    paths:
      - '.github/workflows/fix-casos-final-alignment.yml'

permissions:
  contents: write

jobs:
  fix-casos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply CTA fix
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python /tmp/fix.py

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "lowsignal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add casos.html
          git commit -m "Update Casos final CTA" || exit 0
          git push
