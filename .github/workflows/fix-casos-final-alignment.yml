name: Fix Casos final alignment

on:
  push:
    paths:
      - '.github/workflows/fix-casos-final-alignment.yml'

permissions:
  contents: write

jobs:
  fix-casos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add final last-in-cascade overrides
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('casos.html')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'\n?<style id="casos-final-alignment-v1">[\s\S]*?</style>\n?', '\n', text)

          lines = [
              '<style id="casos-final-alignment-v1">',
              '/* Final Casos alignment — intentionally last in cascade */',
              '@media(min-width:761px){',
              '  .stories-new-hero .container,',
              '  .stories-new-featured .container,',
              '  .stories-new-list .container,',
              '  .stories-new-proof .container,',
              '  .stories-new-final .container,',
              '  footer .footer-container{',
              '    width:min(1200px,calc(100% - 128px)) !important;',
              '    max-width:1200px !important;',
              '    margin-left:auto !important;',
              '    margin-right:auto !important;',
              '  }',
              '  .stories-new-hero{padding-top:150px !important;padding-bottom:72px !important;}',
              '  .stories-new-featured{padding-top:72px !important;}',
              '  body>.lnav .lnav-contact{',
              '    min-height:44px !important;',
              '    padding:0 20px !important;',
              '    border-radius:10px !important;',
              '    border:1px solid rgba(255,255,255,.12) !important;',
              '    background:#FFFFFF !important;',
              '    color:#101B4F !important;',
              '    box-shadow:none !important;',
              '    font-size:12px !important;',
              '    font-weight:650 !important;',
              '    transition:transform .2s ease,background-color .2s ease,box-shadow .2s ease !important;',
              '  }',
              '  body>.lnav .lnav-contact:hover{transform:translateY(-2px) !important;background:#F4F6FF !important;box-shadow:0 10px 24px rgba(0,0,0,.14) !important;}',
              '  .stories-new-final-inner{align-items:center !important;}',
              '  .stories-new-final a{',
              '    min-height:48px !important;',
              '    padding:0 22px !important;',
              '    border-radius:10px !important;',
              '    background:#FFFFFF !important;',
              '    color:#101B4F !important;',
              '    font-size:12px !important;',
              '    font-weight:700 !important;',
              '    box-shadow:none !important;',
              '  }',
              '}',
              '@media(max-width:760px){',
              '  .stories-new-hero .container,',
              '  .stories-new-featured .container,',
              '  .stories-new-list .container,',
              '  .stories-new-proof .container,',
              '  .stories-new-final .container,',
              '  footer .footer-container{width:calc(100% - 32px) !important;margin-left:auto !important;margin-right:auto !important;}',
              '}',
              '</style>'
          ]
          css = '\n'.join(lines)
          text = text.replace('</head>', css + '\n</head>', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit final Casos alignment
        shell: bash
        run: |
          if git diff --quiet -- casos.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "lowsignal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add casos.html
          git commit -m "Fix Casos margins and CTA cascade"
          git push
