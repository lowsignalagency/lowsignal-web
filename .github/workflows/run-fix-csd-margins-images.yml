name: Run CSD margin and image fix
on:
  push:
    paths:
      - 'scripts/fix_csd_margins_images.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply fix
        run: python scripts/fix_csd_margins_images.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add casos/salvador-dali.html
          git diff --cached --quiet || git commit -m 'Fix CSD margins and case imagery'
          git push
