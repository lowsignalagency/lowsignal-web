name: Run Customer Stories refresh v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/customer-stories-refresh-v3-run.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refresh
        run: python .github/scripts/customer_stories_refresh_v3.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add casos.html casos/*.html
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Customer Stories design and narrative"
          git push
