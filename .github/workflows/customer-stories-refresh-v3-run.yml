name: Run Customer Stories refresh v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/customer-stories-refresh-v3-run.yml'
      - 'scripts/build_rikdom_case_from_rech.py'
      - 'scripts/build_dimor_case_from_rech.py'
      - 'scripts/build_hub_case_from_rech.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply refresh
        run: python .github/scripts/customer_stories_refresh_v3.py
      - name: Build Rikdom case
        run: python scripts/build_rikdom_case_from_rech.py
      - name: Build Dimor case
        run: python scripts/build_dimor_case_from_rech.py
      - name: Build hUB case
        run: python scripts/build_hub_case_from_rech.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add casos.html casos/*.html
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Customer Stories design and narrative"
          git push

# hUB editorial refresh trigger
