name: Refine Insiders join card
on:
  push:
    paths:
      - .github/scripts/refine_insiders_join_card.py
      - .github/workflows/temp-refine-insiders-join-card.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine join card
        run: python .github/scripts/refine_insiders_join_card.py
      - name: Commit changes
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add recursos/insiders.html
          git commit -m "Refine Insiders join card" || exit 0
          git push
