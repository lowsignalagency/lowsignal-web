name: One-time Jobs system polish v2
on: push
jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply current design system to Jobs pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [Path('recursos/jobs.html'), Path('recursos/jobs/growth-ambassador.html')]

          css = r'''
<style id="jobs-system-polish-v2">
/* === Lock navbar to the current Home system === */
@media(min-width:1101px){
  body>.lnav{position:fixed!important;top:0!important;left:0!important;right:0!important;width:100%!important;z-index:2000!important}
  .lnav-row{width:min(1220px,calc(100% - 128px))!important;height:88px!important;gap:36px!important}
  .lnav-logo img{height:27px!important;width:auto!important}
  .lnav-menu{gap:32px!important}
  .lnav-trigger,.lnav-direct{font-size:13px!important;font-weight:500!important}
  .lnav-actions{gap:10px!important;margin-left:4px!important}
  .lnav-contact{min-height:44px!important;padding:0 22px!important;font-size:13px!important;border-radius:999px!important}
  .lnav-mega{top:88px!important}
  .lnav-mega-inner{width:min(1220px,calc(100% - 128px))!important;gap:68px!important}
}
@media(max-width:1100px) and (min-width:761px){
  .lnav-row,.lnav-mega-inner{width:calc(100% - 48px)!important}
  .lnav-row{height:80px!important;gap:22px!important}
  .lnav-menu{gap:20px!important}
  .lnav-trigger,.lnav-direct{font-size:12px!important}
  .lnav-contact{min-height:40px!important;padding:0 17px!important;font-size:12px!important}
  .lnav-mega{top:80px!important}
}

/* === Shared current content rhythm === */
.jobs26-hero .container,
.jobs26-culture .container,
.jobs26-work .container,
.jobs26-roles .container,
.jobs26-process .container,
.ga26-hero .container,
.ga26-content .container{
  width:min(1220px,calc(100% - 128px))!important;
  max-width:1220px!important;
  margin-inline:auto!important;
}

/* Jobs typography: closer to Industries / current editorial system */
.jobs26-hero{padding-top:154px!important}
.jobs26-hero h1{font-size:clamp(50px,4.6vw,66px)!important;line-height:1.02!important;max-width:760px!important}
.jobs26-lead{font-size:16px!important;line-height:1.68!important;max-width:690px!important}
.jobs26-head h2,.jobs26-work h2,.jobs26-process h2{font-size:clamp(34px,3.35vw,46px)!important;line-height:1.09!important}
.jobs26-head>p{font-size:13px!important;line-height:1.68!important}
.jobs26-culture-grid h3{font-size:18px!important}
.jobs26-culture-grid p{font-size:12px!important}
.jobs26-role-main h3{font-size:27px!important}
.jobs26-role-main p{font-size:12.5px!important}

/* Growth Ambassador uses the same hierarchy */
.ga26-hero{padding-top:154px!important}
.ga26-hero h1{font-size:clamp(50px,4.6vw,66px)!important;line-height:1.02!important}
.ga26-lead{font-size:16px!important;line-height:1.68!important}
.ga26-summary>strong{font-size:38px!important}
.ga26-body h2{font-size:clamp(34px,3.35vw,46px)!important;line-height:1.09!important}
.ga26-body h3{font-size:23px!important}
.ga26-body p{font-size:14px!important;line-height:1.72!important}
.ga26-body li{font-size:13.5px!important}

@media(max-width:1100px){
  .jobs26-hero .container,.jobs26-culture .container,.jobs26-work .container,.jobs26-roles .container,.jobs26-process .container,
  .ga26-hero .container,.ga26-content .container{width:calc(100% - 48px)!important}
}

@media(max-width:760px){
  .jobs26-hero .container,.jobs26-culture .container,.jobs26-work .container,.jobs26-roles .container,.jobs26-process .container,
  .ga26-hero .container,.ga26-content .container{width:calc(100% - 40px)!important}
  .jobs26-hero{padding-top:124px!important}
  .jobs26-hero h1{font-size:35px!important;line-height:1.05!important;max-width:320px!important}
  .jobs26-lead{font-size:14px!important;line-height:1.65!important}
  .jobs26-head h2,.jobs26-work h2,.jobs26-process h2{font-size:28px!important;line-height:1.1!important;max-width:320px!important}
  .jobs26-role-main h3{font-size:23px!important}
  .ga26-hero{padding-top:124px!important}
  .ga26-hero h1{font-size:35px!important;line-height:1.05!important;max-width:320px!important}
  .ga26-lead{font-size:14px!important;line-height:1.65!important}
  .ga26-body h2{font-size:28px!important;line-height:1.1!important}
  .ga26-body h3{font-size:21px!important}
  .ga26-body p{font-size:13.5px!important}
}
</style>
'''

          for p in files:
              s = p.read_text()
              s = re.sub(r'\s*<style id="jobs-system-polish-v2">.*?</style>\s*', '\n', s, flags=re.S)
              s = s.replace('</head>', css + '\n</head>', 1)
              p.write_text(s)
          PY
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recursos/jobs.html recursos/jobs/growth-ambassador.html
          git commit -m "fix: align Jobs with current design system" || exit 0
          git push
