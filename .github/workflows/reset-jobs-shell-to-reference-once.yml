name: Reset Jobs shell to reference once
on: [push]
permissions:
  contents: write
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Jobs-only navbar/footer overrides
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [Path('recursos/jobs.html'), Path('recursos/jobs/growth-ambassador.html')]
          for p in paths:
              s = p.read_text()
              # Remove the Jobs-only navbar/system override we introduced.
              s = re.sub(r'\n?<style id="jobs-system-polish-v2">.*?</style>\n?', '\n', s, flags=re.S)
              # Remove all external footer locks we introduced; base shell remains.
              s = re.sub(r'\n?<link rel="stylesheet" href="https://lowsignal\.cl/assets/jobs-footer-home-lock\.css\?v=\d+">', '', s)
              s = re.sub(r'\n?<link rel="stylesheet" href="https://lowsignal\.cl/assets/jobs-footer-home-final-v2\.css\?v=\d+">', '', s)
              # Keep Jobs-specific FAQ/CTA stylesheet only.
              p.write_text(s)
          PY
      - name: Commit reset and remove workflow
        run: |
          rm -f .github/workflows/reset-jobs-shell-to-reference-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/jobs.html recursos/jobs/growth-ambassador.html .github/workflows/reset-jobs-shell-to-reference-once.yml
          git commit -m 'fix: reset Jobs navbar and footer to shared site shell'
          git push