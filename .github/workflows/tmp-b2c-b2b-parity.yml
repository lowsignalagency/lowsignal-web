name: One-off B2C B2B parity
on:
  push:
    paths:
      - '.github/workflows/tmp-b2c-b2b-parity.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/tmp-b2c-b2b-parity.py
      - run: |
          git config user.name "Felipe Quiroz"
          git config user.email "felipe@lowsignal.cl"
          git add industrias/marcas-b2c.html
          git commit -m "Match B2C to B2B industry system"
          git push
