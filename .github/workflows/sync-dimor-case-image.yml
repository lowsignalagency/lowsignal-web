name: Sync Dimor case image

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_dimor_case_image.py'
      - '.github/workflows/sync-dimor-case-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Replace old Dimor image references
        run: python scripts/sync_dimor_case_image.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Use current Dimor image across site"
          git push
