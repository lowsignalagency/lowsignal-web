name: Update Insiders faces

on:
  push:
    paths:
      - '.github/workflows/update-insiders-faces.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update Insiders page
        run: python .github/scripts/update_insiders_faces.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recursos/insiders.html
          git commit -m "Update Insiders community faces"
          git push
