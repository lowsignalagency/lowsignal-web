name: Bump legal CSS v3
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump CSS cache version
        run: |
          sed -i 's/legal-404-2026-fix.css?v=2/legal-404-2026-fix.css?v=3/g' politica-de-privacidad.html terminos-de-servicio.html 404.html
          sed -i 's/legal-404-2026-fix.css?v=1/legal-404-2026-fix.css?v=3/g' politica-de-privacidad.html terminos-de-servicio.html 404.html
      - name: Remove one-shot workflow
        run: git rm .github/workflows/bump-legal-css-v3-once.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add politica-de-privacidad.html terminos-de-servicio.html 404.html
          git commit -m 'fix: load legal CSS v3'
          git push
