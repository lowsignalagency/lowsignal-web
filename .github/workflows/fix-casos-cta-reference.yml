name: Fix Casos CTA reference

on:
  push:
    paths:
      - '.github/workflows/fix-casos-cta-reference.yml'

permissions:
  contents: write

jobs:
  fix-casos-cta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply CTA reference fix
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python /tmp/fix.py

      - name: Commit changes
        shell: bash
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add casos.html
          git commit -m 'Match Casos CTA to reference' || exit 0
          git push
