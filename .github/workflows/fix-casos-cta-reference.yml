name: Fix Casos CTA reference

on:
  push:
    paths:
      - .github/workflows/fix-casos-cta-reference.yml

permissions:
  contents: write

jobs:
  fix-casos-cta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match final CTA to reference
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          p = Path('casos.html')
          s = p.read_text(encoding='utf-8')

          # Replace final CTA markup with the single-line brand CTA from the reference.
          s = re.sub(
              r'<section class="stories-new-final">[\s\S]*?</section>',
              '''<section class="stories-new-final">
    <div class="container stories-new-final-inner">
      <h2>¿Construimos lo que viene?</h2>
      <a href="https://calendly.com/felipe-lowsignal/30min" target="_blank" rel="noopener noreferrer">Hablemos</a>
    </div>
  </section>''',
              s,
              count=1
          )

          # Remove prior final CTA override and append exact visual treatment last in cascade.
          s = re.sub(r'<style id="casos-final-cta-v2">[\s\S]*?</style>\s*', '', s)
          css = '''
<style id="casos-final-cta-v3">
.stories-new-final{
  position:relative !important;
  overflow:hidden !important;
  padding:72px 0 !important;
  min-height:250px !important;
  display:flex !important;
  align-items:center !important;
  background:linear-gradient(135deg,#171BE8 0%,#274BFF 100%) !important;
}
.stories-new-final:after{display:none !important}
.stories-new-final .container{
  width:min(1220px,calc(100% - 128px)) !important;
  max-width:1220px !important;
  margin:0 auto !important;
}
.stories-new-final-inner{
  display:flex !important;
  align-items:center !important;
  justify-content:space-between !important;
  gap:48px !important;
}
.stories-new-final h2{
  margin:0 !important;
  color:#fff !important;
  font-size:clamp(34px,3.3vw,48px) !important;
  line-height:1.08 !important;
  letter-spacing:-.045em !important;
  font-weight:300 !important;
}
.stories-new-final a{
  flex:none !important;
  min-width:160px !important;
  height:68px !important;
  padding:0 30px !important;
  border-radius:999px !important;
  display:inline-flex !important;
  align-items:center !important;
  justify-content:center !important;
  background:#fff !important;
  color:#101B4F !important;
  font-size:16px !important;
  font-weight:650 !important;
  box-shadow:none !important;
  transition:transform .2s ease,background-color .2s ease !important;
}
.stories-new-final a:hover{
  transform:translateY(-2px) !important;
  background:#F4F6FF !important;
}
@media(max-width:760px){
  .stories-new-final{padding:52px 0 !important;min-height:210px !important}
  .stories-new-final .container{width:calc(100% - 32px) !important}
  .stories-new-final-inner{align-items:flex-start !important;flex-direction:column !important;gap:28px !important}
  .stories-new-final h2{font-size:36px !important}
  .stories-new-final a{min-width:138px !important;height:54px !important;font-size:14px !important}
}
</style>
'''
          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add casos.html
          git commit -m "Match Casos CTA to reference" || exit 0
          git push
