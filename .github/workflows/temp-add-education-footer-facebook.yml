name: Add Education footer Facebook

on:
  push:
    paths:
      - .github/scripts/add_education_footer_facebook.py
      - .github/workflows/temp-add-education-footer-facebook.yml

permissions:
  contents: write

jobs:
  add-facebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Facebook icon
        run: python .github/scripts/add_education_footer_facebook.py
      - name: Commit change
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add industrias/educacion.html
          git commit -m "Add Facebook to Education footer" || exit 0
          git push
