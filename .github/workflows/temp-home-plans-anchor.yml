name: Home plans anchor fix
on:
  push:
    paths:
      - '.github/scripts/fix_home_plans_anchor.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fix_home_plans_anchor.py
      - run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add index.html
          git commit -m "Start Ver planes at Education section" || true
          git push
