name: One-time jobs redesign and Growth Ambassador

on:
  push:
    paths:
      - '.github/workflows/redesign-jobs-growth-ambassador.yml'

permissions:
  contents: write

jobs:
  patch-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Redesign Jobs and create Growth Ambassador role
        shell: python
        run: |
          from pathlib import Path
          import re

          jobs_path = Path('recursos/jobs.html')
          html = jobs_path.read_text(encoding='utf-8')

          new_main = r'''
          <main id="top">
            <section class="jobs26-hero">
              <div class="container jobs26-hero-grid">
                <div class="jobs26-copy">
                  <p class="jobs26-kicker">JOBS · BUILD WHAT'S NEXT</p>
                  <h1>Haz trabajo que<br><strong>mueva cosas.</strong></h1>
                  <p class="jobs26-lead">Somos una Growth Company construida para convertir estrategia en ejecución. Trabajamos entre negocio, contenido, tecnología e IA con una idea simple: menos ruido, más impacto.</p>
                  <div class="jobs26-actions">
                    <a class="jobs26-primary" href="#roles">Ver posiciones abiertas</a>
                    <a class="jobs26-secondary" href="#culture">Conoce nuestra cultura</a>
                  </div>
                </div>

                <aside class="jobs26-manifesto">
                  <span>THE LOW WAY</span>
                  <strong>Think clearly.<br>Move fast.<br>Own the outcome.</strong>
                  <p>Queremos gente que cuestione, construya y se haga cargo.</p>
                </aside>
              </div>
            </section>

            <section class="jobs26-culture" id="culture">
              <div class="container">
                <div class="jobs26-head">
                  <div>
                    <p class="jobs26-eyebrow">CULTURA LOW</p>
                    <h2>No buscamos llenar sillas.<br><strong>Buscamos builders.</strong></h2>
                  </div>
                  <p>La cultura se nota en cómo pensamos, cómo decidimos y cómo hacemos que las cosas pasen.</p>
                </div>

                <div class="jobs26-culture-grid">
                  <article><span>/ 01</span><div><h3>Ownership</h3><p>Te haces cargo del resultado, no solo de la tarea.</p></div></article>
                  <article><span>/ 02</span><div><h3>Claridad</h3><p>Menos vueltas. Problemas claros, decisiones claras.</p></div></article>
                  <article><span>/ 03</span><div><h3>Velocidad</h3><p>Preferimos avanzar, aprender y mejorar rápido.</p></div></article>
                  <article><span>/ 04</span><div><h3>Curiosidad</h3><p>Preguntar mejor es parte del trabajo.</p></div></article>
                  <article class="is-blue"><span>/ 05</span><div><h3>Build what's next.</h3><p>No esperamos el futuro. Lo construimos.</p></div></article>
                </div>
              </div>
            </section>

            <section class="jobs26-work">
              <div class="container jobs26-work-grid">
                <div>
                  <p class="jobs26-eyebrow">CÓMO TRABAJAMOS</p>
                  <h2>Equipos chicos.<br><strong>Impacto grande.</strong></h2>
                </div>
                <div class="jobs26-work-list">
                  <article><span>01</span><div><h3>Problemas reales</h3><p>Trabajamos sobre desafíos concretos de crecimiento y negocio.</p></div></article>
                  <article><span>02</span><div><h3>Cerca del cliente</h3><p>Entender contexto y operación es parte del proceso.</p></div></article>
                  <article><span>03</span><div><h3>Cross-functional</h3><p>Estrategia, creatividad, tecnología y ejecución conviven en el mismo sistema.</p></div></article>
                  <article><span>04</span><div><h3>Aprender haciendo</h3><p>La autonomía viene acompañada de exposición a proyectos y decisiones reales.</p></div></article>
                </div>
              </div>
            </section>

