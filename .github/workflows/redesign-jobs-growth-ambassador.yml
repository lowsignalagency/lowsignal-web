              </div>
            </section>

            <section class="jobs26-process">
              <div class="container">
                <p class="jobs26-eyebrow">EL PROCESO</p>
                <h2>Simple, directo y<br><strong>sin teatro corporativo.</strong></h2>
                <div class="jobs26-process-grid">
                  <article><span>01</span><h3>Postulas</h3><p>Nos cuentas quién eres y por qué te interesa.</p></article>
                  <article><span>02</span><h3>Conversamos</h3><p>Una conversación para conocernos y entender fit.</p></article>
                  <article><span>03</span><h3>Evaluamos</h3><p>Dependiendo del rol, podemos revisar un caso o experiencia concreta.</p></article>
                  <article><span>04</span><h3>Construimos</h3><p>Si hay fit, empezamos a trabajar juntos.</p></article>
                </div>
              </div>
            </section>

            <section class="lsr-band">
              <div class="lsr-wrap lsr-band-inner">
                <p class="lsr-reveal">¿Quieres construir lo que viene?</p>
                <a class="lsr-reveal" href="mailto:contacto@lowsignal.cl?subject=Quiero%20trabajar%20en%20lowsignal">Hablemos</a>
              </div>
            </section>
          </main>
          '''.strip()

          html = re.sub(r'(?s)<main id="top">.*?</main>', new_main, html, count=1)
          html = re.sub(r'<title>.*?</title>', '<title>Jobs | Build what’s next | lowsignal</title>', html, count=1)

          jobs_css = r'''
          <style id="jobs26-redesign-v1">
          .jobs26-hero{padding:170px 0 108px;background:radial-gradient(55% 85% at 100% 0%,rgba(20,25,224,.26),transparent 65%),#071022;color:#fff}
          .jobs26-hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:82px;align-items:center}
