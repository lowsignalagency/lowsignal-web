                  <section><h3>¿Qué harás?</h3><ul><li>Identificar empresas que puedan necesitar nuestros servicios.</li><li>Contactar potenciales clientes por LinkedIn, Instagram, correo u otros canales.</li><li>Generar conversaciones comerciales.</li><li>Detectar interés y coordinar reuniones con nuestro equipo.</li><li>Hacer introducciones o referidos dentro de tu propia red.</li></ul><p>Desde la reunión en adelante, <strong>el equipo de lowsignal se encarga del proceso comercial, propuesta, negociación y cierre.</strong></p></section>

