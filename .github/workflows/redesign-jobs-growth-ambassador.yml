                <div class="jobs26-head jobs26-head-light">
                  <div>
                    <p class="jobs26-eyebrow jobs26-eyebrow-light">POSICIONES ABIERTAS</p>
                    <h2>Encuentra tu lugar<br><strong>en lo que viene.</strong></h2>
                  </div>
                  <p>Hoy tenemos una posición abierta.</p>
                </div>

                <a class="jobs26-role-card" href="https://lowsignal.cl/recursos/jobs/growth-ambassador">
                  <div class="jobs26-role-status"><i></i> OPEN ROLE</div>
                  <div class="jobs26-role-main">
                    <div>
                      <span>SALES · BUSINESS DEVELOPMENT</span>
                      <h3>Growth Ambassador</h3>
                      <p>Para estudiantes o recién egresados con perfil comercial que quieran generar oportunidades y desarrollar experiencia en ventas B2B reales.</p>
                    </div>
                    <div class="jobs26-role-meta">
                      <span>Remoto</span><span>Flexible</span><span>Variable por resultados</span>
                    </div>
                  </div>
                  <div class="jobs26-role-link">Ver rol <b>↗</b></div>
                </a>

                <div class="jobs26-open-note">
                  <p>¿No ves tu rol ideal?</p>
                  <a href="mailto:contacto@lowsignal.cl?subject=Quiero%20trabajar%20en%20lowsignal">Igual queremos conocerte ↗</a>
