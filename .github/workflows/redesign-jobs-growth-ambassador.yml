                  <section><h3>¿A quién buscamos?</h3><ul><li>Estudiantes o recién egresados con interés por ventas, negocios, marketing, startups o growth.</li><li>Personas que se comuniquen bien y disfruten generar relaciones.</li><li>Que se muevan bien en LinkedIn, Instagram y canales digitales.</li><li>Con iniciativa y autonomía.</li><li>Con ganas de desarrollar experiencia comercial trabajando con empresas reales.</li></ul><p><strong>No necesitas experiencia previa en ventas.</strong></p></section>

                  <section><h3>¿Qué puedes ganar?</h3><p>Además de la comisión por nuevos clientes, podrás:</p><ul><li>Aprender cómo funciona un proceso comercial B2B real.</li><li>Trabajar directamente con founders y equipo comercial.</li><li>Conocer empresas de distintas industrias.</li><li>Desarrollar experiencia en prospección, networking y business development.</li><li>Participar opcionalmente en reuniones comerciales para aprender del proceso completo.</li></ul></section>

                  <section><h3>Modalidad</h3><div class="ga26-meta-grid"><article><span>UBICACIÓN</span><b>Remoto</b></article><article><span>HORARIO</span><b>Flexible</b></article><article><span>COMPENSACIÓN</span><b>Variable por resultados</b></article><article><span>IDEAL PARA</span><b>Universidad, práctica o proyectos personales</b></article></div></section>

                  <section><p class="ga26-eyebrow">SOBRE LOWSIGNAL</p><h2>Less noise.<br><strong>More growth.</strong></h2><p>Trabajamos con organizaciones de distintas industrias construyendo sistemas de crecimiento que combinan estrategia, creatividad, tecnología y ejecución.</p></section>
                </div>
              </div>
            </section>

            <section class="lsr-band"><div class="lsr-wrap lsr-band-inner"><p class="lsr-reveal">¿Te interesa el rol?</p><a class="lsr-reveal" href="mailto:contacto@lowsignal.cl?subject=Postulaci%C3%B3n%20Growth%20Ambassador">Postular</a></div></section>
          </main>
          '''.strip()
          role = re.sub(r'(?s)<main id="top">.*?</main>', role_main, role, count=1)

          role_css = r'''
