name: Publish Low Workspace insight

# Trigger publication after workflow already exists on main.
on:
  push:
    paths:
      - '.github/workflows/publish-low-workspace-insight.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Insights and Home
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('recursos/insights.html')
          s = p.read_text(encoding='utf-8')

          old_feature = '''      <a class="insights-new-feature-card" href="https://lowsignal.cl/recursos/insights/lowsignal-se-expande-tres-industrias-un-sistema">
        <div class="insights-new-feature-image">
          <img src="https://lowsignal.cl/assets/founders_new.jpg" alt="Fundadores de lowsignal">
          <span>DESTACADO</span>
        </div>
        <div class="insights-new-feature-copy">
          <div class="insights-new-meta"><b>EXPANSIÓN</b><span>16 oct, 2026</span><span class="insights-meta-author">Felipe Quiroz</span><span>4 min de lectura</span></div>
          <h2>lowsignal se expande: <em>tres industrias, un solo sistema.</em></h2>
          <p>Después de trabajar con instituciones, empresas y marcas, concentramos nuestro crecimiento en Educación, B2B y B2C.</p>
          <div class="insights-new-read">Leer artículo<svg class="insights-arrow-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 15.5L15.5 8.5M15.5 8.5H10.5M15.5 8.5V13.5"/></svg></div>
        </div>
      </a>'''

          new_feature = '''      <a class="insights-new-feature-card" href="https://lowsignal.cl/recursos/insights/low-workspace-operating-system">
        <div class="insights-new-feature-image">
          <img src="https://lowsignal.cl/assets/panel-demo.png" alt="Vista referencial de Low Workspace">
          <span>DESTACADO</span>
        </div>
        <div class="insights-new-feature-copy">
          <div class="insights-new-meta"><b>PRODUCT</b><span>25 oct, 2026</span><span class="insights-meta-author">Felipe Quiroz</span><span>5 min de lectura</span></div>
          <h2>Construimos <em>Low Workspace</em> para operar lowsignal desde un solo lugar.</h2>
          <p>Clientes, pipeline, revenue, finanzas, tareas y equipo estaban repartidos entre demasiadas herramientas. En vez de sumar una más, construimos la nuestra.</p>
          <div class="insights-new-read">Leer artículo<svg class="insights-arrow-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 15.5L15.5 8.5M15.5 8.5H10.5M15.5 8.5V13.5"/></svg></div>
        </div>
      </a>'''

          if old_feature in s:
              s = s.replace(old_feature, new_feature, 1)

          expansion_card = '''        <a class="insights-new-card" href="https://lowsignal.cl/recursos/insights/lowsignal-se-expande-tres-industrias-un-sistema">
          <div class="insights-new-card-image">
            <img src="https://lowsignal.cl/assets/founders_new.jpg" alt="Fundadores de lowsignal">
          </div>
          <div class="insights-new-card-body">
            <div class="insights-new-meta"><b>EXPANSIÓN</b><span>16 oct, 2026</span><span class="insights-meta-author">Felipe Quiroz</span><span>4 min</span></div>
            <h3>lowsignal se expande: tres industrias, un solo sistema</h3>
            <p>Concentramos nuestro crecimiento en Educación, B2B y B2C, con soluciones especializadas para cada industria.</p>
            <div class="insights-new-read">Leer artículo<svg class="insights-arrow-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 15.5L15.5 8.5M15.5 8.5H10.5M15.5 8.5V13.5"/></svg></div>
          </div>
        </a>'''

          sae_anchor = '''        <a class="insights-new-card" href="https://lowsignal.cl/recursos/insights/sae-2027-como-hacer-visible-proyecto-educativo">'''
          if expansion_card not in s and sae_anchor in s:
              pos = s.find(sae_anchor)
              s = s[:pos] + expansion_card + '\n' + s[pos:]

          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_first = '''        <a class="home26-insight-card" href="https://lowsignal.cl/recursos/insights/lowsignal-se-expande-tres-industrias-un-sistema">
          <figure><img src="https://lowsignal.cl/assets/founders_new.jpg" alt="Fundadores de lowsignal" loading="lazy"></figure>
          <div class="home26-insight-meta"><span>EXPANSIÓN</span><b>16 OCT, 2026</b></div>
          <h3>lowsignal se expande: tres industrias, un solo sistema</h3>
          <p>Concentramos nuestro crecimiento en Educación, B2B y B2C, con soluciones especializadas para cada industria.</p>
          <strong>Leer insight →</strong>
        </a>'''
          new_first = '''        <a class="home26-insight-card" href="https://lowsignal.cl/recursos/insights/low-workspace-operating-system">
          <figure><img src="https://lowsignal.cl/assets/panel-demo.png" alt="Vista referencial de Low Workspace" loading="lazy"></figure>
          <div class="home26-insight-meta"><span>PRODUCT</span><b>25 OCT, 2026</b></div>
          <h3>Construimos Low Workspace para operar lowsignal desde un solo lugar</h3>
          <p>De herramientas desconectadas a una plataforma interna para clientes, pipeline, revenue, finanzas, tareas y equipo.</p>
          <strong>Leer insight →</strong>
        </a>'''
          if old_first in s:
              s = s.replace(old_first, new_first, 1)

          old_third = '''        <a class="home26-insight-card" href="https://lowsignal.cl/recursos/insights/platanus-ai-native-startups-4">
          <figure><img src="https://lowsignal.cl/assets/platanus-ai-native-startups-4.jpg" alt="Platanus AI Native Startups #4 en Santiago" loading="lazy"></figure>
          <div class="home26-insight-meta"><span>EVENTO</span><b>1 OCT, 2026</b></div>
          <h3>Platanus AI Native Startups #4</h3>
          <p>Founders de Fintoc, Fintual y Osiris Experience comparten cómo están replanteando sus empresas alrededor de los LLMs.</p>
          <strong>Leer insight →</strong>
        </a>'''
          new_third = '''        <a class="home26-insight-card" href="https://lowsignal.cl/recursos/insights/lowsignal-se-expande-tres-industrias-un-sistema">
          <figure><img src="https://lowsignal.cl/assets/founders_new.jpg" alt="Fundadores de lowsignal" loading="lazy"></figure>
          <div class="home26-insight-meta"><span>EXPANSIÓN</span><b>16 OCT, 2026</b></div>
          <h3>lowsignal se expande: tres industrias, un solo sistema</h3>
          <p>Concentramos nuestro crecimiento en Educación, B2B y B2C, con soluciones especializadas para cada industria.</p>
          <strong>Leer insight →</strong>
        </a>'''
          if old_third in s:
              s = s.replace(old_third, new_third, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recursos/insights.html index.html
          git commit -m "Feature Low Workspace on Home and Insights"
          git push
