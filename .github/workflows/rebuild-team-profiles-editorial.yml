name: Rebuild team profiles editorial
on:
  push:
    paths:
      - '.github/workflows/rebuild-team-profiles-editorial.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/rebuild_team_profiles_editorial.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add equipo/damian-aldunate.html equipo/jorge-munoz.html equipo/lia-morice.html equipo/marco-kroeger.html equipo/martin-alvarado.html equipo/matias-bussinger.html
          git diff --cached --quiet || git commit -m 'Rebuild team profiles in editorial structure'
          git push
# retry current tp-profile structure
