name: Add new Home client logos

on:
  push:
    paths:
      - .github/scripts/add_new_client_logos.py
      - .github/workflows/temp-add-new-client-logos.yml

permissions:
  contents: write

jobs:
  add-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image dependencies
        run: pip install pillow pillow-avif-plugin
      - name: Build white transparent logos and update Home
        run: python .github/scripts/add_new_client_logos.py
      - name: Commit changes
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add index.html assets/ryuki-white.png assets/vandalo-white.png assets/seremonta-white.png
          git commit -m "Add Ryuki Vandalo and Se Remonta client logos" || exit 0
          git push
