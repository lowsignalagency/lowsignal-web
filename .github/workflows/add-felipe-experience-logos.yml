name: Add Felipe experience logos

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_felipe_experience_logos.py'
      - '.github/workflows/add-felipe-experience-logos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add Felipe experience logos
        run: python scripts/add_felipe_experience_logos.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add equipo/felipe-quiroz.html
          git diff --cached --quiet && exit 0
          git commit -m "Add logos to Felipe experience"
          git push
# trigger felipe experience logos
