name: Apply editorial case layout

on:
  push:
    paths:
      - 'scripts/apply_editorial_case_layout.py'
      - 'scripts/apply_editorial_case_layout_v2.py'
      - '.github/workflows/apply-editorial-case-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply editorial layout
        run: python scripts/apply_editorial_case_layout_v2.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add casos/rech.html casos/salvador-dali.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Apply editorial layout to customer stories"
            git push
          fi
