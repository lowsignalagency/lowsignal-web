name: B2C pricing enhancer v2
on:
  push:
    paths:
      - '.github/workflows/bump-b2c-pricing-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump B2C enhancer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('industrias/marcas-b2c.html')
          s=p.read_text()
          old='https://lowsignal.cl/assets/b2c-pricing-enhance.js?v=1'
          new='https://lowsignal.cl/assets/b2c-pricing-enhance.js?v=2'
          if old not in s:
              raise SystemExit('Expected B2C v1 reference not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add industrias/marcas-b2c.html
          git commit -m "Bump B2C pricing enhancer to v2"
          git push
