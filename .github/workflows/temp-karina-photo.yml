name: Temporary Karina photo
on:
  push:
    paths:
      - '.github/scripts/add_karina_photo.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply update
        run: python3 .github/scripts/add_karina_photo.py
      - name: Save update
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add index.html
          git commit -m "Add Karina photo" || exit 0
          git push
