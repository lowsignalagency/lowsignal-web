name: Enable Education pricing enhancements
on:
  push:
    paths:
      - '.github/workflows/enable-education-pricing.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Education pricing enhancer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('industrias/educacion.html')
          s = p.read_text()
          tag = '<script src="https://lowsignal.cl/assets/education-pricing-enhance.js?v=1"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add industrias/educacion.html
          git diff --cached --quiet || git commit -m "Enable Education pricing enhancements"
          git push
