name: Fix San Jorge logo on home

# Triggered after workflow exists on main so the push event runs it.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-san-jorge-home.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-san-jorge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize San Jorge logo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Give every San Jorge item its own stable class.
          s = re.sub(
              r'<div class="lsr-trust-logo(?:\s+lsr-trust-wide)?">\s*<img([^>]*csjo-white-trim\.png[^>]*)>\s*</div>',
              r'<div class="lsr-trust-logo lsr-logo-san-jorge"><img\1></div>',
              s,
              flags=re.I
          )

          # Remove older San Jorge-specific patches if present.
          s = re.sub(r'\s*<style id="home-san-jorge-[^"]+">.*?</style>', '', s, flags=re.S|re.I)

          fix = '''
<style id="home-san-jorge-final-v16">
.lsr-trust-logo.lsr-logo-san-jorge{
  width:132px !important;
  height:58px !important;
  min-width:132px !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  overflow:visible !important;
}
.lsr-trust-logo.lsr-logo-san-jorge img{
  width:auto !important;
  height:auto !important;
  max-width:112px !important;
  max-height:42px !important;
  object-fit:contain !important;
  transform:none !important;
  filter:brightness(0) invert(1) !important;
  opacity:.88 !important;
}
@media(max-width:760px){
  .lsr-trust-logo.lsr-logo-san-jorge{
    width:116px !important;
    min-width:116px !important;
    height:52px !important;
  }
  .lsr-trust-logo.lsr-logo-san-jorge img{
    max-width:98px !important;
    max-height:36px !important;
  }
}
</style>
'''
          s = s.replace('</head>', fix + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit home fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Normalize San Jorge logo on home"
          git push
