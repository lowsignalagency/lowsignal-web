name: Simplify Felipe profile

on:
  push:
    paths:
      - '.github/workflows/simplify-felipe-profile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Simplify Felipe profile
        run: python .github/scripts/simplify_felipe_profile.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add equipo/felipe-quiroz.html
          git commit -m "Simplify Felipe team profile"
          git push
