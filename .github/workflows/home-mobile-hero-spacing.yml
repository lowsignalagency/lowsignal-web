name: One-time home mobile hero spacing

on:
  push:
    paths:
      - '.github/workflows/home-mobile-hero-spacing.yml'

permissions:
  contents: write

jobs:
  patch-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add a little more breathing room below mobile navbar
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          block = '''
          <style id="home-mobile-hero-spacing-v1">
          @media(max-width:620px){
            .home26-copy{
              padding-top:32px !important;
            }
          }
          </style>
          '''.strip()

          text = re.sub(r'\s*<style id="home-mobile-hero-spacing-v1">.*?</style>\s*', '\n', text, flags=re.S)
          text = text.replace('</head>', block + '\n</head>', 1)
          path.write_text(text, encoding='utf-8')

          wf = Path('.github/workflows/home-mobile-hero-spacing.yml')
          if wf.exists():
            wf.unlink()

      - name: Commit home mobile spacing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: add breathing room below mobile navbar on home"
          git push origin main
