name: Bump Education enhancer v3
on:
  push:
    paths:
      - '.github/workflows/bump-education-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump Education enhancer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('industrias/educacion.html')
          s=p.read_text()
          old='https://lowsignal.cl/assets/education-pricing-enhance.js?v=2'
          new='https://lowsignal.cl/assets/education-pricing-enhance.js?v=3'
          if old not in s:
              raise SystemExit('Expected Education v2 reference not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add industrias/educacion.html
          git commit -m "Bump Education enhancer to v3"
          git push
