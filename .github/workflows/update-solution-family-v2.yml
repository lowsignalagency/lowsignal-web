name: Update solution family v2
on:
  push:
    paths:
      - '.github/workflows/update-solution-family-v2.yml'
      - '.github/scripts/update_solution_family_v2.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh solution pages
        run: python .github/scripts/update_solution_family_v2.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soluciones/low-ads.html soluciones/low-web.html soluciones/low-flow.html soluciones/low-apps.html soluciones/low-scale.html
          git diff --cached --quiet || git commit -m "Refresh solution family structure and copy"
          git push
