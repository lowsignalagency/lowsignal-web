name: Apply Insights v6
on:
  push:
    paths:
      - .github/workflows/apply-insights-v6.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Insights
        env:
          CSS_B64: 
        run: python -c "import os,base64,re,pathlib; p=pathlib.Path('recursos/insights.html'); s=p.read_text(); css=base64.b64decode(os.environ['CSS_B64']).decode(); s=re.sub(r'\n?<style id=\"insights-axis-color-v6\">.*?</style>\n?','\n',s,flags=re.S); p.write_text(s.replace('</body>',css+'\n</body>',1))"
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recursos/insights.html
          git commit -m "fix: align Insights axis and simplify hero color"
          git push
