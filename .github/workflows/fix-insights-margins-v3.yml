name: Fix Insights margins v3
on:
  push:
    paths:
      - '.github/workflows/fix-insights-margins-v3.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Align Insights margins to Nosotros
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64
          index=Path('recursos/insights.html')
          articles=[Path('recursos/insights/100-ideas-puestas-en-marcha.html'),Path('recursos/insights/6-meses-construyendo-lowsignal.html'),Path('recursos/insights/ai-native-startups-platanus.html'),Path('recursos/insights/platanus-ai-native-startups-4.html'),Path('recursos/insights/tech-founders-ama.html')]
          index_css=base64.b64decode('').decode()
          article_css=base64.b64decode('').decode()
          def put(path,block_id,css):
              s=path.read_text()
              s=re.sub(r'\n?<style id="'+re.escape(block_id)+r'">.*?</style>\n?','\n',s,flags=re.S)
              s=s.replace('</head>',css+'\n</head>',1)
              path.write_text(s)
          put(index,'insights-margin-system-v3',index_css)
          for p in articles: put(p,'insight-article-margin-system-v3',article_css)
          PY
      - name: Verify
        run: |
          grep -q 'insights-margin-system-v3' recursos/insights.html
          for f in recursos/insights/*.html; do
            [ "$(basename "$f")" = "..." ] && continue
            grep -q 'insight-article-margin-system-v3' "$f"
          done
      - name: Remove workflow
        run: rm .github/workflows/fix-insights-margins-v3.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/insights.html recursos/insights .github/workflows/fix-insights-margins-v3.yml
          git commit -m 'fix: align Insights margins to refreshed Nosotros grid'
          git push
