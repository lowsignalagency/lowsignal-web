name: Fix Insights margins v3
on:
  push:
    paths:
      - '.github/workflows/fix-insights-margins-v3.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Align Insights margins to Nosotros
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('recursos/insights.html')
          articles = [
              Path('recursos/insights/100-ideas-puestas-en-marcha.html'),
              Path('recursos/insights/6-meses-construyendo-lowsignal.html'),
              Path('recursos/insights/ai-native-startups-platanus.html'),
              Path('recursos/insights/platanus-ai-native-startups-4.html'),
              Path('recursos/insights/tech-founders-ama.html'),
          ]

          index_css = '''<style id="insights-margin-system-v3">
:root{--insights-content:1480px}
.insights-new-hero .container,
.insights-new-featured .container,
.insights-new-grid-section .container,
.insights-new-themes .container,
.insights-new-final .container{
  width:min(var(--insights-content),calc(100% - 160px)) !important;
  max-width:var(--insights-content) !important;
  margin-left:auto !important;
  margin-right:auto !important;
}
@media(max-width:1440px){
  .insights-new-hero .container,
  .insights-new-featured .container,
  .insights-new-grid-section .container,
  .insights-new-themes .container,
  .insights-new-final .container{width:calc(100% - 96px) !important}
}
@media(max-width:1100px){
  .insights-new-hero .container,
  .insights-new-featured .container,
  .insights-new-grid-section .container,
  .insights-new-themes .container,
  .insights-new-final .container{width:calc(100% - 48px) !important}
}
@media(max-width:760px){
  .insights-new-hero .container,
  .insights-new-featured .container,
  .insights-new-grid-section .container,
  .insights-new-themes .container,
  .insights-new-final .container{width:calc(100% - 32px) !important}
}
</style>'''

          article_css = '''<style id="insight-article-margin-system-v3">
:root{--insights-content:1480px}
.article-new-hero .container,
.article-new-body .container,
.article-new-more .container{
  width:min(var(--insights-content),calc(100% - 160px)) !important;
  max-width:var(--insights-content) !important;
  margin-left:auto !important;
  margin-right:auto !important;
}
@media(max-width:1440px){
  .article-new-hero .container,
  .article-new-body .container,
  .article-new-more .container{width:calc(100% - 96px) !important}
}
@media(max-width:1100px){
  .article-new-hero .container,
  .article-new-body .container,
  .article-new-more .container{width:calc(100% - 48px) !important}
}
@media(max-width:760px){
  .article-new-hero .container,
  .article-new-body .container,
  .article-new-more .container{width:calc(100% - 32px) !important}
}
</style>'''

          def put(path, block_id, css):
              s = path.read_text()
              s = re.sub(r'\n?<style id="'+re.escape(block_id)+r'">.*?</style>\n?', '\n', s, flags=re.S)
              if '</head>' not in s:
                  raise SystemExit(f'No head close in {path}')
              s = s.replace('</head>', css+'\n</head>', 1)
              path.write_text(s)

          put(index, 'insights-margin-system-v3', index_css)
          for p in articles:
              put(p, 'insight-article-margin-system-v3', article_css)
          PY
      - name: Verify
        run: |
          grep -q 'insights-margin-system-v3' recursos/insights.html
          grep -q -- '--insights-content:1480px' recursos/insights.html
          for f in recursos/insights/*.html; do
            [ "$(basename "$f")" = "..." ] && continue
            grep -q 'insight-article-margin-system-v3' "$f"
          done
      - name: Remove workflow
        run: rm .github/workflows/fix-insights-margins-v3.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/insights.html recursos/insights .github/workflows/fix-insights-margins-v3.yml
          git commit -m 'fix: align Insights margins to refreshed Nosotros grid'
          git push
