name: Enlarge Insights arrow visual
on:
  push:
    paths:
      - '.github/workflows/enlarge-insights-arrow-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enlarge arrow visual
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('recursos/insights.html')
          s=p.read_text()
          s=s.replace('M8.5 15.5L15.5 8.5M15.5 8.5H10.5M15.5 8.5V13.5','M6.5 17.5L17.5 6.5M17.5 6.5H10.5M17.5 6.5V13.5')
          s=s.replace('width:18px!important;\n  height:18px!important;','width:21px!important;\n  height:21px!important;')
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'M6.5 17.5L17.5 6.5' recursos/insights.html
          grep -q 'width:21px!important' recursos/insights.html
      - name: Remove workflow
        run: rm .github/workflows/enlarge-insights-arrow-v2.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/insights.html .github/workflows/enlarge-insights-arrow-v2.yml
          git commit -m 'fix: enlarge Insights arrow visual'
          git push