name: Enlarge Insights arrow visual
on:
  push:
    paths:
      - '.github/workflows/enlarge-insights-arrow-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enlarge arrow visual
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('recursos/insights.html')
          s=p.read_text()
          marker='<style id="insights-arrow-scale-final">'
          if marker in s:
              start=s.index(marker)
              end=s.index('</style>',start)+len('</style>')
              s=s[:start]+s[end:]
          css='''<style id="insights-arrow-scale-final">\n.insights-new-card .insights-new-read .insights-arrow-svg{\n  width:20px!important;\n  height:20px!important;\n  transform:translate(calc(-50% - 1px),calc(-50% + 1px)) scale(1.45)!important;\n  transform-origin:center!important;\n}\n</style>'''
          s=s.replace('</body>',css+'\n</body>',1)
          p.write_text(s)
          PY
      - name: Verify
        run: grep -q 'insights-arrow-scale-final' recursos/insights.html
      - name: Remove workflow
        run: rm .github/workflows/enlarge-insights-arrow-v2.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/insights.html .github/workflows/enlarge-insights-arrow-v2.yml
          git commit -m 'fix: visibly enlarge Insights arrows'
          git push