name: Update Education Growth plan

on:
  push:
    branches:
      - education-pricing-v1
    paths:
      - .github/workflows/update-education-growth.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: education-pricing-v1

      - name: Update Growth scope
        shell: python
        run: |
          from pathlib import Path
          path = Path('industrias/educacion.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '<li>Hasta 12 stories mensuales</li>': '<li>Hasta 8 stories mensuales</li>',
              '<li>Gestión y optimización de Low Ads</li>': '<li>Gestión y optimización de Ads</li>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected text: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add industrias/educacion.html
          git commit -m "Adjust Education Growth scope" || exit 0
          git push origin HEAD:education-pricing-v1
