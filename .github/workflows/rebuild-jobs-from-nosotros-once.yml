name: Rebuild Jobs from Nosotros once

on:
  push:
    paths:
      - '.github/workflows/rebuild-jobs-from-nosotros-once.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild Jobs pages from exact Nosotros shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          template = Path('nosotros.html').read_text(encoding='utf-8')

          def extract_first(pattern, text, label):
              m = re.search(pattern, text, re.S | re.I)
              if not m:
                  raise RuntimeError(f'Missing {label}')
              return m.group(0)

          def matching_brace(text, open_idx):
              depth = 0
              i = open_idx
              in_str = None
              esc = False
              in_comment = False
              while i < len(text):
                  if in_comment:
                      if text.startswith('*/', i):
                          in_comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if not in_str and text.startswith('/*', i):
                      in_comment = True
                      i += 2
                      continue
                  c = text[i]
                  if in_str:
                      if esc:
                          esc = False
                      elif c == '\\':
                          esc = True
                      elif c == in_str:
                          in_str = None
                      i += 1
                      continue
                  if c in ('"', "'"):
                      in_str = c
                  elif c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise RuntimeError('Unbalanced CSS braces')

          def filter_css(css, needles):
              out = []
              i = 0
              n = len(css)
              while i < n:
                  if css.startswith('/*', i):
                      j = css.find('*/', i + 2)
                      if j == -1:
                          break
                      i = j + 2
                      continue
                  if css[i].isspace():
                      i += 1
                      continue
                  brace = css.find('{', i)
                  semi = css.find(';', i)
                  if brace == -1:
                      break
                  if semi != -1 and semi < brace:
                      i = semi + 1
                      continue
                  prelude = css[i:brace].strip()
                  end = matching_brace(css, brace)
                  body = css[brace+1:end]
                  low = prelude.lower()
                  if low.startswith('@media') or low.startswith('@supports') or low.startswith('@layer'):
                      inner = filter_css(body, needles)
                      if inner.strip():
                          out.append(f'{prelude}{{\n{inner}\n}}')
                  elif any(x in prelude for x in needles):
                      out.append(f'{prelude}{{{body}}}')
                  i = end + 1
              return '\n'.join(out)

          tmpl_main = re.search(r'<main\b.*?</main>', template, re.S | re.I)
          if not tmpl_main:
              raise RuntimeError('Nosotros main not found')

          tmpl_header = extract_first(r'<header class="lnav"[^>]*>.*?</header>', template, 'Nosotros desktop navbar')
          tmpl_footer = extract_first(r'<footer[^>]*>.*?</footer>', template, 'Nosotros footer')

          targets = [
              ('recursos/jobs.html', ('jobs26',), 'Jobs | Build what’s next | lowsignal', True),
              ('recursos/jobs/growth-ambassador.html', ('ga26',), 'Growth Ambassador | Jobs | lowsignal', False),
          ]

          for path_str, needles, title, add_jobs_fix in targets:
              path = Path(path_str)
              old = path.read_text(encoding='utf-8')
              main = extract_first(r'<main\b.*?</main>', old, f'{path_str} main')

              css_parts = []
              old_head = old.split('</head>', 1)[0]
              for sm in re.finditer(r'<style[^>]*>(.*?)</style>', old_head, re.S | re.I):
                  filtered = filter_css(sm.group(1), needles)
                  if filtered.strip():
                      css_parts.append(filtered)
              page_css = '\n'.join(css_parts)

              rebuilt = template
              rebuilt = re.sub(r'<title>.*?</title>', f'<title>{title}</title>', rebuilt, count=1, flags=re.S | re.I)
              rebuilt = rebuilt[:tmpl_main.start()] + main + rebuilt[tmpl_main.end():]

              extra = '\n<style id="jobs-clean-page-styles">\n' + page_css + '\n</style>\n'
              if add_jobs_fix:
                  extra += '<link rel="stylesheet" href="https://lowsignal.cl/assets/jobs-page-fixes.css?v=10">\n'
              rebuilt = rebuilt.replace('</head>', extra + '</head>', 1)

              assert rebuilt.count('<head>') == 1 and rebuilt.count('</head>') == 1
              assert rebuilt.count('<body>') == 1 and rebuilt.count('</body>') == 1
              assert len(re.findall(r'<main\b', rebuilt, re.I)) == 1
              assert len(re.findall(r'<footer\b', rebuilt, re.I)) == 1

              out_header = extract_first(r'<header class="lnav"[^>]*>.*?</header>', rebuilt, f'{path_str} desktop navbar')
              out_footer = extract_first(r'<footer[^>]*>.*?</footer>', rebuilt, f'{path_str} footer')
              assert out_header == tmpl_header, f'{path_str}: navbar differs from Nosotros'
              assert out_footer == tmpl_footer, f'{path_str}: footer differs from Nosotros'

              forbidden = ['.lnav', '.nav-wrap', '.nav-', 'footer', '.footer', '.mobile-nav']
              lowered = page_css.lower()
              for token in forbidden:
                  assert token not in lowered, f'{path_str}: page CSS leaked shell selector {token}'

              path.write_text(rebuilt, encoding='utf-8')
              print(f'{path_str}: rebuilt cleanly; navbar/footer exact from Nosotros; page CSS chars={len(page_css)}')
          PY
      - name: Commit clean rebuild and remove workflow
        run: |
          rm .github/workflows/rebuild-jobs-from-nosotros-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recursos/jobs.html recursos/jobs/growth-ambassador.html .github/workflows/rebuild-jobs-from-nosotros-once.yml
          git commit -m "fix: rebuild Jobs on exact Nosotros shell"
          git push
