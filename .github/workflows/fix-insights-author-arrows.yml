name: Fix Insights author and arrows
on:
  push:
    paths:
      - .github/workflows/fix-insights-author-arrows.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Insights index
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Verify
        run: grep -q 'insights-byline-arrow-fix-v1' recursos/insights.html
      - name: Remove workflow
        run: rm .github/workflows/fix-insights-author-arrows.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/insights.html .github/workflows/fix-insights-author-arrows.yml
          git commit -m 'fix: simplify Insights bylines and redraw card arrows'
          git push