name: Fix B2C plans anchor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-b2c-plans-anchor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-plans-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point B2C plan buttons to local pricing section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('industrias/marcas-b2c.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href="https://lowsignal.cl/#planes">Ver planes</a>', 'href="#planes-b2c">Ver planes</a>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add industrias/marcas-b2c.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix B2C Ver planes anchor"
          git push
