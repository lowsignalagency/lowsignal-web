name: One-off B2C consistency fix

on:
  push:
    paths:
      - '.github/workflows/tmp-b2c-consistency.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply B2C consistency fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('industrias/marcas-b2c.html')
          s=p.read_text()
          marker='b2c-consistency-final-v1'
          css=r'''<style id="b2c-consistency-final-v1">
/* Final consistency layer: match B2B / Education system */
.b2cr-main{color:#10193C!important;background:#fff!important}
.b2cr-shell,.b2cr-cta-inner{width:min(1220px,calc(100% - 128px))!important;max-width:1220px!important;margin-left:auto!important;margin-right:auto!important}
.b2cr-eyebrow{color:#536BFF!important;font-size:10px!important;font-weight:700!important;letter-spacing:.18em!important;text-transform:uppercase!important}
.b2cr-head h2,.b2cr-outcomes h2,.b2cr-why h2,.b2cr-segments h2,.b2cr-testimonials h2,.b2cr-pricing h2{font-size:clamp(36px,3.8vw,54px)!important;line-height:1.08!important;letter-spacing:-.045em!important;font-weight:300!important}
.b2cr-head h2 strong,.b2cr-outcomes h2 strong,.b2cr-segments h2 strong,.b2cr-pricing h2 strong{color:#1419E0!important;font-weight:300!important}

/* Hero */
.b2cr-hero{padding:154px 0 68px!important;background:radial-gradient(56% 120% at 100% 0%,rgba(36,71,245,.28),transparent 64%),linear-gradient(180deg,#071022 0%,#091128 100%)!important;color:#fff!important}
.b2cr-hero .b2cr-eyebrow{color:#8EA3FF!important}
.b2cr-hero h1{color:#fff!important;max-width:1060px!important;font-size:clamp(52px,5.2vw,74px)!important;line-height:1.01!important;letter-spacing:-.058em!important;font-weight:300!important}
.b2cr-hero h1 strong{color:#A8B8FF!important;font-weight:300!important}
.b2cr-hero-copy>p:not(.b2cr-eyebrow){color:#A0ABC7!important;font-size:17px!important;line-height:1.72!important}
.b2cr-btn.primary{background:#fff!important;color:#17235D!important}.b2cr-btn.primary:hover{background:#F4F6FF!important;box-shadow:0 10px 24px rgba(0,0,0,.16)!important}
.b2cr-btn.secondary{border:1px solid rgba(255,255,255,.22)!important;color:#fff!important;background:transparent!important}.b2cr-btn.secondary:hover{background:rgba(255,255,255,.07)!important;border-color:rgba(255,255,255,.38)!important}

/* Trust strip */
.b2cr-trust{padding:28px 0 32px!important;background:#071022!important;border-top:1px solid rgba(138,164,255,.12)!important}
.b2cr-trust-label{color:#697897!important;font-size:9px!important;font-weight:700!important;letter-spacing:.16em!important}
.b2cr-trust-grid{justify-content:flex-start!important;gap:clamp(34px,4vw,64px)!important;margin-top:20px!important}
.b2cr-trust-grid img{max-width:122px!important;max-height:44px!important;opacity:.88!important;filter:none!important;transition:transform .2s ease,opacity .2s ease!important}
.b2cr-trust-grid img:hover{opacity:1!important;transform:translateY(-2px)!important}

/* Light sections */
.b2cr-journey{padding:96px 0 104px!important;background:#F4F6FC!important}
.b2cr-head>p,.b2cr-outcomes-head>p:last-child,.b2cr-segments-head>p:last-child,.b2cr-testimonial-head>p,.b2cr-pricing-head>p{color:#6F7C9D!important;font-size:15px!important;line-height:1.75!important}
.b2cr-journey-grid{gap:14px!important;margin-top:50px!important}
.b2cr-journey-grid article{min-height:235px!important;padding:24px!important;border:1px solid #DCE3F2!important;border-radius:16px!important;background:#fff!important;transition:.22s ease!important}
.b2cr-journey-grid article:hover{transform:translateY(-4px)!important;border-color:#C9D4F1!important;box-shadow:0 18px 40px rgba(20,25,224,.07)!important}
.b2cr-journey-grid h3{color:#10193C!important}.b2cr-journey-grid p{color:#7A86A7!important}

.b2cr-outcomes{padding:102px 0 110px!important;background:#fff!important}
.b2cr-outcome{min-height:260px!important;padding:30px!important;border:1px solid #DCE3F2!important;border-radius:18px!important;background:#fff!important;color:#10193C!important}
.b2cr-outcome:hover{transform:translateY(-4px)!important;border-color:#BFCDF0!important;box-shadow:0 18px 42px rgba(20,25,224,.08)!important}
.b2cr-outcome small{color:#5365D9!important}.b2cr-outcome h3{color:#10193C!important}.b2cr-outcome p{color:#75809E!important}.b2cr-outcome span{color:#1419E0!important}

/* Dark why section — force readable contrast */
.b2cr-why{padding:104px 0 110px!important;background:#070F22!important;color:#fff!important}
.b2cr-why .b2cr-eyebrow{color:#8EA3FF!important}
.b2cr-why h2{color:#fff!important}.b2cr-why h2 strong{color:#A8B8FF!important;font-weight:300!important}
.b2cr-why-head>p:last-child{color:#8F9BBA!important}
.b2cr-why-grid article{color:#fff!important}
.b2cr-why-grid i{background:rgba(138,164,255,.10)!important;color:#8AA4FF!important}
.b2cr-why-grid h3{color:#fff!important}.b2cr-why-grid p{color:#9AA6C3!important}
.b2cr-why-grid article+article{border-left:1px solid rgba(138,164,255,.16)!important}

/* Segments */
.b2cr-segments{padding:104px 0 112px!important;background:#fff!important}
.b2cr-segments-grid{border-top:1px solid #DCE3F2!important}
.b2cr-segments-grid article{border-bottom:1px solid #DCE3F2!important;background:#fff!important}
.b2cr-segments-grid article:nth-child(even){border-left:1px solid #DCE3F2!important}
.b2cr-segments-grid h3{color:#10193C!important}.b2cr-segments-grid p{color:#74809C!important}

/* Testimonials */
.b2cr-testimonials{padding:94px 0 102px!important;background:#EEF3FF!important}
.b2cr-testimonials .b2cr-eyebrow{color:#536BFF!important}.b2cr-testimonials h2{color:#10193C!important}.b2cr-testimonials h2 strong{color:#1419E0!important;font-weight:300!important}
.b2cr-stage{min-height:540px!important;border-radius:22px!important;background:#071022!important}
.b2cr-slide{background-position:center center!important}
.b2cr-panel{background:rgba(5,10,24,.92)!important;color:#fff!important}
.b2cr-panel blockquote{color:#fff!important}
.b2cr-person b{color:#fff!important}.b2cr-person span{color:#A7B1CB!important}.b2cr-person a{color:#A8B8FF!important}
.b2cr-controls button{border-color:rgba(255,255,255,.28)!important;background:rgba(5,10,24,.38)!important;color:#fff!important;transition:.2s ease!important}.b2cr-controls button:hover{background:rgba(255,255,255,.14)!important;transform:translateY(-2px)!important}

/* Pricing */
.b2cr-pricing{padding:104px 0 112px!important;background:#fff!important}
.b2cr-plan{background:#fff!important;color:#10193C!important;border:1px solid #DCE3F2!important}
.b2cr-plan.featured{background:#071022!important;border-color:#071022!important;color:#fff!important}
.b2cr-plan h3{color:#10193C!important}.b2cr-plan.featured h3{color:#fff!important}
.b2cr-plan .d{color:#7A86A7!important}.b2cr-plan.featured .d{color:#95A2C3!important}
.b2cr-plan li{color:#596689!important}.b2cr-plan.featured li{color:#D5DCF3!important}
.b2cr-plan .price{border-bottom:1px solid #E2E7F2!important}.b2cr-plan.featured .price{border-bottom-color:rgba(255,255,255,.14)!important}
.b2cr-plan .price strong{color:#1419E0!important}.b2cr-plan.featured .price strong{color:#A8B8FF!important}
.b2cr-plan>a{color:#1419E0!important}.b2cr-plan.featured>a{color:#A8B8FF!important}
.b2cr-custom{background:#fff!important;border:1px solid #DCE3F2!important}.b2cr-custom h3{color:#10193C!important}.b2cr-custom p{color:#7A86A7!important}

/* FAQ + CTA */
.b2cr-faq{padding:78px 0 84px!important;background:#EEF3FF!important;color:#10193C!important}
.b2cr-faq h2{color:#10193C!important}.b2cr-faq-grid>div:first-child>p:last-child{color:#65738F!important}
.b2cr-faq-list{border-top:1px solid #D4DDF0!important}.b2cr-faq-list details{border-bottom:1px solid #D4DDF0!important}.b2cr-faq-list summary{color:#10193C!important}.b2cr-faq-list details>p{color:#667085!important}
.b2cr-cta{background:linear-gradient(105deg,#1419E0,#2447F5)!important;color:#fff!important}.b2cr-cta p{color:#fff!important}.b2cr-cta a{background:#fff!important;color:#17235D!important}.b2cr-cta a:hover{background:#F4F6FF!important;transform:translateY(-2px)!important}

/* Exact mobile rhythm/nav parity */
@media(max-width:1100px){.b2cr-shell,.b2cr-cta-inner{width:calc(100% - 48px)!important}}
@media(max-width:760px){
  .b2cr-shell,.b2cr-cta-inner{width:calc(100% - 40px)!important}
  .b2cr-hero{padding:124px 0 54px!important}.b2cr-hero h1{font-size:42px!important}.b2cr-hero-copy>p:not(.b2cr-eyebrow){font-size:15px!important}
  .b2cr-journey,.b2cr-outcomes,.b2cr-why,.b2cr-segments,.b2cr-testimonials,.b2cr-pricing{padding:74px 0!important}
  .b2cr-head,.b2cr-testimonial-head,.b2cr-pricing-head{grid-template-columns:1fr!important;gap:28px!important}
  .b2cr-journey-grid,.b2cr-outcomes-grid,.b2cr-why-grid,.b2cr-segments-grid{grid-template-columns:1fr!important}
  .b2cr-why-head,.b2cr-segments-head{text-align:left!important}
  .b2cr-why-grid article,.b2cr-why-grid article+article{padding:24px 0!important;border-left:0!important;border-top:1px solid rgba(138,164,255,.12)!important}
  .b2cr-why-grid article:first-child{border-top:0!important}
  .b2cr-segments-grid article,.b2cr-segments-grid article:nth-child(even){padding:25px 0!important;border-left:0!important}
  .b2cr-stage{min-height:540px!important;border-radius:18px!important}
  .b2cr-panel{left:16px!important;right:16px!important;bottom:16px!important;top:auto!important;transform:none!important;width:auto!important;min-height:0!important;padding:24px!important}
  .b2cr-panel blockquote{font-size:15px!important}.b2cr-person a{display:none!important}
  .b2cr-controls{left:auto!important;right:24px!important;top:24px!important;bottom:auto!important}
  .b2cr-faq{padding:62px 0 68px!important}.b2cr-faq-grid{grid-template-columns:1fr!important;gap:26px!important}
  .b2cr-cta-inner{min-height:136px!important;flex-direction:column!important;align-items:flex-start!important;justify-content:center!important;gap:16px!important}
  .b2cr-cta a{width:100%!important;justify-content:center!important}
  body.mobile-menu-open{overflow:hidden!important}.lnav{display:none!important}.nav-wrap{display:block!important;position:fixed!important;top:10px!important;left:12px!important;right:12px!important;width:auto!important;min-height:0!important;height:auto!important;margin:0!important;padding:0!important;z-index:1400!important;pointer-events:none!important}.nav{position:relative!important;width:calc(100vw - 24px)!important;max-width:calc(100vw - 24px)!important;height:58px!important;min-height:58px!important;margin:0!important;padding:0 18px!important;display:flex!important;align-items:center!important;gap:12px!important;border:0!important;border-radius:16px!important;background:rgba(7,15,34,.96)!important;box-shadow:0 10px 30px rgba(4,10,28,.22),inset 0 0 0 1px rgba(138,164,255,.08)!important;backdrop-filter:blur(14px)!important;pointer-events:auto!important;overflow:visible!important}.brand{display:flex!important;align-items:center!important;flex:none!important;position:relative!important;z-index:1410!important;min-width:0!important;max-width:70%!important}.brand img{display:block!important;width:auto!important;max-width:100%!important;height:auto!important;max-height:26px!important}.mobile-nav-toggle{display:flex!important;position:relative!important;z-index:1410!important;margin-left:auto!important;width:38px!important;height:38px!important;padding:0!important;border:0!important;background:transparent!important;align-items:center!important;justify-content:center!important;cursor:pointer!important;flex:0 0 auto!important}.mobile-nav-panel{display:block!important;position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;padding:86px 18px 26px!important;background:#070F22!important;z-index:1350!important;overflow-y:auto!important;max-width:100vw!important;overflow-x:hidden!important}.mobile-nav-summary,.mobile-nav-direct{min-height:58px!important;color:#F4F6FF!important;font-size:16px!important;font-weight:500!important}.mobile-nav-talk{min-height:48px!important;margin-top:18px!important;border-radius:12px!important;background:#fff!important;color:#17235D!important;font-size:13px!important;font-weight:650!important;width:100%!important}
}
</style>'''
          if marker in s:
              import re
              s=re.sub(r'<style id="b2c-consistency-final-v1">.*?</style>',css,s,count=1,flags=re.S)
          else:
              s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s)
          PY
      - name: Commit and clean workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-b2c-consistency.yml
          git add industrias/marcas-b2c.html
          git commit -m "Align B2C with industry design system"
          git push
