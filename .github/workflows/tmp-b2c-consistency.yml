name: One-off B2C consistency fix

on:
  push:
    paths:
      - '.github/workflows/tmp-b2c-consistency.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply B2C consistency fixes
        run: python scripts/fix_b2c_consistency.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-b2c-consistency.yml
          git rm scripts/fix_b2c_consistency.py
          git add industrias/marcas-b2c.html
          git commit -m "Align B2C with industry design system"
          git push
