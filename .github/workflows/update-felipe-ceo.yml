name: Update Felipe profile to CEO

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_felipe_ceo.py'
      - '.github/workflows/update-felipe-ceo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update Felipe profile and Nosotros page
        run: python scripts/update_felipe_ceo.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add equipo/felipe-quiroz.html nosotros.html
          git diff --cached --quiet && exit 0
          git commit -m "Keep Felipe CEO role consistent across site"
          git push
