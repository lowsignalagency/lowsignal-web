name: Rebuild legal pages cleanly
on: push
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild legal pages from Nosotros shell
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          nosotros = (root/'nosotros.html').read_text(encoding='utf-8')
          main_start = nosotros.index('<main')
          main_tag_end = nosotros.index('>', main_start) + 1
          main_close = nosotros.index('</main>', main_tag_end)
          prefix = nosotros[:main_start]
          suffix = nosotros[main_close + len('</main>'):]

          css = r'''
          <style id="legal-clean-2026">
          .legal-clean{background:#fff;color:#0F183D}
          .legal-clean-wrap{width:min(1220px,calc(100% - 128px));margin:0 auto}
          .legal-clean-hero{padding:156px 0 78px;background:#fff;border-bottom:1px solid #DDE4F0}
          .legal-clean-kicker{margin:0;color:#1419E0;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
          .legal-clean-kicker span{display:inline-block;width:28px;height:1px;margin:0 12px 3px;background:#9CAAFE;vertical-align:middle}
          .legal-clean-hero h1{max-width:760px;margin:20px 0 0;color:#101936;font-size:clamp(54px,5.4vw,78px);line-height:.98;letter-spacing:-.055em;font-weight:300}
          .legal-clean-hero h1 strong{color:#1419E0;font-weight:300}
          .legal-clean-lead{max-width:720px;margin:26px 0 0;color:#66728E;font-size:16px;line-height:1.7}
          .legal-clean-update{margin:30px 0 0;color:#7A86A2;font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
          .legal-clean-body{padding:34px 0 96px;background:#fff}
          .legal-clean-content{max-width:980px}
          .legal-clean-content article{padding:36px 0 40px;border-bottom:1px solid #DDE4F0}
          .legal-clean-content article>span{display:block;color:#1419E0;font-size:9px;font-weight:700;letter-spacing:.12em}
          .legal-clean-content h2{margin:10px 0 0;color:#101936;font-size:clamp(28px,2.6vw,38px);line-height:1.1;letter-spacing:-.04em;font-weight:500}
          .legal-clean-content p,.legal-clean-content li{color:#63708C;font-size:15px;line-height:1.78}
          .legal-clean-content p{max-width:900px;margin:17px 0 0}
          .legal-clean-content ul,.legal-clean-content ol{max-width:900px;margin:17px 0 0;padding-left:20px}
          .legal-clean-content a{color:#1419E0;font-weight:600}
          .legal-clean-cta{padding:72px 0;background:#1419E0;color:#fff}
          .legal-clean-cta-inner{width:min(1220px,calc(100% - 128px));margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:48px}
          .legal-clean-cta p{margin:0;color:#D7DCFF;font-size:10px;font-weight:700;letter-spacing:.17em;text-transform:uppercase}
          .legal-clean-cta h2{margin:8px 0 0;color:#fff;font-size:clamp(36px,4vw,54px);line-height:1.04;letter-spacing:-.045em;font-weight:300}
          .legal-clean-cta h2 strong{color:#A7B3FF;font-weight:600}
          .legal-clean-btn{min-height:50px;padding:0 22px;border:1px solid rgba(255,255,255,.9);border-radius:14px;background:#fff;color:#1419E0;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:650;white-space:nowrap;transition:transform .2s ease,background .2s ease,box-shadow .2s ease}
          .legal-clean-btn:hover{transform:translateY(-2px);background:#F1F3FF;box-shadow:0 12px 28px rgba(0,0,0,.18)}
          @media(max-width:1100px){.legal-clean-wrap,.legal-clean-cta-inner{width:calc(100% - 48px)}}
          @media(max-width:760px){
            .legal-clean-hero{padding:112px 0 52px}
            .legal-clean-wrap,.legal-clean-cta-inner{width:calc(100% - 40px)}
            .legal-clean-hero h1{font-size:44px}
            .legal-clean-lead{font-size:15px}
            .legal-clean-body{padding:18px 0 68px}
            .legal-clean-content article{padding:28px 0 32px}
            .legal-clean-content h2{font-size:28px}
            .legal-clean-content p,.legal-clean-content li{font-size:14px;line-height:1.74}
            .legal-clean-cta{padding:58px 0}
            .legal-clean-cta-inner{flex-direction:column;align-items:flex-start;gap:28px}
          }
          </style>
          '''
          prefix_clean = prefix.replace('</head>', css + '\n</head>')

          def extract_articles(text):
              start = text.find('<div class="legal-content">')
              if start < 0:
                  raise RuntimeError('legal-content not found')
              pos = start + len('<div class="legal-content">')
              depth = 1
              token = re.compile(r'<div\b|</div>')
              for m in token.finditer(text, pos):
                  if m.group(0).startswith('<div'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          return text[pos:m.start()]
              raise RuntimeError('legal-content closing div not found')

          pages = [
              ('politica-de-privacidad.html','LEGAL <span></span> PRIVACIDAD','Política de<br><strong>Privacidad.</strong>','Cómo recopilamos, usamos y protegemos tus datos personales cuando interactúas con lowsignal.','ÚLTIMA ACTUALIZACIÓN · SEPTIEMBRE 2026','¿DUDAS SOBRE TUS DATOS?','Hablemos de <strong>privacidad.</strong>'),
              ('terminos-de-servicio.html','LEGAL <span></span> TÉRMINOS','Términos de<br><strong>Servicio.</strong>','Las condiciones que regulan el uso de lowsignal.cl y la prestación de nuestros servicios.','ÚLTIMA ACTUALIZACIÓN · SEPTIEMBRE 2026','¿TIENES DUDAS?','Hablemos de <strong>términos.</strong>')
          ]

          for filename,kicker,title,lead,update,cta_kicker,cta_title in pages:
              old = (root/filename).read_text(encoding='utf-8')
              articles = extract_articles(old)
              main = f'''<main id="top" class="legal-clean">
                <section class="legal-clean-hero">
                  <div class="legal-clean-wrap">
                    <p class="legal-clean-kicker">{kicker}</p>
                    <h1>{title}</h1>
                    <p class="legal-clean-lead">{lead}</p>
                    <p class="legal-clean-update">{update}</p>
                  </div>
                </section>
                <section class="legal-clean-body">
                  <div class="legal-clean-wrap">
                    <div class="legal-clean-content">{articles}</div>
                  </div>
                </section>
                <section class="legal-clean-cta">
                  <div class="legal-clean-cta-inner">
                    <div><p>{cta_kicker}</p><h2>{cta_title}</h2></div>
                    <a class="legal-clean-btn" href="mailto:contacto@lowsignal.cl">Escríbenos ↗</a>
                  </div>
                </section>
              </main>'''
              (root/filename).write_text(prefix_clean + main + suffix, encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/rebuild-legal-clean.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add politica-de-privacidad.html terminos-de-servicio.html .github/workflows/rebuild-legal-clean.yml
          git commit -m "fix: rebuild legal pages on clean Nosotros shell"
          git push