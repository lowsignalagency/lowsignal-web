name: Fix Dali testimonial and Karina crop
on:
  push:
    paths:
      - '.github/scripts/fix_dali_testimonial_rech_and_karina_crop.py'
      - '.github/workflows/temp-fix-dali-testimonial-rech-and-karina-crop.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/fix_dali_testimonial_rech_and_karina_crop.py
      - run: git config user.name lowsignal-bot
      - run: git config user.email actions@users.noreply.github.com
      - run: git add index.html casos/salvador-dali.html
      - run: git commit -m 'Match Dali testimonial to RECH and raise Karina crop'
        continue-on-error: true
      - run: git push
