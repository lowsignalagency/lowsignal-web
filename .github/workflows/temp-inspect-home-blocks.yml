name: Temporary inspect home blocks
on:
  push:
    paths:
      - '.github/workflows/temp-inspect-home-blocks.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Home industries
        run: python3 .github/scripts/update_home_industries.py
      - name: Commit Home update
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add index.html
          git commit -m 'Simplify home with richer industry paths' || exit 0
          git push
