name: Adjust Insights hero spacing
on:
  push:
    paths:
      - .github/workflows/adjust-insights-hero-spacing.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase hero top spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('recursos/insights.html')
          s = p.read_text()
          marker = '</body>'
          block = '''\n<style id="insights-hero-spacing-v7">\n.insights-new-hero{padding-top:168px !important;}\n@media(max-width:1100px){.insights-new-hero{padding-top:148px !important;}}\n@media(max-width:760px){.insights-new-hero{padding-top:124px !important;}}\n</style>\n'''
          if 'insights-hero-spacing-v7' in s:
              raise SystemExit('Already applied')
          if marker not in s:
              raise SystemExit('No closing body')
          p.write_text(s.replace(marker, block + marker, 1))
          PY
      - name: Verify
        run: |
          tail -n 80 recursos/insights.html | grep -q 'insights-hero-spacing-v7'
          tail -n 80 recursos/insights.html | grep -q 'padding-top:168px'
      - name: Remove workflow
        run: rm .github/workflows/adjust-insights-hero-spacing.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/insights.html .github/workflows/adjust-insights-hero-spacing.yml
          git commit -m 'fix: add breathing room above Insights hero'
          git push
