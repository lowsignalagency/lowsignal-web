name: One-time navbar scroll fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-navbar-on-scroll.yml'

permissions:
  contents: write

jobs:
  patch-navbar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep navbar visible on scroll
        shell: python
        run: |
          from pathlib import Path

          marker = 'global-fixed-navbar-v1'
          css = '''
          <style id="global-fixed-navbar-v1">
          /* Global navbar: always visible while scrolling, preserving the previous layout footprint. */
          html{scroll-padding-top:118px}
          body{padding-top:94px}
          .nav-wrap{
            position:fixed !important;
            top:18px !important;
            left:0 !important;
            right:0 !important;
            width:100% !important;
            z-index:1000 !important;
          }
          @media(max-width:760px){
            html{scroll-padding-top:96px}
            body{padding-top:76px}
            .nav-wrap{top:8px !important}
            .mobile-nav-panel{z-index:990 !important}
            .mobile-nav-toggle,.brand{position:relative !important;z-index:1010 !important}
          }
          </style>
          '''.strip()

          changed = []
          for path in Path('.').rglob('*.html'):
            text = path.read_text(encoding='utf-8')
            if marker in text or '.nav-wrap' not in text or '</head>' not in text:
              continue
            text = text.replace('</head>', css + '\n</head>', 1)
            path.write_text(text, encoding='utf-8')
            changed.append(str(path))

          print(f'Updated {len(changed)} HTML files')
          for item in changed:
            print(' -', item)

          workflow = Path('.github/workflows/fix-navbar-on-scroll.yml')
          if workflow.exists():
            workflow.unlink()

      - name: Commit navbar fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: keep navbar visible while scrolling"
          git push origin main
