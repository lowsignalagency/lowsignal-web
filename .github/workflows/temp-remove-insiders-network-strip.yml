name: Remove Insiders network strip
on:
  push:
    paths:
      - .github/scripts/remove_insiders_network_strip.py
      - .github/workflows/temp-remove-insiders-network-strip.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove strip
        run: python .github/scripts/remove_insiders_network_strip.py
      - name: Commit changes
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add recursos/insiders.html
          git commit -m "Remove Insiders network strip" || exit 0
          git push
