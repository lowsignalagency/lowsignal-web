name: Sync Jobs shell with Home

on:
  push:
    paths:
      - '.github/workflows/sync-jobs-shell.yml'

permissions:
  contents: write

jobs:
  sync-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync current Home navigation and footer into Jobs pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          home_path = Path('index.html')
          home = home_path.read_text()
          targets = [
              Path('recursos/jobs.html'),
              Path('recursos/jobs/growth-ambassador.html'),
          ]

          def body_prefix(text):
              m_body = re.search(r'<body[^>]*>', text, re.I)
              m_main = re.search(r'<main\b', text, re.I)
              if not m_body or not m_main:
                  raise RuntimeError('Could not locate body/main boundaries')
              return text[m_body.end():m_main.start()]

          home_prefix = body_prefix(home)

          m_footer = re.search(r'(?s)<footer\b.*?</footer>', home, re.I)
          if not m_footer:
              raise RuntimeError('Home footer not found')
          home_footer = m_footer.group(0)

          style_ids = [
              'video-accurate-navbar-v21',
              'global-persistent-navbar-v3',
              'global-visible-navbar-fixed-v1',
              'global-mobile-navbar-polish-v1',
              'global-mobile-navbar-polish-v2',
          ]
          script_ids = [
              'low-social-v16-mobile-nav-controller',
          ]

          def extract_tag(text, tag, tid):
              m = re.search(rf'(?s)<{tag}\s+id=[\"\']{re.escape(tid)}[\"\'][^>]*>.*?</{tag}>', text, re.I)
              return m.group(0) if m else None

          home_styles = {sid: extract_tag(home, 'style', sid) for sid in style_ids}
          home_scripts = {sid: extract_tag(home, 'script', sid) for sid in script_ids}

          for path in targets:
              text = path.read_text()

              # Replace everything between <body> and <main> with Home's exact nav shell.
              m_body = re.search(r'<body[^>]*>', text, re.I)
              m_main = re.search(r'<main\b', text, re.I)
              if not m_body or not m_main:
                  raise RuntimeError(f'Could not locate shell boundaries in {path}')
              text = text[:m_body.end()] + '\n' + home_prefix.strip() + '\n\n' + text[m_main.start():]

              # Replace footer markup with exact current Home footer.
              text, count = re.subn(r'(?s)<footer\b.*?</footer>', home_footer, text, count=1, flags=re.I)
              if count == 0:
                  text = text.replace('</body>', home_footer + '\n</body>', 1)

              # Replace/append the exact current nav style blocks from Home.
              for sid, block in home_styles.items():
                  if not block:
                      continue
                  pattern = rf'(?s)<style\s+id=[\"\']{re.escape(sid)}[\"\'][^>]*>.*?</style>'
                  if re.search(pattern, text, re.I):
                      text = re.sub(pattern, block, text, count=1, flags=re.I)
                  else:
                      text = text.replace('</body>', block + '\n</body>', 1)

              # Replace/append mobile nav controller.
              for sid, block in home_scripts.items():
                  if not block:
                      continue
                  pattern = rf'(?s)<script\s+id=[\"\']{re.escape(sid)}[\"\'][^>]*>.*?</script>'
                  if re.search(pattern, text, re.I):
                      text = re.sub(pattern, block, text, count=1, flags=re.I)
                  else:
                      text = text.replace('</body>', block + '\n</body>', 1)

              path.write_text(text)
              print('synced', path)
          PY
      - name: Commit synchronized shell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/jobs.html recursos/jobs/growth-ambassador.html
          if git diff --cached --quiet; then
            echo 'No shell changes needed'
          else
            git commit -m 'fix: sync Jobs navbar and footer with current Home'
            git push
          fi
