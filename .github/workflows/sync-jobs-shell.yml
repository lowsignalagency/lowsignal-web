name: Sync Jobs shell with Home

on:
  push:
    paths:
      - '.github/workflows/sync-jobs-shell.yml'

permissions:
  contents: write

jobs:
  sync-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync current Home navigation and footer into Jobs pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          home = Path('index.html').read_text()
          targets = [Path('recursos/jobs.html'), Path('recursos/jobs/growth-ambassador.html')]

          def body_prefix(text):
              m_body = re.search(r'<body[^>]*>', text, re.I)
              m_main = re.search(r'<main\b', text, re.I)
              if not m_body or not m_main:
                  raise RuntimeError('Could not locate body/main boundaries')
              return text[m_body.end():m_main.start()]

          home_prefix = body_prefix(home)
          m_footer = re.search(r'(?s)<footer\b.*?</footer>', home, re.I)
          if not m_footer:
              raise RuntimeError('Home footer not found')
          home_footer = m_footer.group(0)

          style_ids = [
              'video-accurate-navbar-v21',
              'global-persistent-navbar-v3',
              'global-visible-lnav-fixed-v1',
              'global-mobile-navbar-polish-v1',
              'global-mobile-navbar-polish-v2',
          ]
          script_ids = ['low-social-v16-mobile-nav-controller']

          def extract_tag(text, tag, tid):
              m = re.search(rf'(?s)<{tag}\s+id=[\"\']{re.escape(tid)}[\"\'][^>]*>.*?</{tag}>', text, re.I)
              return m.group(0) if m else None

          home_styles = {sid: extract_tag(home, 'style', sid) for sid in style_ids}
          home_scripts = {sid: extract_tag(home, 'script', sid) for sid in script_ids}

          polish = r'''
<style id="jobs-system-polish-v2">
@media(min-width:1101px){
  body>.lnav{position:fixed!important;top:0!important;left:0!important;right:0!important;width:100%!important;z-index:2000!important}
  .lnav-row{width:min(1220px,calc(100% - 128px))!important;height:88px!important;gap:36px!important}
  .lnav-logo img{height:27px!important;width:auto!important}
  .lnav-menu{gap:32px!important}
  .lnav-trigger,.lnav-direct{font-size:13px!important;font-weight:500!important}
  .lnav-actions{gap:10px!important;margin-left:4px!important}
  .lnav-contact{min-height:44px!important;padding:0 22px!important;font-size:13px!important;border-radius:999px!important}
  .lnav-mega{top:88px!important}
  .lnav-mega-inner{width:min(1220px,calc(100% - 128px))!important;gap:68px!important}
}
@media(max-width:1100px) and (min-width:761px){
  .lnav-row,.lnav-mega-inner{width:calc(100% - 48px)!important}
  .lnav-row{height:80px!important;gap:22px!important}
  .lnav-menu{gap:20px!important}
  .lnav-trigger,.lnav-direct{font-size:12px!important}
  .lnav-contact{min-height:40px!important;padding:0 17px!important;font-size:12px!important}
  .lnav-mega{top:80px!important}
}
.jobs26-hero .container,.jobs26-culture .container,.jobs26-work .container,.jobs26-roles .container,.jobs26-process .container,.ga26-hero .container,.ga26-content .container{width:min(1220px,calc(100% - 128px))!important;max-width:1220px!important;margin-inline:auto!important}
.jobs26-hero{padding-top:154px!important}
.jobs26-hero h1{font-size:clamp(50px,4.6vw,66px)!important;line-height:1.02!important;max-width:760px!important}
.jobs26-lead{font-size:16px!important;line-height:1.68!important;max-width:690px!important}
.jobs26-head h2,.jobs26-work h2,.jobs26-process h2{font-size:clamp(34px,3.35vw,46px)!important;line-height:1.09!important}
.jobs26-head>p{font-size:13px!important;line-height:1.68!important}
.jobs26-culture-grid h3{font-size:18px!important}.jobs26-culture-grid p{font-size:12px!important}
.jobs26-role-main h3{font-size:27px!important}.jobs26-role-main p{font-size:12.5px!important}
.ga26-hero{padding-top:154px!important}.ga26-hero h1{font-size:clamp(50px,4.6vw,66px)!important;line-height:1.02!important}.ga26-lead{font-size:16px!important;line-height:1.68!important}.ga26-summary>strong{font-size:38px!important}
.ga26-body h2{font-size:clamp(34px,3.35vw,46px)!important;line-height:1.09!important}.ga26-body h3{font-size:23px!important}.ga26-body p{font-size:14px!important;line-height:1.72!important}.ga26-body li{font-size:13.5px!important}
@media(max-width:1100px){.jobs26-hero .container,.jobs26-culture .container,.jobs26-work .container,.jobs26-roles .container,.jobs26-process .container,.ga26-hero .container,.ga26-content .container{width:calc(100% - 48px)!important}}
@media(max-width:760px){
  .jobs26-hero .container,.jobs26-culture .container,.jobs26-work .container,.jobs26-roles .container,.jobs26-process .container,.ga26-hero .container,.ga26-content .container{width:calc(100% - 40px)!important}
  .jobs26-hero,.ga26-hero{padding-top:124px!important}
  .jobs26-hero h1,.ga26-hero h1{font-size:35px!important;line-height:1.05!important;max-width:320px!important}
  .jobs26-lead,.ga26-lead{font-size:14px!important;line-height:1.65!important}
  .jobs26-head h2,.jobs26-work h2,.jobs26-process h2,.ga26-body h2{font-size:28px!important;line-height:1.1!important;max-width:320px!important}
  .jobs26-role-main h3{font-size:23px!important}.ga26-body h3{font-size:21px!important}.ga26-body p{font-size:13.5px!important}
}
</style>
'''

          for path in targets:
              text = path.read_text()
              m_body = re.search(r'<body[^>]*>', text, re.I)
              m_main = re.search(r'<main\b', text, re.I)
              if not m_body or not m_main:
                  raise RuntimeError(f'Could not locate shell boundaries in {path}')
              text = text[:m_body.end()] + '\n' + home_prefix.strip() + '\n\n' + text[m_main.start():]
              text, count = re.subn(r'(?s)<footer\b.*?</footer>', home_footer, text, count=1, flags=re.I)
              if count == 0:
                  text = text.replace('</body>', home_footer + '\n</body>', 1)
              for sid, block in home_styles.items():
                  if not block: continue
                  pattern = rf'(?s)<style\s+id=[\"\']{re.escape(sid)}[\"\'][^>]*>.*?</style>'
                  text = re.sub(pattern, block, text, count=1, flags=re.I) if re.search(pattern, text, re.I) else text.replace('</body>', block + '\n</body>', 1)
              for sid, block in home_scripts.items():
                  if not block: continue
                  pattern = rf'(?s)<script\s+id=[\"\']{re.escape(sid)}[\"\'][^>]*>.*?</script>'
                  text = re.sub(pattern, block, text, count=1, flags=re.I) if re.search(pattern, text, re.I) else text.replace('</body>', block + '\n</body>', 1)
              text = re.sub(r'(?s)<style id="jobs-system-polish-v2">.*?</style>', '', text)
              text = text.replace('</head>', polish + '\n</head>', 1)
              path.write_text(text)
              print('synced/polished', path)
          PY
      - name: Commit synchronized shell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/jobs.html recursos/jobs/growth-ambassador.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'fix: align Jobs with current design system'
            git push
          fi
