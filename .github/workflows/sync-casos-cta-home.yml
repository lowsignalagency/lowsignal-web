name: Sync Casos CTA with Home

on:
  push:
    paths:
      - .github/workflows/sync-casos-cta-home.yml

permissions:
  contents: write

jobs:
  sync-cta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match Home CTA sizing
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/sync_cta.py
          python /tmp/sync_cta.py

      - name: Commit changes
        shell: bash
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add casos.html
          git commit -m "Match Casos CTA sizing to Home" || exit 0
          git push
