name: Fix Casos final CTA

on:
  push:
    paths:
      - '.github/workflows/fix-casos-final-cta.yml'

permissions:
  contents: write

jobs:
  fix-cta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update final CTA copy and button
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('casos.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '<p>¿CONSTRUIMOS EL PRÓXIMO CASO?</p>\n        <h2>Tu crecimiento.<br><strong>Con sistema.</strong></h2>',
              '<p>BUILD WHAT\'S NEXT.</p>\n        <h2>Construimos<br><strong>lo que viene.</strong></h2>'
          )

          text = re.sub(
              r'<style id="casos-final-cta-v2">[\s\S]*?</style>\s*',
              '',
              text
          )

          css = '''
<style id="casos-final-cta-v2">
.stories-new-final{
  padding:72px 0 !important;
  background:linear-gradient(135deg,#1419E0 0%,#0F1F8C 100%) !important;
}
.stories-new-final-inner{
  align-items:center !important;
}
.stories-new-final p{
  color:#C9D3FF !important;
  font-size:10px !important;
  font-weight:700 !important;
  letter-spacing:.18em !important;
}
.stories-new-final h2{
  margin-top:12px !important;
  font-size:clamp(42px,4.4vw,60px) !important;
  line-height:1.02 !important;
  letter-spacing:-.05em !important;
}
.stories-new-final h2 strong{
  color:#FFFFFF !important;
  font-weight:700 !important;
}
.stories-new-final a{
  min-height:44px !important;
  height:44px !important;
  padding:0 18px !important;
  border-radius:9px !important;
  background:#FFFFFF !important;
  color:#101B4F !important;
  font-size:12px !important;
  font-weight:700 !important;
  box-shadow:none !important;
}
.stories-new-final a:hover{
  transform:translateY(-2px) !important;
  background:#F3F5FF !important;
  box-shadow:0 10px 24px rgba(0,0,0,.12) !important;
}
@media(max-width:760px){
  .stories-new-final{padding:58px 0 !important}
  .stories-new-final h2{font-size:38px !important}
  .stories-new-final a{width:auto !important;min-width:120px !important}
}
</style>
'''
          text = text.replace('</head>', css + '\n</head>', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit CTA fix
        shell: bash
        run: |
          git config user.name "lowsignal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add casos.html
          git commit -m "Update Casos final CTA to build what's next" || exit 0
          git push
