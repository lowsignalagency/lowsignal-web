name: Add team profile LinkedIn

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_team_profile_linkedin.py'
      - '.github/workflows/add-team-profile-linkedin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add LinkedIn links
        run: python scripts/add_team_profile_linkedin.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add equipo/martin-alvarado.html equipo/jorge-munoz.html equipo/lia-morice.html
          git diff --cached --quiet && exit 0
          git commit -m "Add LinkedIn links to team profiles"
          git push
# trigger team linkedin
