name: Zoom out Insiders photos
on:
  push:
    paths:
      - .github/scripts/zoom_out_insiders_photos.py
      - .github/workflows/temp-zoom-out-insiders-photos.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Adjust photo framing
        run: python .github/scripts/zoom_out_insiders_photos.py
      - name: Commit changes
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add recursos/insiders.html
          git commit -m "Adjust Insiders photo framing" || exit 0
          git push
