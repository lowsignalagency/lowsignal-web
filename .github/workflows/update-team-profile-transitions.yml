name: Update team profile transitions
on:
  push:
    paths:
      - '.github/workflows/update-team-profile-transitions.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/update_team_profile_transitions.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add nosotros.html equipo/*.html
          git diff --cached --quiet || git commit -m 'Add smooth transitions across team profiles'
          git push
