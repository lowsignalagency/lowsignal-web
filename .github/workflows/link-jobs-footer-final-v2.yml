name: Link Jobs footer final v2
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link final footer CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tag='<link rel="stylesheet" href="https://lowsignal.cl/assets/jobs-footer-home-final-v2.css?v=2">'
          for p in [Path('recursos/jobs.html'), Path('recursos/jobs/growth-ambassador.html')]:
              s=p.read_text()
              if tag not in s:
                  s=s.replace('</head>', tag+'\n</head>', 1)
              p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/link-jobs-footer-final-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/jobs.html recursos/jobs/growth-ambassador.html .github/workflows/link-jobs-footer-final-v2.yml
          git commit -m 'fix: align Jobs footer to final Home margins'
          git push
