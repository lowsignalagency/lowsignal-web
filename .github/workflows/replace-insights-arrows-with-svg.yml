name: Replace Insights arrows with SVG
on:
  push:
    paths:
      - .github/workflows/replace-insights-arrows-with-svg.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace arrows with SVG
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('recursos/insights.html')
          s = p.read_text()
          svg = '<svg class="insights-arrow-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M17 7H9M17 7V15"/></svg>'
          def repl(m):
              label = re.sub(r'\s+', ' ', m.group(1)).strip()
              return f'<div class="insights-new-read">{label}{svg}</div>'
          s, n = re.subn(r'<div class="insights-new-read">\s*([^<]*?)\s*</div>', repl, s)
          if n < 2:
              raise SystemExit(f'Expected multiple CTA replacements, got {n}')
          s = re.sub(r'\n?<style id="insights-svg-arrow-final">.*?</style>\n?', '\n', s, flags=re.S)
          css = '<style id="insights-svg-arrow-final">.insights-new-read::before,.insights-new-read::after{content:none!important;display:none!important}.insights-arrow-svg{width:17px!important;height:17px!important;flex:0 0 17px!important;display:block!important;overflow:visible!important}.insights-arrow-svg path{fill:none!important;stroke:currentColor!important;stroke-width:2.2!important;stroke-linecap:round!important;stroke-linejoin:round!important}.insights-new-feature-copy .insights-new-read{display:inline-flex!important;align-items:center!important;gap:9px!important;color:#1419E0!important}.insights-new-card .insights-new-read{display:flex!important;align-items:center!important;justify-content:center!important;position:relative!important;color:#1419E0!important}.insights-new-card .insights-new-read .insights-arrow-svg{margin:0!important;transform:none!important}.insights-new-card:hover .insights-new-read{color:#fff!important}</style>'
          s = s.replace('</body>', css + '\n</body>', 1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'insights-arrow-svg' recursos/insights.html
          grep -q 'insights-svg-arrow-final' recursos/insights.html
      - name: Remove workflow
        run: rm .github/workflows/replace-insights-arrows-with-svg.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/insights.html .github/workflows/replace-insights-arrows-with-svg.yml
          git commit -m 'fix: use centered SVG arrows in Insights'
          git push
