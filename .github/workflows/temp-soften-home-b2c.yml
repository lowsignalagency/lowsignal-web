name: Temporary soften Home B2C
on:
  push:
    paths:
      - '.github/scripts/soften_home_b2c.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Soften B2C section
        run: python3 .github/scripts/soften_home_b2c.py
      - name: Commit Home update
        run: |
          git config user.name lowsignal-bot
          git config user.email actions@users.noreply.github.com
          git add index.html
          git commit -m "Soften Home B2C section" || exit 0
          git push
