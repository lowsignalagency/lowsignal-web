name: Refresh 404 and legal pages

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild pages on Nosotros shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64

          repo = Path('.')
          nosotros = (repo / 'nosotros.html').read_text(encoding='utf-8')

          body_open_match = re.search(r'(?s)(<body[^>]*>)(.*?)(<main id="top">)', nosotros)
          footer_match = re.search(r'(?s)(<footer.*)$', nosotros)
          if not body_open_match or not footer_match:
              raise SystemExit('Could not extract Nosotros shell')

          nav_shell = body_open_match.group(2)
          body_open = body_open_match.group(1)
          footer_shell = footer_match.group(1)
          base_head = nosotros[:nosotros.index('</head>') + len('</head>')]

          legal_css = base64.b64decode('').decode()
          error_css = base64.b64decode('').decode()

          targets = {
              'politica-de-privacidad.html': legal_css,
              'terminos-de-servicio.html': legal_css,
              '404.html': error_css,
          }

          for filename, extra_css in targets.items():
              path = repo / filename
              old = path.read_text(encoding='utf-8')
              title_match = re.search(r'(?s)<title>(.*?)</title>', old)
              title = title_match.group(1) if title_match else 'lowsignal'
              main_match = re.search(r'(?s)<main id="top">.*?</main>', old)
              if not main_match:
                  raise SystemExit(f'Main not found in {filename}')
              main = main_match.group(0)

              head = re.sub(r'(?s)<title>.*?</title>', f'<title>{title}</title>', base_head, count=1)
              if filename == '404.html' and 'name="robots"' not in head:
                  head = head.replace('</head>', '<meta name="robots" content="noindex,follow">\n</head>')
              head = head.replace('</head>', extra_css + '\n</head>')

              rebuilt = head + '\n' + body_open + '\n' + nav_shell + '\n' + main + '\n' + footer_shell
              path.write_text(rebuilt, encoding='utf-8')
              print(filename, 'rebuilt')
          PY
      - name: Commit
        run: |
          rm .github/workflows/refresh-legal-404-shell-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 404.html politica-de-privacidad.html terminos-de-servicio.html .github/workflows/refresh-legal-404-shell-once.yml
          git commit -m "feat: refresh 404 and legal pages"
          git push
