name: Restore Jobs styles on Nosotros shell

on:
  push:
    paths:
      - '.github/workflows/restore-jobs-content-styles-on-nosotros-shell.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore only Jobs-scoped CSS and JS from pre-clean version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          SOURCE_COMMIT = 'd31b126a9aa83cc9bf1343bd2568361a56f326a1'

          def git_show(path):
              return subprocess.check_output(['git','show',f'{SOURCE_COMMIT}:{path}'], text=True)

          def matching_brace(text, open_idx):
              depth=0; i=open_idx; quote=None; esc=False; comment=False
              while i < len(text):
                  if comment:
                      if text.startswith('*/', i): comment=False; i+=2; continue
                      i+=1; continue
                  if not quote and text.startswith('/*', i): comment=True; i+=2; continue
                  c=text[i]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      i+=1; continue
                  if c in ('"',"'"): quote=c
                  elif c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0: return i
                  i+=1
              raise RuntimeError('Unbalanced CSS')

          def filter_css(css, needles):
              out=[]; i=0
              while i < len(css):
                  if css.startswith('/*', i):
                      j=css.find('*/', i+2)
                      if j<0: break
                      i=j+2; continue
                  if css[i].isspace(): i+=1; continue
                  brace=css.find('{', i)
                  semi=css.find(';', i)
                  if brace<0: break
                  if semi>=0 and semi<brace:
                      i=semi+1; continue
                  prelude=css[i:brace].strip()
                  end=matching_brace(css, brace)
                  body=css[brace+1:end]
                  low=prelude.lower()
                  if low.startswith('@media') or low.startswith('@supports') or low.startswith('@layer'):
                      inner=filter_css(body, needles)
                      if inner.strip(): out.append(f'{prelude}{{\n{inner}\n}}')
                  elif any(n in prelude for n in needles):
                      out.append(f'{prelude}{{{body}}}')
                  i=end+1
              return '\n'.join(out)

          jobs = [
              ('recursos/jobs.html', ('jobs26',), True),
              ('recursos/jobs/growth-ambassador.html', ('ga26',), False),
          ]

          for path_str, needles, add_fix in jobs:
              path=Path(path_str)
              current=path.read_text(encoding='utf-8')
              source=git_show(path_str)

              css=[]
              for sm in re.finditer(r'<style[^>]*>(.*?)</style>', source, re.S|re.I):
                  f=filter_css(sm.group(1), needles)
                  if f.strip(): css.append(f)
              page_css='\n'.join(css)
              if len(page_css) < 1000:
                  raise RuntimeError(f'{path_str}: scoped CSS unexpectedly small ({len(page_css)})')

              # remove any previous clean scoped block/link first
              current=re.sub(r'\n?<style id="jobs-clean-page-styles">.*?</style>\n?', '\n', current, flags=re.S|re.I)
              current=re.sub(r'\n?<link rel="stylesheet" href="https://lowsignal\.cl/assets/jobs-page-fixes\.css\?v=\d+">\n?', '\n', current, flags=re.I)

              extra='\n<style id="jobs-clean-page-styles">\n'+page_css+'\n</style>\n'
              if add_fix:
                  extra+='<link rel="stylesheet" href="https://lowsignal.cl/assets/jobs-page-fixes.css?v=11">\n'
              current=current.replace('</head>', extra+'</head>', 1)

              # Restore only page-scoped scripts (e.g. reveal controller), never shell/nav scripts.
              scoped_scripts=[]
              for m in re.finditer(r'<script([^>]*)>(.*?)</script>', source, re.S|re.I):
                  attrs=m.group(1)
                  whole=m.group(0)
                  if any(n in attrs for n in needles):
                      scoped_scripts.append(whole)
              if scoped_scripts:
                  # de-duplicate any existing copies by id
                  for s in scoped_scripts:
                      mid=re.search(r'id=["\']([^"\']+)["\']', s, re.I)
                      if mid:
                          sid=re.escape(mid.group(1))
                          current=re.sub(rf'\n?<script[^>]*id=["\']{sid}["\'][^>]*>.*?</script>\n?', '\n', current, flags=re.S|re.I)
                  current=current.replace('</body>', '\n'+'\n'.join(scoped_scripts)+'\n</body>', 1)

              # No scoped CSS may touch shell selectors.
              low=page_css.lower()
              forbidden=['.lnav','.nav-wrap','.nav-','footer','.footer','.mobile-nav']
              for token in forbidden:
                  if token in low:
                      raise RuntimeError(f'{path_str}: scoped CSS leaked shell selector {token}')

              # document must stay structurally clean
              assert current.count('<head>')==1 and current.count('</head>')==1
              assert current.count('<body>')==1 and current.count('</body>')==1
              assert len(re.findall(r'<main\b',current,re.I))==1
              assert len(re.findall(r'<footer\b',current,re.I))==1

              path.write_text(current,encoding='utf-8')
              print(f'{path_str}: restored scoped CSS={len(page_css)} chars; scripts={len(scoped_scripts)}')
          PY
      - name: Verify shell remains byte-identical to Nosotros
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          ref=Path('nosotros.html').read_text(encoding='utf-8')
          def part(pat,txt):
              m=re.search(pat,txt,re.S|re.I)
              if not m: raise RuntimeError(pat)
              return m.group(0)
          ref_nav=part(r'<header class="lnav"[^>]*>.*?</header>',ref)
          ref_footer=part(r'<footer[^>]*>.*?</footer>',ref)
          for p in ['recursos/jobs.html','recursos/jobs/growth-ambassador.html']:
              t=Path(p).read_text(encoding='utf-8')
              assert part(r'<header class="lnav"[^>]*>.*?</header>',t)==ref_nav
              assert part(r'<footer[^>]*>.*?</footer>',t)==ref_footer
              print(p+': navbar/footer EXACT match with nosotros.html')
          PY
      - name: Commit restored Jobs content styles and remove workflow
        run: |
          rm .github/workflows/restore-jobs-content-styles-on-nosotros-shell.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recursos/jobs.html recursos/jobs/growth-ambassador.html .github/workflows/restore-jobs-content-styles-on-nosotros-shell.yml
          git commit -m "fix: restore Jobs content styles on Nosotros shell"
          git push
