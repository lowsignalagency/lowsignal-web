name: Fix Jobs footer and CTA once
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync Home footer and CTA polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          home = Path('index.html').read_text()
          m = re.search(r'<footer>.*?</footer>', home, flags=re.S)
          if not m:
              raise SystemExit('Home footer not found')
          footer = m.group(0)

          for f in [Path('recursos/jobs.html'), Path('recursos/jobs/growth-ambassador.html')]:
              s = f.read_text()
              s, n = re.subn(r'<footer>.*?</footer>', footer, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Footer not replaced in {f}')
              s = re.sub(r'jobs-page-fixes\.css\?v=\d+', 'jobs-page-fixes.css?v=6', s)
              f.write_text(s)

          css = Path('assets/jobs-page-fixes.css')
          s = css.read_text()
          marker = '/* JOBS FINAL FOOTER + CTA LOCK V6 */'
          if marker in s:
              s = s.split(marker)[0].rstrip() + '\n'
          s += r'''

/* JOBS FINAL FOOTER + CTA LOCK V6 */
.jobs26-final-cta-actions a{
  transition:transform .22s ease,box-shadow .22s ease,background-color .22s ease,border-color .22s ease,color .22s ease!important;
}
@media(hover:hover){
  .jobs26-final-cta-actions a:first-child:hover{
    transform:translateY(-3px)!important;
    background:#F4F6FF!important;
    color:#1419E0!important;
    box-shadow:0 14px 34px rgba(5,10,24,.22)!important;
  }
  .jobs26-final-cta-actions a:last-child:hover{
    transform:translateY(-3px)!important;
    background:rgba(255,255,255,.12)!important;
    border-color:rgba(255,255,255,.82)!important;
    color:#fff!important;
    box-shadow:0 12px 28px rgba(5,10,24,.14)!important;
  }
}

/* Compact footer to match current Home density */
footer{
  padding:42px 0 18px!important;
}
footer .footer-container{
  width:min(1220px,calc(100% - 128px))!important;
  max-width:1220px!important;
}
.footer-main{
  grid-template-columns:1.25fr .7fr .7fr .7fr!important;
  gap:34px!important;
}
.footer-brand img{height:21px!important}
.footer-brand-copy{
  max-width:310px!important;
  margin-top:14px!important;
  font-size:11.5px!important;
  line-height:1.58!important;
}
.footer-claim{
  margin-top:14px!important;
  font-size:14px!important;
}
.footer-ai{
  max-width:360px!important;
  margin-top:18px!important;
  padding-top:14px!important;
}
.footer-ai-label{margin-bottom:10px!important;font-size:11.5px!important}
.footer-ai-buttons{gap:8px!important}
.footer-ai-button{width:36px!important;height:36px!important;border-radius:9px!important}
.footer-ai-icon{width:16px!important;height:16px!important}
.footer-title{margin-bottom:13px!important;font-size:9px!important}
.footer-links{gap:8px!important}
.footer-links a{font-size:11.5px!important}
.footer-meta{
  margin-top:26px!important;
  padding:13px 0!important;
  font-size:10px!important;
}
.footer-meta-social a{width:30px!important;height:30px!important;border-radius:8px!important}
.footer-meta-social .brand-svg{width:14px!important;height:14px!important;flex-basis:14px!important}
.footer-bottom{
  padding-top:13px!important;
  font-size:10px!important;
}
.footer-made-latam{font-size:9px!important}
.footer-made-country img{width:34px!important}
.footer-bottom-links{gap:18px!important}
@media(max-width:1100px){
  footer .footer-container{width:calc(100% - 48px)!important}
}
@media(max-width:620px){
  footer{padding:38px 0 16px!important}
  footer .footer-container{width:calc(100% - 40px)!important}
  .footer-main{grid-template-columns:1fr!important;gap:28px!important}
}
'''
          css.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/fix-jobs-footer-cta-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/jobs.html recursos/jobs/growth-ambassador.html assets/jobs-page-fixes.css .github/workflows/fix-jobs-footer-cta-once.yml
          git commit -m 'fix: sync Jobs footer with Home and add CTA hovers'
          git push
