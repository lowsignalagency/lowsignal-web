name: Raise Karina crop
on:
  push:
    paths:
      - '.github/scripts/raise_karina_crop.py'
      - '.github/workflows/temp-raise-karina-crop.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/raise_karina_crop.py
      - run: git config user.name lowsignal-bot
      - run: git config user.email actions@users.noreply.github.com
      - run: git add index.html
      - run: git commit -m 'Raise Karina testimonial crop'
        continue-on-error: true
      - run: git push
